<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <!-- jquery -->

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
    <link href="css/Pretendard.css">

	<!-- CSS 충돌 체크 -->
	<link rel="stylesheet" href="ai_sol_css/renewal/fullpage.min.css">
	<link rel="stylesheet" href="ai_sol_css/renewal/aos.css">
	<link rel="stylesheet" href="ai_sol_css/renewal/style.css">
	<link rel="stylesheet" href="ai_sol_css/renewal/custom.css">
	<link rel="stylesheet" href="ai_sol_css/renewal/add.css">
	<link rel="stylesheet" href="ai_sol_css/paging.css">
	<link rel="stylesheet" href="ai_sol_css/jquery-ui-1.10.4.custom.min.css">
	<link rel="stylesheet" href="ai_sol_css/jquery.datetimepicker.css">
	<link rel="stylesheet" href="ai_sol_css/popup.css">

</head>

<body>

    
    <div class="ml_wrap mypage_wrap">

       	<!-- header -->
		<header class="ml_header">
			<div class="inner h_inner">
				<div class="h_logo">
					<a href="" class="logo"><img src="img/logo.png" alt="" /></a>
					<span class="txt">AI Solution</span>
				</div>				
				<div class="h_side">
					<a href="" class="button small typeB">로그인</a>
					<a href="" class="button small typeB">마이페이지</a>
					<a href="" class="button small typeB">1:1문의</a>
				</div>
			</div>
		</header>		

		<!-- container -->
        <div class="container">

			<div class="sub_top mypage_top">
				<!-- breadcrumb -->
				<div class="breadcrumb inner white">
					<a href="" class="home"></a>
					<span class="arrow"></span>
					<a href="" class="txt link">마이페이지</a>
				</div>

				<div class="txtbox inner">
					<p class="tit">마이페이지</p>
					<p class="desc">
						입사지원 현황부터 스크랩 자료까지, 한눈에 확인하고 관리하세요.
						<br>
						맞춤형 알림 설정과 함께, 취업 준비를 더 체계적이고 편리하게 할 수 있도록 돕습니다.
					</p>
				</div>
			</div>

            <section class="section mypage_section">
                <div class="inner">
					<div class="mypage_wrap">
						<div class="tab_navbox ver2">
							<div class="tab_nav">
								<a href="" class="link">지원관리</a>
							</div>
							<div class="tab_nav on">
								<a href="" class="link">정보관리</a>
							</div>
						</div>
						<section class="info_section">
							<div class="mypage_titbox">
								<p class="page_title">정보관리</p>
								<div class="tab_navbox">
									<div class="tab_nav on">
										<a href="" class="link">기본정보</a>
									</div>
									<div class="tab_nav">
										<a href="" class="link">비밀번호 변경</a>
									</div>
									<div class="tab_nav">
										<a href="" class="link">알림 서비스</a>
									</div>
									<div class="tab_nav">
										<a href="" class="link">회원탈퇴</a>
									</div>
								</div>
							</div>
							<div class="form_wrap">
								<p class="form_tit">기본정보</p>
								<div class="form_box">
									<div class="form_item">
										<div class="input_box">
											<p class="label_text">아이디</p>
											<input type="text" class="input_text" placeholder="아이디를 작성해주세요." value="veti3538" readonly>
										</div>
										<div class="input_box">
											<p class="label_text">이름</p>
											<input type="text" class="input_text" placeholder="이름을 작성해주세요." value="천종수" readonly>
										</div>
									</div>
									<div class="form_item">
										<div class="input_box mob_column">
											<label class="label_text">
												닉네임
											</label>
											<div class="input_item">
												<input type="text" class="input_text" placeholder="닉네임을 입력해주세요.">
												<button type="button" class="button typeC input_btn">중복확인</button>
											</div>
										</div>
										<div class="input_box mob_column">
											<label class="label_text">
												이메일
											</label>
											<div class="input_item email_item">
												<input type="text" class="input_text mx230 email_input" placeholder="이메일 주소">
												<span class="input_txt email_txt">@</span>
												<div class="select_box mx230 email_select">
													<select class="select">
														<option value="">메일 계정 선택</option>
														<option value="naver.com">naver.com</option>
														<option value="gmail.com">gmail.com</option>
														<option value="daum.net">daum.net</option>
														<option value="hanmail.net">hanmail.net</option>
														<option value="nate.com">nate.com</option>
														<option value="hotmail.com">hotmail.com</option>
														<option value="yahoo.com">yahoo.com</option>
														<option value="icloud.com">icloud.com</option>
													</select>
												</div>
											</div>
										</div>
									</div>
									<div class="form_item">
										<div class="input_box mob_column">
											<p class="label_text">생년월일</p>
											<input type="text" class="input_text" placeholder="생년월일을 입력해 주세요. (예시 : 20131225)">
										</div>
										<div class="input_box mob_column">
											<label class="label_text">
												휴대폰
											</label>
											<div class="input_item">
												<input type="text" class="input_text" placeholder="휴대폰번호를 입력해주세요.">
												<button type="button" class="button typeC input_btn">인증요청</button>
											</div>
										</div>
									</div>
								</div>
								<div class="form_btn">
									<button type="button" class="button big typeB cancel_btn">취소</button>
									<button type="button" class="button big typeA submit_btn">확인</button>
								</div>
							</div>		
						</section>
					</div>					
                </div>
            </section>			

        </div> 
		
		<!-- footer -->
		<footer class="ml_footer">
			<div class="inner f_inner">
				<span class="copyright">copyright ⓒ 2022 by EDUCE, All Rights Reserved. </span>
				<a href="javascropt:" onclick="inquiryPop('com')" class="inq_btn">
					<span>사업 문의</span>
					<img src="img/ic_mail.png" alt="" class="icon">
				</a>
			</div>
		</footer>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
