<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이루핏 - AI솔루션</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
    <link href="css/Pretendard.css">

	<!-- CSS 충돌 체크 -->
	<link rel="stylesheet" href="ai_sol_css/renewal/fullpage.min.css">
	<link rel="stylesheet" href="ai_sol_css/renewal/aos.css">
	<link rel="stylesheet" href="ai_sol_css/renewal/style.css">
	<link rel="stylesheet" href="ai_sol_css/renewal/custom.css">
	<link rel="stylesheet" href="ai_sol_css/renewal/add.css">
	<link rel="stylesheet" href="ai_sol_css/paging.css">
	<link rel="stylesheet" href="ai_sol_css/jquery-ui-1.10.4.custom.min.css">
	<link rel="stylesheet" href="ai_sol_css/jquery.datetimepicker.css">
	<link rel="stylesheet" href="ai_sol_css/popup.css">

</head>

<body>

    
    <div class="ml_wrap join_wrap">

        <!-- header -->
		<header class="ml_header">
			<div class="inner h_inner">
				<div class="h_logo">
					<a href="" class="logo"><img src="img/logo.png" alt="" /></a>
					<span class="txt">AI Solution</span>
				</div>				
				<div class="h_side">
					<a href="" class="button small typeB">로그인</a>
					<a href="" class="button small typeB">마이페이지</a>
					<a href="" class="button small typeB">1:1문의</a>
				</div>
			</div>
		</header> 			

		<!-- container -->
        <div class="container">

			<!-- breadcrumb -->
			<div class="breadcrumb inner">
				<a href="" class="home"></a>
				<span class="arrow"></span>
				<a href="" class="txt link">회원가입</a>
			</div>

            <section class="section join_section">
                <div class="inner">
					<p class="page_title mb2">
						루핏 회원가입에 <br>
						오신것을 환영합니다.
					</p>
					<div class="join_box">
						<div class="form_box">
							<div class="input_box">
								<label class="label_text">
									이름 
								</label>
								<input type="text" class="input_text" placeholder="이름을 입력해주세요.">
							</div>
							<div class="input_box">
								<label class="label_text">
									이메일 주소 
								</label>
								<div class="input_item email_item ver2">
									<input type="text" class="input_text mx248 email_input" placeholder="이메일 주소">
									<span class="input_txt email_txt">@</span>
									<div class="select_box mx248 email_select">
										<select class="select">
											<option value="">메일 계정 선택</option>
											<option value="naver.com">naver.com</option>
											<option value="gmail.com">gmail.com</option>
											<option value="daum.net">daum.net</option>
											<option value="hanmail.net">hanmail.net</option>
											<option value="nate.com">nate.com</option>
											<option value="hotmail.com">hotmail.com</option>
											<option value="yahoo.com">yahoo.com</option>
											<option value="icloud.com">icloud.com</option>
										</select>
									</div>
									<button type="button" class="button typeC input_btn">인증요청</button>
								</div>
							</div>
							<div class="input_box">
								<label class="label_text">
									생년월일 
								</label>
								<input type="text" class="input_text" placeholder="생년월일을 입력해 주세요. (예시 : 20131225)">
							</div>
							<div class="input_box">
								<label class="label_text">
									휴대폰 번호 
								</label>
								<div class="input_item">
									<input type="text" class="input_text" placeholder="휴대폰 번호">
									<button type="button" class="button typeC input_btn">인증요청</button>
								</div>
							</div>
						</div>
						<div class="form_check">
							<div class="check_box">
								<input type="checkbox" id="termsOfUse" class="input_check">
								<label for="termsOfUse" class="label_check">
									이용약관 <a href="#none" class="link">[<span class="line">전문보기</span>]</a>
								</label>
							</div>
							<div class="check_box">
								<input type="checkbox" id="privacyPolicy" class="input_check">
								<label for="privacyPolicy" class="label_check">
									개인정보 수집 및 허용 <a href="#none" class="link">[<span class="line">전문보기</span>]</a>
								</label>
							</div>
							<div class="check_line"></div>
							<div class="check_box">
								<input type="checkbox" id="agreeAll" class="input_check">
								<label for="agreeAll" class="label_check">
									위 내용을 모두 확인하였으며 전체 동의합니다.
								</label>
							</div>
						</div>
						<div class="form_btn">
							<button type="button" class="button big typeB big cancel_btn">취소</button>
							<button type="button" class="button big typeA big submit_btn">다음</button>
						</div>
					</div>					
                </div>
            </section>

        </div> 
		
		<!-- footer -->
		<footer class="ml_footer">
			<div class="inner f_inner">
				<span class="copyright">copyright ⓒ 2022 by EDUCE, All Rights Reserved. </span>
				<a href="javascropt:" onclick="inquiryPop('com')" class="inq_btn">
					<span>사업 문의</span>
					<img src="img/ic_mail.png" alt="" class="icon">
				</a>
			</div>
		</footer>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
