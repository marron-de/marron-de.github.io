<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이루핏 - 에듀스</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
    <link href="css/Pretendard.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

	<!-- CSS 충돌 체크 -->
	<link rel="stylesheet" href="educe_css/common.css">
	<link rel="stylesheet" href="educe_css/pages.css">
	<link rel="stylesheet" href="educe_css/sub.css">
	<link rel="stylesheet" href="educe_css/by_kim.css">
	<link rel="stylesheet" href="educe_css/ny_kim.css">
	<link rel="stylesheet" href="educe_css/cw_jeon.css">
	<link rel="stylesheet" href="educe_css/swiper-bundle.min.css">
	<link rel="stylesheet" href="educe_css/dataTables.jqueryui.min.css">

</head>

<body>

    
    <div class="ml_wrap">

        <!-- modal -->
        <div class="modal show" id="applyForm_modal">
            <div class="modal_box noPadding">
				<div class="modal_head">
                	<p class="modal_tit">지원서 작성하기</p>
					<button type="button" class="close_btn modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="topbox">
						<div class="logo">
							<img src="img/apply_logo.png" alt="" class="img">
						</div>
						<p class="tit">NH 오토모티브 VMS 생산관리 신입사원</p>
						<div class="location">
							<div class="icon"></div>
							<div class="txt">
								<span class="word">서울시 성동구</span>
								<span class="dot"></span>
								<span class="word">경력</span>
								<span class="dot"></span>
								<span class="word">대졸 이상</span>
							</div>
						</div>
					</div>
					<div class="bottombox">
						<p class="title">지원서 (1)</p>
						<div class="applybox">
							<div class="imgbox">
								<img src="img/apply_icon.png" alt="" class="img">
							</div>
							<div class="txtbox">
								<p class="tit">새로운 매칭지원서 작동하기</p>
								<p class="desc">
									기본적인 정보만 입력하면 기업제안은 물론, 간단한 입사지원서 <br>
									제출이 가능해집니다.
								</p>
							</div>
						</div>
					</div>
				</div>
                <div class="modal_foot">
                    <button class="modal_btn button typeA modal_close">작성하고 지원하기</button>
                </div>
            </div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
