<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이루핏 - 에듀스</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
    <link href="css/Pretendard.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

	<!-- CSS 충돌 체크 -->
	<link rel="stylesheet" href="educe_css/common.css">
	<link rel="stylesheet" href="educe_css/pages.css">
	<link rel="stylesheet" href="educe_css/sub.css">
	<link rel="stylesheet" href="educe_css/by_kim.css">
	<link rel="stylesheet" href="educe_css/ny_kim.css">
	<link rel="stylesheet" href="educe_css/cw_jeon.css">
	<link rel="stylesheet" href="educe_css/swiper-bundle.min.css">
	<link rel="stylesheet" href="educe_css/dataTables.jqueryui.min.css">

</head>

<body>

    
    <div class="ml_wrap">

        <!-- modal -->
        <div class="modal show" id="applyForm_modal">
            <div class="modal_box noPadding">
				<div class="modal_head">
                	<p class="modal_tit">지원서 작성하기</p>
					<button type="button" class="close_btn modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="topbox">
						<div class="logo">
							<img src="img/apply_logo.png" alt="" class="img">
						</div>
						<p class="tit">NH 오토모티브 VMS 생산관리 신입사원</p>
						<div class="location">
							<div class="icon"></div>
							<div class="txt">
								<span class="word">서울시 성동구</span>
								<span class="dot"></span>
								<span class="word">경력</span>
								<span class="dot"></span>
								<span class="word">대졸 이상</span>
							</div>
						</div>
						<div class="input_box">
							<label class="label_text">지원분야</label>
							<input type="text" class="input_text" placeholder="지원분야를 선택해 주세요.">
						</div>
					</div>
					<div class="bottombox">
						<p class="title">지원서 (1)</p>
						<div class="applybox2">
							<div class="apply_top">
								<p class="tit">참신한 인재입니다.</p>
								<button type="button" class="button typeB  edit_btn">수정</button>
							</div>
							<div class="apply_bottom">
								<div class="input_box">
									<label class="label_text">이메일</label>
									<input type="text" class="input_text" placeholder="이메일">
								</div>
								<div class="input_box">
									<label class="label_text">휴대폰</label>
									<input type="text" class="input_text" placeholder="휴대폰">
								</div>
							</div>
						</div>
						<div class="descbox">
							<p class="desc">* 개인정보보호를 위해 개인정보가 포함된 파일은 사전동의 없이 삭제될 수 있습니다.</p>
							<p class="desc">* 제출서류는 채용 마감 후 90일까지 지원기업에게 제공됩니다.</p>
							<p class="desc">* 제출에 동의할 경우에만 [지원하기] 버튼을 클릭해 주세요.</p>
							<p class="desc">* 동의하지 않을 경우 입사지원이 불가능합니다.</p>
						</div>
					</div>
				</div>
                <div class="modal_foot">
                    <button class="modal_btn button typeA modal_close">지원하기</button>
                </div>
            </div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
