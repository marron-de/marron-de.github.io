<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>마이루핏 어드민</title>

	<!-- Swiper -->
	<link rel="stylesheet" href="css/swiper-bundle.min.css" />
	<script src="js/swiper-bundle.min.js"></script>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="js/jquery-ui.min.js">
	</script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

	<!-- chart.js -->
	<script src="js/chart.js"></script>
	<script src="js/chartjs-plugin-datalabels.js"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"rel="stylesheet">
	<link href="css/Pretendard.css">

</head>

<body>


	<div class="wrap">

        <div class="modal type2 show" id="withdrawalPopup">
			<div class="modal_box">
				<div class="modal_head">
					<p class="h_title">탈퇴 사유</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="radio_wrap">
						<div class="radio_box wid100">
							<input type="radio" name="withdrawal" id="withdrawal1" class="input_radio" checked>
							<label for="withdrawal1" class="label_radio">
								정상 결제가 되었습니다.
							</label>
						</div>
						<div class="radio_box wid100">
							<input type="radio" name="withdrawal" id="withdrawal2" class="input_radio">
							<label for="withdrawal2" class="label_radio">
								이용할만한 콘텐츠가 서비스가 부족해서
							</label>
						</div>
						<div class="radio_box wid100">
							<input type="radio" name="withdrawal" id="withdrawal3" class="input_radio">
							<label for="withdrawal3" class="label_radio">
								타 사이트를 이용하기 위해서
							</label>
						</div>
						<div class="radio_box wid100">
							<input type="radio" name="withdrawal" id="withdrawal4" class="input_radio">
							<label for="withdrawal4" class="label_radio">
								서비스나 콘텐츠의 오류나 장애 때문에
							</label>
						</div>
						<div class="radio_box wid100">
							<input type="radio" name="withdrawal" id="withdrawal5" class="input_radio">
							<label for="withdrawal5" class="label_radio">
								고객대응에 불만이 생겨서
							</label>
						</div>
						<div class="radio_box wid100">
							<input type="radio" name="withdrawal" id="withdrawal6" class="input_radio">
							<label for="withdrawal6" class="label_radio full">
								<span class="txt">기타</span>
								<div class="input_box">
									<textarea class="input_text" placeholder="기타 사유를 입력하세요."></textarea>
								</div>
							</label>

						</div>
					</div>
				</div>
				<div class="modal_foot">
					<button type="button" class="btn">결제 취소</button>
				</div>
			</div>
		</div>

	</div>



	<!-- JS -->
	<script src="js/common.js"></script>

</body>

</html>
