<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 

		<!-- 지도위치 모달 -->
		<div id="goodMap_modal" class="modal only mobtbl show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">지도위치</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="frm_cgood_search" id="frm_cgood_search" method="get" class="form form_box">						
						<div class="tbl_box">
							<table class="tbl space_auto">
								<colgroup>
									<col style="width: 150px;">
									<col style="width: 650px">
								</colgroup>
								<tbody>
									<tr>
										<td data-th="지도" colspan="2" class="map">
											<div class="mapbox">
												<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3160.9577475045176!2d127.063832576298!3d37.603153422026814!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x357ca262b8296b8d%3A0xc5d030ada6004426!2sTK%20Travel%20Korea!5e0!3m2!1sko!2skr!4v1755791990688!5m2!1sko!2skr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" class="map_canvas"></iframe>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="위도/경도">위도/경도</th>
										<td data-th="주소검색">
											<div class="input_box input_flex">
												<input name="map_x" id="map_x" type="text" class="input_text size_md" value="37.564263" readonly="">
												<span class="label_text input_txt sie_md">/</span>
												<input name="map_y" id="map_y" type="text" class="input_text size_md" value="126.97467600000004" readonly="">
												<button type="button" class="input_btn size_md">위치확인</button>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="주소검색">주소검색</th>
										<td data-th="주소검색">
											<div class="input_box input_flex">
												<input name="place_nm" id="place_nm" type="text" class="input_text size_md" value="">
												<button type="button" class="input_btn size_md">주소검색</button>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE">입력</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
