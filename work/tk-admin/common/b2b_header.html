
<header id="header" class="header b2b_header ver2">

			</div>

		<div class="leftbox">

					<span class="tit"></span>
				</p>
			</div>
		</div>
		<div class="rightbox">					
			<div class="h_sidebox">
				<div class="item title_item">
					<div class="logo">
						<img src="https://tkplace.co.kr/FileData/logo/yanolja.jpg" class="img">
					</div>
					<div class="title">
						<span class="tit">야놀자</span>
						<span class="badge size_md">거래처</span>
					</div>				
				</div>

								<i class="ph ph-sun light"></i>
								<i class="ph ph-moon dark"></i>
							</span>
							<span class="arrow"></span>
						</button>										
						<button type="button"class="btn darkmode_btn mob_darkmode_btn light" onclick="darkmode_toggle()">
							<span class="icon">
								<i class="ph ph-sun light"></i>
								<i class="ph ph-moon dark"></i>
							</span>
						</button>
						<div id="darkmode_popup" class="popup dropdown_popup">
							<div class="pop_body item_box">
								<div class="item">
									<button type="button" value="light" class="sel_btn">
										<span class="ph ph-sun"></span>
										<span class="txt">Light</span>
									</button>
								</div>
								<div class="item">

									</button>
								</div>
							</div>
						</div>
					</div>		
					<div class="item save_item fixnav_item">
						<button type="button" class="btn save_btn">
							<span class="ph ph-floppy-disk-back"></span>
						</button>
					</div>	
					<button type="button" class="btn fixnav_btn fixnav_item" onclick="fixnav_button()">
						<i class="ph ph-caret-up"></i>
					</button>			
				</div>
				<div class="item alarm_item">

						<span class="ph ph-bell"></span>

					<div id="alarm_popup" class="popup dropdown_popup">

					<div id="profile_popup" class="popup dropdown_popup">
