	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}

		replaceModule('../common/pms_header.html', '#pms_header');
		replaceModule('../common/footer.html', '#footer');
		replaceModule('../common/sidenav_PMS.html', '#sidenav');

		$(window).on("load", function () {
			setTimeout(() => {
				$(".sidenav .side_cont .menu_list_acco > .side_item").eq(0).addClass("show");
				$(".sidenav .side_cont .menu_list_acco > .side_item").eq(0).find(".acc_cont").show();
				$(".sidenav .side_cont .menu_list_acco > .side_item").eq(0).find(".acc_cont .side_item").eq(0).addClass("active");
			}, 100);
		});
	</script>
	<script src="../js/common.js"></script>


	<!-- echarts -->
	<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
	<script>
		const echartsInstances = [];
		const chartElements = document.querySelectorAll('.echart_custom');

		chartElements.forEach((el) => {
			const myChart = echarts.init(el, null, {
				renderer: 'canvas',
				useDirtyRect: false
			});

			let option = {};
			if (el.classList.contains('echart_typeA')) {
				// typeA
				option = {
					xAxis: {
						type: 'category',
						data: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
						boundaryGap: false,
						axisLine: {
							show: false
						},
						axisLabel: {
							show: false
						},
						axisTick: {
							show: false
						},
						axisPointer: {
							type: 'none'
						}
					},
					yAxis: {
						type: 'value',
						splitLine: {
							show: false
						},
						axisLine: {
							show: false
						},
						axisLabel: {
							show: false
						},
						axisTick: {
							show: false
						},
						axisPointer: {
							type: 'none'
						}
					},
					series: [{
						type: 'bar',
						showBackground: true,
						barWidth: '32%',
						itemStyle: {
							barBorderRadius: 10,
							color: '#086BF1'
						},
						data: [120, 200, 150, 80, 70, 110, 120],
						z: 10,
						emphasis: {
							itemStyle: {
								color: '#086BF1'
							}
						}
					}],
					grid: {
						right: '5%',
						left: '5%',
						top: 0,
						bottom: 0
					}
				};
			} else if (el.classList.contains('echart_typeB')) {
				// typeB
				option = {
					tooltip: {
						trigger: 'axis',
						formatter: '{b0} : {c0}'
					},
					xAxis: {
						type: 'category',
						data: ['Week 4', 'Week 5', 'Week 6', 'Week 7'],
						show: false,
						boundaryGap: false
					},
					yAxis: {
						show: false,
						type: 'value',
						boundaryGap: false
					},
					series: [{
						type: 'line',
						data: [20, 40, 100, 120],
						symbol: 'none',
						smooth: true,
						lineStyle: {
							width: 3,
							color: '#086BF1'
						},
						areaStyle: {
							color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
									offset: 0,
									color: 'rgba(44, 123, 229, 0.25)'
								},
								{
									offset: 1,
									color: 'rgba(44, 123, 229, 0)'
								}
							])
						}
					}],
					grid: {
						right: '0',
						left: '0',
						bottom: '0',
						top: '0'
					}
				};
			} else if (el.classList.contains('echart_typeC')) {
				// typeC
				const getLast12Months = () => {
					const months = [];
					const now = new Date();
					for (let i = 12; i >= 0; i--) {
						const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
						const yy = String(d.getFullYear()).slice(2);
						const mm = String(d.getMonth() + 1).padStart(2, '0');
						months.push(`${yy}.${mm}`);
					}
					return months;
				};

				let tooltipFormatter = function tooltipFormatter(params) {
					let tooltipItem = '';
					params.forEach(function (el) {
						tooltipItem += `
							<div class="descbox">
								<p class="desc">
									<span class="ph-fill ph-circle" style="color:${el.borderColor ? el.borderColor : el.color}"></span>
									<span class="txt">
									${el.seriesName} : ${typeof el.value === 'object' ? el.value[1].toLocaleString() : el.value.toLocaleString()}
									</span>
								</p>
							</div>
						`;
					});
					return `
						<div class="chart_tooltip">
							<p class='title'>
								${params[0].axisValue}
							</p>
							${tooltipItem}
						</div>
					`;
				};

				const isMobile = window.innerWidth <= 1080;

				option = {
					legend: {
						data: ['월별 예약 현황(명)'],
						top: 0,
						left: 0,
						itemWidth: isMobile ? 10 : 12,
						itemHeight: isMobile ? 10 : 12,
						icon: 'circle',
						textStyle: {
							color: '#434343',
							fontSize: isMobile ? 10 : 14
						},
						itemGap: isMobile ? 14 : 20,
					},
					xAxis: {
						type: 'category',
						data: getLast12Months(),
						axisLine: {
							show: false
						},
						axisTick: {
							show: false
						},
						axisLabel: {
							fontSize: isMobile ? 10 : 13,
							color: '#6C757D'
						}
					},
					yAxis: {
						type: 'value',
						position: 'right',
						axisLine: {
							show: false
						},
						axisTick: {
							show: false
						},
						splitLine: {
							lineStyle: {
								color: 'rgba(0,0,0,0.08)'
							}
						},
						axisLabel: {
							fontSize: isMobile ? 10 : 13,
							color: '#6C757D',
							// formatter: '{value} 명'
							formatter: '{value} '
						}
					},
					tooltip: {
						trigger: 'axis',
						padding: [10, 10],
						backgroundColor: '#ffffff',
						borderColor: '#DEE2E6',
						borderWidth: 1,
						formatter: tooltipFormatter
					},
					series: [{
							name: '직월별 예약 현황(명)약',
							type: 'bar',
							stack: 'total',
							barWidth: isMobile ? '70%' : '40%',
							itemStyle: {
								borderRadius: isMobile ? [4, 4, 0, 0] : [10, 10, 0, 0],
								color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
									{ offset: 0, color: '#82b1ff' },
									{ offset: 0.5, color: '#2c7be5' },
									{ offset: 1, color: '#155bb5' }
								])
							},
							data: [5, 17, 13, 8, 8, 22, 9, 3, 14, 12, 2, 22, 10]
						},
					],
					grid: {
						right: '0%',
						left: '0%',
						bottom: '5%',
						top: '10%',
						containLabel: true
					}
				};

			}

			myChart.setOption(option);

			echartsInstances.push(myChart);

			const parent = el.parentElement;
			if (parent) {
				const ro = new ResizeObserver(() => {
					myChart.resize();
				});
				ro.observe(parent);
			}

			window.addEventListener('resize', () => {
				myChart.resize();
			});
		});
	</script>
