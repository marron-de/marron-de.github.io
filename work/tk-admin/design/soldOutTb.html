<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">

</head>

<body data-theme="light">


	<div id="wrap" class="layout design_wrap sideopen" data-title="여행대장" data-icon="ph-shapes">

		<!-- sidenav -->
		<div id="sidenav"></div>

		<!-- container -->
		<div id="container" class="container">

			<!-- header -->
			<div id="sub_header"></div>

			<!-- contents -->
			<div id="contents" class="contents">
				<div class="content_title flexible between">
					<p class="page_title">
						<i class="ph-fill ph-shapes icon"></i>
						여행대장
					</p>
					<div class="tab_wrap size_md">
						<div class="tab_navbox tabs_ver">
							<div class="tab_nav on">
								<a href="#none" class="link">여행대장</a>
							</div>
							<div class="tab_nav">
								<a href="../design/soldOutTk.html" class="link">TK트래블</a>
							</div>
						</div>
					</div>
				</div>

				<div class="content_list content_tbl">
					<div class="popup_upload_wrap">
						<div class="input_box input_file_box">
							<div class="leftbox">
								<span class="label_text size_title">여행대장 Sold Out 이미지 등록</span>
								<div class="input_flex">
									<input type="file" class="input_file" id="tbSoldOut" name="tbSoldOut">
									<label for="tbSoldOut" class="label_file mobSize_full">선택된 파일 없음</label>
									<button type="button" class="input_btn fileSelect_btn mobSize_full2">파일 선택</button>
									<button type="button" class="button input_btn typeE auto mobSize_full2">등록하기</button>
								</div>
								<div class="file_data">
									<img src="../img/ic_filedown.png" alt="" class="icon">
									<a href="" class="txt">여행대장 Sold Out 이미지.jpg</a>
									<button type="button" class="delete_btn">
										<i class="ph-fill ph-x-circle"></i>
									</button>
								</div>
							</div>
							<div class="rightbox">
								<span class="label_text size_title">현재 여행대장 Sold Out 이미지</span>
								<div class="file_preview">
									<img src="https://www.tktravelkorea.com/image/soldOut/tb_sold_out.png?ts=1756420092" alt="" class="img auto">
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<!-- footer -->
			<div id="footer"></div>

		</div>

	</div>


	<!-- JS -->
	<!-- 공통요소 추가 -->
	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}

		replaceModule('../common/sub_header.html', '#sub_header');
		replaceModule('../common/footer.html', '#footer');
		replaceModule('../common/sidenav_design.html', '#sidenav');

		$(window).on("load", function () {
			setTimeout(() => {
				$(".header .h_bottom .gnb .gnb_item").eq(9).addClass("active");
				$(".sidenav .side_cont .side_submenubox .menu_list .side_item").eq(20).addClass("active");
			}, 100);
		});
	</script>	
	<script src="../js/common.js"></script>



</body>

</html>
