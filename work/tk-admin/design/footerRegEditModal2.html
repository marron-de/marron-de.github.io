<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 푸터아이콘 수정 모달 -->
		<div id="footerRegEdit2_modal" class="modal footerReg_modal mobtbl show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">푸터아이콘 수정</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="footer_reg_write" id="footer_reg_write" method="post" enctype="multipart/form-data" autocomplete="off" class="form">
						<div class="tbl_box">
							<table class="tbl space_auto">
								<colgroup>
									<col style="width: 180px;">
									<col style="width: 554px">
								</colgroup>
								<tbody>
									<tr>
										<th data-th="아이콘 이미지"><span class="required">아이콘 이미지</span></th>
										<td data-th="아이콘 이미지" class="align_left">
											<div class="input_box input_file_box">
												<div class="input_flex">
													<input type="file" class="input_file" id="userFile1" name="userFile1">
													<label for="userFile1" class="label_file size_md">선택된 파일 없음</label>
													<button type="button" class="input_btn fileSelect_btn size_md">파일 선택</button>
												</div>
												<div class="file_data">
													<img src="../img/ic_filedown.png" alt="" class="icon">
													<a href="" class="txt">테스트 이미지 파일.png</a>
													<button type="button" class="delete_btn">
														<i class="ph-fill ph-x-circle"></i>
													</button>
												</div>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="URL"><span class="required">URL(영어)</span></th>
										<td data-th="URL" class="align_left">
											<div class="input_box">
												<input type="url" name="linkEn" class="input_text size_md" value="https://en.tktravelkorea.com/cmm/?BD_CD=ENQNA&scat=%E7%B7%9A%E4%B8%8A%E8%A9%A2%E5%95%8F" required="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="URL"><span class="required">URL(번체)</span></th>
										<td data-th="URL" class="align_left">
											<div class="input_box">
												<input type="url" name="linkHk" class="input_text size_md" value="https://www.tktravelkorea.com/cmm/?BD_CD=TWQNA&scat=%E7%B7%9A%E4%B8%8A%E8%A9%A2%E5%95%8F" required="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="URL"><span class="required">URL(간체)</span></th>
										<td data-th="URL" class="align_left">
											<div class="input_box">
												<input type="url" name="linkCn" class="input_text size_md" value="https://cn.tktravelkorea.com/cmm/?BD_CD=CNQNA&scat=%E7%B7%9A%E4%B8%8A%E8%A9%A2%E5%95%8F" required="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="링크명"><span class="required">링크명(영어)</span></th>
										<td data-th="링크명" class="align_left">
											<div class="input_box">
												<input type="text" name="linkNameEn" value="1:1 Inquires" class="input_text size_md" hname="링크명" required="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="링크명"><span class="required">링크명(번체)</span></th>
										<td data-th="링크명" class="align_left">
											<div class="input_box">
												<input type="text" name="linkNameHk" value="線上詢問" class="input_text size_md" hname="링크명" required="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="링크명"><span class="required">링크명(간체)</span></th>
										<td data-th="링크명" class="align_left">
											<div class="input_box">
												<input type="text" name="linkNameCn" value="线上询问" class="input_text size_md" hname="링크명" required="">
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE">수정</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
