	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}

		replaceModule('../common/sub_header.html', '#sub_header');
		replaceModule('../common/footer.html', '#footer');
		replaceModule('../common/sidenav_design.html', '#sidenav');
		replaceModule('../common/calender_popup.html', '#calender_popup');

		$(window).on("load", function () {
			setTimeout(() => {
				$(".header .h_bottom .gnb .gnb_item").eq(9).addClass("active");
			}, 100);
		});
	</script>

	<!-- 타이틀/메뉴활성화 -->
	<script>
		$(window).on("load", function () {
			const params = new URLSearchParams(window.location.search);
			const bdCd = params.get("lang");

			function setTitleAndMenu() {
				if ($(".page_title .tit").length && $(".sidenav .side_cont .side_submenubox .menu_list .side_item").length) {
					if (bdCd === "ko") {
						// 한국 회사소개
						$(".page_title .tit").text("한국 회사소개");
						$(".sidenav .side_cont .side_submenubox .menu_list .side_item").eq(16).addClass("active");


					} else if (bdCd === "en") {
						// 영어 회사소개
						$(".page_title .tit").text("영어 회사소개");
						$(".sidenav .side_cont .side_submenubox .menu_list .side_item").eq(17).addClass("active");


					} else if (bdCd === "hk") {
						// 번체 회사소개
						$(".page_title .tit").text("번체 회사소개");
						$(".sidenav .side_cont .side_submenubox .menu_list .side_item").eq(18).addClass("active");


					} else if (bdCd === "cn") {
						// 간체 회사소개
						$(".page_title .tit").text("간체 회사소개");
						$(".sidenav .side_cont .side_submenubox .menu_list .side_item").eq(19).addClass("active");
					}
					return true;
				}
				return false;
			}

			if (!setTitleAndMenu()) {
				const interval = setInterval(() => {
					if (setTitleAndMenu()) clearInterval(interval);
				}, 100);
			}
		});
	</script>
