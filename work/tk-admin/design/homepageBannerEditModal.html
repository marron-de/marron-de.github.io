<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 배너수정 모달 -->
		<div id="homepageBannerEdit_modal" class="modal homepageBanner_modal show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">배너수정</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="frm_write" id="frm_write" method="post" enctype="multipart/form-data" autocomplete="off" class="form">
						<div class="tbl_box">
							<table class="tbl space_auto">
								<colgroup>
									<col style="width: 240px;">
									<col style="width: 498px">
								</colgroup>
								<tbody>
									<tr>
										<th data-th="카테고리ID">카테고리ID</th>
										<td data-th="카테고리ID" class="align_left">
											<div class="select_box">
												<select name="b_uid" class="select size_md">
													<option value="">선택</option>
												</select>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="이미지&동영상">
											이미지&동영상
											<p class="desc point">
												(PC-1920 x 589) <br>
												(MOB-783 x 313) <br>
												(테마 180 x 180) jpg,mp4파일만 가능
											</p>
										</th>
										<td data-th="이미지&동영상" class="align_left">
											<div class="input_box input_file_box">
												<div class="input_flex">
													<input type="file" class="input_file" id="userFile1" name="userFile1">
													<label for="userFile1" class="label_file size_md">선택된 파일 없음</label>
													<button type="button" class="input_btn fileSelect_btn size_md">파일 선택</button>
												</div>
												<div class="file_data">
													<img src="../img/ic_filedown.png" alt="" class="icon">
													<a href="" class="txt">테스트 파일.jpg</a>
													<button type="button" class="delete_btn">
														<i class="ph-fill ph-x-circle"></i>
													</button>
												</div>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="미리보기">미리보기</th>
										<td data-th="미리보기" class="align_left">
											<div class="tbl_img">
												<img src="https://www.tktravelkorea.com/FileData/hotel/20250801_95D5A3FC80F08AA6.jpg" alt="" class="img">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="URL">URL</th>
										<td data-th="URL" class="align_left">
											<div class="input_box">
												<input type="text" name="link_url" value="https://www.tktravelkorea.com/tour/whole-year/gangneung-donghae-mureungbyeolyucheonji-nongoldamgilstreet-outdoor-activities-2d1n/" class="input_text size_md">
												<p class="input_status size_md">
													* 바로가기 방법 : 링크주소뒤에 "&search_mode=1"를 붙여주세요. <br>			
													* 링크 주소 마지막에 "&f=srch"를 붙여주시면 검색기능이 활성화 됩니다.	
												</p>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="검색어">검색어</th>
										<td data-th="검색어" class="align_left">
											<div class="input_box">
												<input type="text" name="search_keyword" value="키워드, 키워드, 키워드" class="input_text size_md">
												<p class="input_status size_md">
													* 검색할 단어 구분을 콤마(,)로 입력해 주시기 바랍니다.
												</p>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE">수정</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
