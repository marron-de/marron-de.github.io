<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">

</head>

<body data-theme="light">


	<div id="wrap" class="layout setting_wrap sideopen" data-title="SMTP 설정" data-icon="ph-gear">

		<!-- sidenav -->
		<div id="sidenav"></div>

		<!-- container -->
		<div id="container" class="container">

			<!-- header -->
			<div id="sub_header"></div>

			<!-- contents -->
			<div id="contents" class="contents">				
				<div class="content_title  ">
					<p class="page_title">
						<i class="ph-fill ph-gear icon"></i>
						SMTP 설정
					</p>
				</div>

				<div class="content_write content_tbl">
					<div class="board bo_write">
						<form name="smtp_info_frm" id="smtp_info_frm" method="POST">
							<div class="tbl_box ver3 mobtbl">
								<table class="tbl board_list min_auto">
									<colgroup>
										<col style="width: 150px;">
										<col style="width: 430px;">
										<col style="width: 150px;">
										<col style="width: 430px;">
									</colgroup>
								<tbody>									
									<tr>
										<th data-th="SMTP 서버명">SMTP 서버명</th>
										<td data-th="SMTP 서버명">
											<div class="input_box">
												<input class="input_text size_md" id="smtp_host" name="smtp_host" type="text" value="smtp.worksmobile.com" required="">
											</div>
										</td>
										<th data-th="SMTP 포트">SMTP 포트</th>
										<td data-th="SMTP 포트">
											<div class="input_box">
												<input class="input_text size_md" id="smtp_port" name="smtp_port" type="text" value="465" required="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="SMTP 연결방법">SMTP 연결방법</th>
										<td data-th="SMTP 연결방법" colspan="3">
											<div class="select_box">
												<select class="select size_md" id="smtp_type" size="1" name="smtp_type" required="">
													<option value="">선택</option>
													<option value="tls">TLS</option>
													<option value="ssl" selected="">SSL</option>
												</select>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="아이디">아이디</th>
										<td data-th="아이디">
											<div class="input_box">
												<input class="input_text size_md" id="smtp_id" name="smtp_id" type="text" value="cs@tktravelkorea.com" required="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="비밀번호">비밀번호</th>
										<td data-th="비밀번호">
											<div class="input_box">
												<input class="input_text size_md" id="smtp_pwd" name="smtp_pwd" type="text" value="wWc9ErcLVKT3" required="">
											</div>
										</td>
									</tr>
								</tbody>

								</table>
							</div>
							<div class="bo_btnbox">
								<div class="centerbox">
									<button class="button typeE auto size_md">저장</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>

			<!-- footer -->
			<div id="footer"></div>

		</div>

	</div>


	<!-- JS -->
	<!-- 공통요소 추가 -->
	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}

		replaceModule('../common/sub_header.html', '#sub_header');
		replaceModule('../common/footer.html', '#footer');
		replaceModule('../common/sidenav_setting.html', '#sidenav');

		$(window).on("load", function () {
			setTimeout(() => {
				$(".header .h_bottom .gnb .gnb_item").eq(10).addClass("active");
				$(".sidenav .side_cont .side_submenubox .menu_list .side_item").eq(17).addClass("active");
			}, 100);
		});
	</script>	
	<script src="../js/common.js"></script>



</body>

</html>
