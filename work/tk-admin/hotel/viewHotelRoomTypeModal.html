<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 

		<!-- 룸타입관리 모달 -->
		<div id="viewHotelRoomType_modal" class="modal viewGoodDateType_modal show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">룸타입관리</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="form_box">
						<form name="frm_datetype_ins" id="frm_datetype_ins" method="post" class="form">
							<div class="tbl_box">
								<table class="tbl space_auto">
									<colgroup>
										<col style="width: 180px;">
										<col style="width: 750px;">
									</colgroup>
									<tbody>
										<tr>
											<th data-th="룸타입">룸타입</th>
											<td data-th="룸타입">
												<div class="input_box"><input type="text" class="input_text size_md" name="room_type" value="" hname="룸타입(한)" required="">
												</div>
											</td>
										</tr>
										<tr>
											<th data-th="인원">인원</th>
											<td data-th="인원">
												<div class="input_box input_flex">
													<span class="label_text input_txt size_md bold">기준인원 :</span>
													<input type="text" class="input_text size_md mx50 align_right" name="person_num" value="0">
													<span class="label_text input_txt size_md">/</span>
													<span class="label_text input_txt size_md bold">최대인원(성인) :</span>
													<input type="text" class="input_text size_md mx50 align_right" name="person_maxnum" value="0">
													<span class="label_text input_txt size_md">/</span>		
													<span class="label_text input_txt size_md">(초과요금 <input type="text" class="input_text size_md mx120 align_right" name="person_max_price" value="0"> )</span>
													<span class="label_text input_txt size_md">/</span>
													<span class="label_text input_txt size_md bold">최대인원(소인)</span>
													<input type="text" class="input_text size_md mx50 align_right" name="child_maxnum" value="0">
												</div>
											</td>
										</tr>
										<tr>
											<th data-th="상세표기정보">상세표기정보 <br><p class="desc point">(공통적용)</p></th>
											<td data-th="상세표기정보">
												<div class="tbl_inline column_ver">
													<div class="input_box input_flex">
														<span class="label_text input_txt size_md bold">세금/봉사료 :</span>
														<input type="text" name="room_taxinfo" id="room_taxinfo"  value="세금 및 봉사료 포함" class="input_text size_md full">
													</div>
													<div class="input_box input_flex">
														<span class="label_text input_txt size_md bold">무료취소안내 :</span>
														<input type="text" name="room_cancelinfo" id="room_cancelinfo" value="체크인 11일 전까지 무료 취소" class="input_text size_md">
													</div>
												</div>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
							<div class="tbl_bottom">
								<button type="button" class="button typeE size_md auto">룸타입등록</button>
							</div>
						</form>
						<form name="frm_datetype_list" id="frm_datetype_list" method="post" class="form">
							<div class="tbl_top">
								<div class="leftbox"></div>
								<div class="rightbox">
									<button type="button" class="button size_sm auto typeF">노출순서 변경</button>
								</div>
							</div>
							<div class="tbl_box">
								<table class="tbl">
									<colgroup>
										<col style="width: 60px;">
										<col style="width: 70px;">
										<col style="width: 60px;">
										<col style="width: 350px;">
										<col style="width: 120px;">
										<col style="width: 90px;">
										<col style="width: 90px;">
										<col style="width: 90px;">
									</colgroup>
									<thead>
										<tr>
											<th data-th="노출">노출</th>
											<th data-th="순서">순서</th>
											<th data-th="복사">복사</th>
											<th data-th="룸타입">룸타입</th>
											<th data-th="베드타입 종류">베드타입 종류</th>
											<th data-th="기준인원">기준인원</th>
											<th data-th="최대인원">최대인원</th>
											<th data-th="수정">수정</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<td data-th="노출">
												<button type="button" class="iconbadge success size_md"></button>
											</td>
											<td data-th="순서">
												<div class="input_box">
													<input name="order_num_arr[]" class="input_text size_md align_center" id="order_num_arr[]" type="text" maxlength="3" value="1" autocomplete="off">
												</div>
											</td>
											<td data-th="복사">
												<div class="tbl_btnbox">
													<button type="button" class="roomcopy_btn"><i class="ph ph-copy-simple"></i></button>
												</div>
											</td>
											<td data-th="룸타입" class="align_left">
												시티뷰 킹베드 [2박상품](8)	
											</td>
											<td data-th="베드타입 종류">1</td>
											<td data-th="기준인원">2</td>
											<td data-th="최대인원">2</td>
											<td data-th="수정">
												<div class="tbl_btnbox">		
												<button type="button" class="edit_btn" onclick="hotelDateRoomtypeEdit_modal()">
													<i class="ph ph-note-pencil"></i>
												</button>
												<button type="button" class="delete_btn">
													<i class="ph ph-trash"></i>
												</button>
											</div>
											</td>
										</tr>
										<tr>
											<td data-th="노출">
												<button type="button" class="iconbadge success size_md"></button>
											</td>
											<td data-th="순서">
												<div class="input_box">
													<input name="order_num_arr[]" class="input_text size_md align_center" id="order_num_arr[]" type="text" maxlength="3" value="2" autocomplete="off">
												</div>
											</td>
											<td data-th="복사">
												<div class="tbl_btnbox">
													<button type="button" class="roomcopy_btn"><i class="ph ph-copy-simple"></i></button>
												</div>
											</td>
											<td data-th="룸타입" class="align_left">
												시티뷰 트윈베드 [2박상품](8)	
											</td>
											<td data-th="베드타입 종류">1</td>
											<td data-th="기준인원">2</td>
											<td data-th="최대인원">2</td>
											<td data-th="수정">
												<div class="tbl_btnbox">		
												<button type="button" class="edit_btn" onclick="hotelDateRoomtypeEdit_modal()">
													<i class="ph ph-note-pencil"></i>
												</button>
												<button type="button" class="delete_btn">
													<i class="ph ph-trash"></i>
												</button>
											</div>
											</td>
										</tr>
										<tr>
											<td data-th="노출">
												<button type="button" class="iconbadge success size_md"></button>
											</td>
											<td data-th="순서">
												<div class="input_box">
													<input name="order_num_arr[]" class="input_text size_md align_center" id="order_num_arr[]" type="text" maxlength="3" value="3" autocomplete="off">
												</div>
											</td>
											<td data-th="복사">
												<div class="tbl_btnbox">
													<button type="button" class="roomcopy_btn"><i class="ph ph-copy-simple"></i></button>
												</div>
											</td>
											<td data-th="룸타입" class="align_left">
												리버뷰 킹베드 [2박상품](8)
											</td>
											<td data-th="베드타입 종류">1</td>
											<td data-th="기준인원">2</td>
											<td data-th="최대인원">2</td>
											<td data-th="수정">
												<div class="tbl_btnbox">		
												<button type="button" class="edit_btn" onclick="hotelDateRoomtypeEdit_modal()">
													<i class="ph ph-note-pencil"></i>
												</button>
												<button type="button" class="delete_btn">
													<i class="ph ph-trash"></i>
												</button>
											</div>
											</td>
										</tr>
										<tr>
											<td data-th="노출">
												<button type="button" class="iconbadge success size_md"></button>
											</td>
											<td data-th="순서">
												<div class="input_box">
													<input name="order_num_arr[]" class="input_text size_md align_center" id="order_num_arr[]" type="text" maxlength="3" value="4" autocomplete="off">
												</div>
											</td>
											<td data-th="복사">
												<div class="tbl_btnbox">
													<button type="button" class="roomcopy_btn"><i class="ph ph-copy-simple"></i></button>
												</div>
											</td>
											<td data-th="룸타입" class="align_left">
												리버뷰 트윈베드 [2박상품](8)	
											</td>
											<td data-th="베드타입 종류">1</td>
											<td data-th="기준인원">2</td>
											<td data-th="최대인원">2</td>
											<td data-th="수정">
												<div class="tbl_btnbox">		
												<button type="button" class="edit_btn" onclick="hotelDateRoomtypeEdit_modal()">
													<i class="ph ph-note-pencil"></i>
												</button>
												<button type="button" class="delete_btn">
													<i class="ph ph-trash"></i>
												</button>
											</div>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</form>
					</div>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
