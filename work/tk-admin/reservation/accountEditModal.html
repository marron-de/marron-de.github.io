		<div id="accountEdit_modal" class="modal only show">

									<col style="width: 180px;">

									<col style="width: 180px;">
								</colgroup>
								<tbody>
									<tr>
										<th data-th="등록일자">등록일자</th>
										<td data-th="등록일자" colspan="3">
											<div class="input_box">
												<input type="text" name="acc_dt" class="input_text size_md icon_ver icon_date calender_btn" value="2025-08-12" readonly="readonly" hname="등록일자" required="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="계정">계정</th>
										<td data-th="계정">
											<div class="select_box">
												<select name="ioac_cd" class="select size_md">
													<option value="">선택</option>
													<option value="IOAC007">티켓비</option>
													<option value="IOAC001">투어비</option>
													<option value="IOAC002">호텔비</option>
													<option value="IOAC008">버스비</option>
													<option value="IOAC004">계약금</option>
												</select>
											</div>
										</td>
										<th data-th="판매금액">판매금액</th>
										<td data-th="판매금액">
											<div class="input_box">
												<input type="text" name="input_will_plus" class="input_text size_md align_right" value="620,000" maxlength="8">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="입금(+)">입금(+)</th>
										<td data-th="입금(+)">
											<div class="input_box">
												<input type="text" name="bank_plus" class="input_text size_md align_right" value="0"  maxlength="8">
											</div>
										</td>
										<th data-th="출금(-)">출금(-)</th>
										<td data-th="출금(-)">
											<div class="input_box">
												<input type="text" name="bank_minus" class="input_text size_md align_right" value="0" maxlength="8">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="결제방법">결제방법</th>
										<td data-th="결제방법" colspan="3">
											<div class="select_box">
												<select name="pgcase_cd" class="select size_md">
													<option value="">선택</option>
													<option value="INST002">신용카드</option>
													<option value="INST010">위쳇페이</option>
													<option value="INST011">알리페이</option>
													<option value="INST012">계좌이체</option>
													<option value="INST006">베네피아</option>

												</select>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="계좌번호">계좌번호</th>

											<div class="select_box">
												<select name="bank_cd" class="select size_md">
													<option value="">선택</option>
													<option value="INBK002">하나은행[010-991910-79304.강일구(TKTRAVEL)]</option>
													<option value="ENBK001">HSBC (HKD)[121 650915 833.KANG ILGOO]</option>
													<option value="ENBK002">Bank of China (HKD)[01268010157919.KANG ILGOO]</option>
													<option value="ENBK003">Fubon Bank (TWD)[012570168100605.KANG ILGOO]</option>
													<option value="ENBK004">Bank of China (CNY)[6217582000026002501.KANG ILGOO]</option>
													<option value="ENBK005">Kookmin Bank (USD)[01126811004789.KANG ILGOO]</option>
													<option value="ENBK008">Hana Bank (KRW)[010-991910-79304.KANG ILGOO]</option>
												</select>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="비고">비고</th>
										<td data-th="비고" colspan="3">
											<div class="input_box">
												<input type="text" name="remarks" size="45" class="input_text size_md" value="">
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE">저장</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
