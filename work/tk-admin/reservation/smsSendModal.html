<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 여행상품예약 수정 > SMS 발송 모달 -->
		<div id="smsSend_modal" class="modal only show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">SMS 발송</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="sendsms_fm" id="sendsms_fm" autocomplete="off" method="post" enctype="multipart/form-data" class="form form_box">
						<div class="tbl_box">
							<table class="tbl space_auto">
								<colgroup>
									<col style="width:120px">
									<col style="width:320px">
								</colgroup>
								<tbody>
									<tr>
										<th data-th="From">From</th>
										<td data-th="From">
											<div class="input_box">
												<input type="text" name="from_tel" id="from_tel" size="30" class="input_text size_md" value="01012345678" readonly="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="To">To</th>
										<td data-th="To">
											<div class="input_box">
												<input type="text" name="to_tel" id="to_tel" size="30" class="input_text size_md" value="+886 926969409">
											</div>
										</td>
									</tr>
									<tr>
										<td data-th="Content" colspan="2">
											<div class="input_box">
												<textarea name="msg" id="msg" rows="10" class="input_text size_md h_auto" ></textarea>
												<div class="label_text input_txt size_md">
													<span class="bold blue">0</span>
													 Byte (SMS 발송)
												</div>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE modal_close">문자 발송</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>


</body>

</html>
