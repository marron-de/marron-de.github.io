<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 연차 신청 모달 -->
		<div id="memberWorking_modal" class="modal show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">연차관리</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="memberManager_fm" id="memberManager_fm" autocomplete="off" method="post" enctype="multipart/form-data" class="form form_box">
						<div class="tbl_box">
							<table class="tbl">
								<colgroup>
									<col style="width:50px" />
									<col style="width:100px" />
									<col style="width:160px" />
									<col style="width:160px" />
									<col style="width:95px" />
									<col style="width:120px" />
									<col style="width:120px" />
								</colgroup>
								<thead>
									<tr>
										<th data-th="No">No</th>
										<th data-th="구분">구분</th>
										<th data-th="시작일">시작일</th>
										<th data-th="종료일">종료일</th>
										<th data-th="일수">일수</th>
										<th data-th="사유">사유</th>
										<th data-th="입력일">입력일</th>
									</tr>
                    			</thead>
								<tbody>
									<tr>
										<td data-th="No">-</td>
										<td data-th="구분">
											<div class="select_box">
												<select name="gubun" id="gubun" class="select size_md" hname="구분" required>
													<option value="">선택</option>
													<option value="A">휴가</option>
													<option value="B">반차</option>
												</select>
											</div>
										</td>
										<td data-th="시작일">
											<div class="input_box">
												<input type="text" name="start_dt" class="input_text icon_ver icon_date calender_btn size_md start_cal" value="2025-08-07" readonly hname="시작일" required>
											</div>
										</td>
										<td data-th="종료일">
											<div class="input_box">
												<input type="text" name="end_dt" class="input_text icon_ver icon_date calender_btn size_md end_cal" value="2025-08-07" readonly hname="종료일" required>
											</div>
										</td>
										<td data-th="일수">
											<div class="input_box">
												<div class="input_flex">
													<input type="text" name="voca_cnt" class="input_text size_md" maxlength="4" hname="근무시간" required >
													<span class="txt">일</span>
												</div>
											</div>
										</td>
										<td data-th="사유">
											<div class="input_box">
												<input type="text" name="reason" class="input_text size_md" value="" hname="사유" required >
											</div>
										</td>
										<td data-th="입력일">
											<div class="tbl_btnbox center">
												<button type="button" class="button typeE auto size_sm">휴가등록</button>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>
				</div>
			</div>
		</div>

		<!-- 캘린더 팝업 -->

				<div class="leftbox">
					<p class="cal_date">
						<span class="cal_year">2025년</span>
						<span class="cal_month">8월</span>
					</p>
				</div>
				<div class="rightbox">
					<div class="paging_box">
						<button type="button" class="paging_btn prev_btn">
							<i class="ph ph-caret-left"></i>
						</button>
						<button type="button" class="paging_btn next_btn">
							<i class="ph ph-caret-right"></i>
						</button>
					</div>
				</div>
			</div>
			<div class="cal_body">

				</div>

					</div>
					<div class="date blue">
						<span class="num">23</span>
					</div>
				</div>
				<div class="week_date">
					<div class="date red">
						<span class="num">24</span>
					</div>
					<div class="date">

					</div>
					<div class="date">

					</div>
					<div class="date">

					<div class="date blue">

				</div>
				<div class="week_date">

					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
