<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 일정 추가 모달 -->
		<div id="writeSchedule_modal" class="modal show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">[2025-08-25] 일정 추가</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="writeSchedule_fm" id="writeSchedule_fm" autocomplete="off" method="post" enctype="multipart/form-data" class="form form_box">
						<div class="input_box">
							<label class="label_text" for="eventDate">날짜</label>
							<input class="input_text icon_ver icon_date calender_btn" id="eventDate" name="eventDate" type="text" placeholder="YYYY-MM-DD" required="required" readonly="readonly"/>
						</div>
						<div class="input_box">
							<label class="label_text" for="eventTitle">제목</label>
							<input class="input_text" id="eventTitle" name="eventTitle" type="text" placeholder="제목을 입력해주세요." required="required"/>
						</div>
						<div class="input_box">
                            <label class="label_text" for="eventDescription">내용</label>
							<textarea name="eventDescription" hname="내용" rows="5" class="input_text h_auto" id="eventDescription" placeholder="설명을 입력해주세요" required></textarea>
                        </div>
						<div class="input_box">
							<label class="label_text" for="eventWriter">작성자</label>
							<input class="input_text" id="eventWriter" name="eventWriter" type="text" placeholder="작성자를 입력해주세요." value="testdev" required="required" readonly="readonly"/>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE">등록</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
