<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 업무 보기 모달 -->
		<div id="workfloorView_modal" class="modal workfloor_modal_modal mobtbl show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">업무 보기</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form id="busEdit_fm" name="busEdit_fm" autocomplete="off" method="post" enctype="multipart/form-data"
						class="form form_box">
						<div class="tbl_box">
							<table class="tbl space_auto">
								<colgroup>
									<col style="width: 140px;">
									<col style="width: 613px;">
								</colgroup>
								<tbody>
									<tr>
										<th data-th="이름">이름</th>
										<td data-th="이름" class="align_left">홍길동</td>
									</tr>
									<tr>
										<th data-th="상태">상태</th>
										<td data-th="상태" class="align_left">대기중</td>
									</tr>
									<tr>
										<th data-th="일정">일정</th>
										<td data-th="일정" class="align_left">
											2025-09-01 ~ 2025-09-20
										</td>
									</tr>
									<tr>
										<th data-th="공유직원">공유직원</th>
										<td data-th="공유직원" class="align_left">홍길동</td>
									</tr>
									<tr>
										<th data-th="진행률">진행률</th>
										<td data-th="진행률" class="align_left">
											<div class="tbl_inline">
												<span class="txt">80%</span>
												<span class="badge typeD">완납</span>
												<span class="badge typeE">계약금</span>
												<span class="badge typeC">미납</span>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="제목">제목</th>
										<td data-th="제목" class="align_left">대기중인 업무입니다.</td>
									</tr>
									<tr>
										<th data-th="내용">내용</th>
										<td data-th="내용" class="align_left">
											대기중인 업무입니다. <br>
											대기중인 업무입니다. <br>
											대기중인 업무입니다. 
										</td>
									</tr>
									<tr>
										<th data-th="첨부파일">첨부파일</th>
										<td data-th="첨부파일" colspan="3">
											<div class="tbl_inline column_ver">
												<div class="input_box input_file_box">
													<div class="file_data">
														<img src="../img/ic_filedown.png" alt="" class="icon">
														<a href="" class="txt">테스트 파일.pdf</a>
														<button type="button" class="delete_btn">
															<i class="ph-fill ph-x-circle"></i>
														</button>
													</div>
												</div>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
