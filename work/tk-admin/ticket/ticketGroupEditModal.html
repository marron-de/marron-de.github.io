<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 티켓그룹 수정 모달 -->
		<div id="ticketGroupEdit_modal" class="modal ticketWrite_modal show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">티켓그룹 수정</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="frm_ticket_edit" id="frm_ticket_edit" method="post" class="form form_box">
						<div class="tbl_box">
							<table class="tbl">
								<colgroup>
									<col style="width: 180px;">
									<col style="width: 658px;">
								</colgroup>
								<tbody>
									<tr>
										<th data-th="공급처">공급처</th>
										<td data-th="공급처" class="align_left">여의도 63레스토랑</td>
									</tr>
									<tr>
										<th data-th="그룹 코드">그룹 코드</th>
										<td data-th="그룹 코드" class="align_left">63WOC13</td>
									</tr>
									<tr>
										<th data-th="그룹 이름">그룹 이름</th>
										<td data-th="그룹 이름">
											<div class="input_box">
												<input type="text" name="group_nm" class="input_text size_md" value="주중 런치 몬타나 1인 " hname="그룹이름" required="">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="메모">메모</th>
										<td data-th="메모" class="align_left">
											<div class="input_box">
												<input type="text" name="memo" class="input_text size_md" value="업로드 : 변유선 대리(2024.12.30)	">
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE">수정</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>

		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>


</body>

</html>
