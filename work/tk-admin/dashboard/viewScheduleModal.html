<!DOCTYPE html>
<html lang="en">

<head>

	<title>TK TRAVEL | ADMIN</title>

	<!-- Phosphor Icons -->

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">

	<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-theme="light">


    <div id="wrap"> 		
		
		<!-- 일정 상세 모달 -->

					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="form_infobox">
						<div class="item">
							<p class="tit">제목</p>
							<p class="desc">로망스투어미팅_13:00</p>
						</div>
						<div class="item">
							<p class="tit">시작일</p>
							<p class="desc">2025-08-07</p>
						</div>
						<div class="item">
							<p class="tit">종료일</p>
							<p class="desc">2025-08-15</p>
						</div>
						<div class="item">
							<p class="tit">설명</p>
							<p class="desc">
								&lt;로망스투어 웹개발 미팅&gt; <br>
								❍날짜 : 8월 7일(목) / 13:00~16:00 <br>
								❍장소 : 로망스투어 본사 <br>
								❍참석 : 어지영이사님,과장님 TK트래블 대표, 개발 팀장 <br>
								❍내용 : 상품명>출발일자> [차량호차]구분 -> (1) 차량호차별 차량배정 -> (2) 차량호차별 가이드 배정
							</p>
						</div>
						<div class="item">
							<p class="tit">구분</p>
							<p class="desc">업무미팅</p>
						</div>
					</div>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE" onclick="editSchedule_modal();">수정</button>
						<button class="modal_btn button auto typeF">삭제</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
