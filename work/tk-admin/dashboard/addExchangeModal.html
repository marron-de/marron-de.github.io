<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 환율등록 모달 -->
		<div id="addExchange_modal" class="modal exchange_modal mobtbl show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">환율등록</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="frm_write" id="frm_write" method="post" enctype="multipart/form-data" autocomplete="off" class="form">
						<div class="tbl_box">
							<table class="tbl space_auto">
								<colgroup>
									<col style="width: 160px;">
									<col style="width: 378px;">
								</colgroup>
								<tbody>
									<tr>
										<th data-th="화폐단위(한글)">화폐단위(한글)</th>
										<td data-th="화폐단위(한글)">
											<div class="input_box">
												<input type="text" class="input_text size_md" placeholder="예) 원, 달러">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="화폐단위(영문)">화폐단위(영문)</th>
										<td data-th="화폐단위(영문)">
											<div class="input_box">
												<input type="text" class="input_text size_md" placeholder="예) KRW, USD">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="화폐기호">화폐기호</th>
										<td data-th="화폐기호">
											<div class="input_box">
												<input type="text" class="input_text size_md" placeholder="예) ￦,＄">
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="교환가격(KRW)">교환가격(KRW)</th>
										<td data-th="교환가격(KRW)">
											<div class="input_box input_flex">
												<input type="text" class="input_text size_md">
												<span class="label_text input_txt size_md">원(KRW)</span>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="절삭단위">절삭단위</th>
										<td data-th="절삭단위">
											<div class="radio_wrap">
												<div class="radio_box size_md">
													<input type="radio" name="ext_unit" id="ext_unit_2" class="input_radio" checked>
													<label for="ext_unit_2" class="label_radio">100원단위</label>
												</div>
												<div class="radio_box size_md">
													<input type="radio" name="ext_unit" id="ext_unit_1" class="input_radio">
													<label for="ext_unit_1" class="label_radio">1,000원단위</label>
												</div>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="올림/반올림/버림">올림/반올림/버림</th>
										<td data-th="올림/반올림/버림">
											<div class="radio_wrap">
												<div class="radio_box size_md">
													<input type="radio" name="ext_round" id="ext_round_1" class="input_radio">
													<label for="ext_round_1" class="label_radio">올림</label>
												</div>
												<div class="radio_box size_md">
													<input type="radio" name="ext_round" id="ext_round_2" class="input_radio" checked>
													<label for="ext_round_2" class="label_radio">반올림</label>
												</div>
												<div class="radio_box size_md">
													<input type="radio" name="ext_round" id="ext_round_3" class="input_radio">
													<label for="ext_round_3" class="label_radio">버림</label>
												</div>
											</div>
										</td>
									</tr>
								</tbody>
							</table>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE">등록</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
	<!-- 공통요소 추가 -->
	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}
	</script>
	<script src="../js/common.js"></script>

</body>

</html>
