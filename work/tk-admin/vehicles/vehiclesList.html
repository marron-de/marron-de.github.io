	<!-- 공통요소 추가 -->
	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}

		replaceModule('../common/header.html', '#header');
		replaceModule('../common/footer.html', '#footer');
		replaceModule('../common/sidenav_vehicles.html', '#sidenav');


		$(window).on("load", function () {
			setTimeout(() => {
				$(".header .h_bottom .gnb .gnb_item").eq(6).addClass("active");
				$(".sidenav .side_cont .side_submenubox .menu_list .side_item").eq(0).addClass("active");
			}, 100);
		});
	</script>
	<script src="../js/common.js"></script>


	<!-- Summernote Lite CSS/JS (부트스트랩 불필요) -->
	<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">

	<script>
		document.addEventListener('DOMContentLoaded', function () {
			$('.summernote').summernote({

				toolbar: [
					// 1줄: 글꼴, 크기, 스타일
					['fontname', ['fontname']],
					['fontsize', ['fontsize']],
					['height', ['height']],
					['style', ['bold', 'italic', 'underline', 'strikethrough', 'clear']],
					// 2줄: 색상, 정렬, 리스트
					['color', ['color']],
					['para', ['ul', 'ol', 'paragraph']],
					// 3줄: 링크, 이미지, 표, 코드 등
					['insert', ['link', 'picture', 'video', 'table', 'hr']],
					['view', ['fullscreen', 'codeview', 'help']]
				],
				fontNames: ['맑은 고딕', '굴림', '돋움', 'Arial', 'Arial Black', 'Comic Sans MS', 'Courier New'],
