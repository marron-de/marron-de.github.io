<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 

		<!-- 차량등록 모달 -->
		<div id="carWrite_modal" class="modal car_modal show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">차량 등록</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="car_frm" id="car_frm" method="get" class="form form_box">	
						<div class="car_formbox">
							<div class="car_imgbox">
								<div class="input_box input_file_box">
									<span class="label_text input_txt">차량 사진</span>
									<div class="input_flex">
										<input type="file" class="input_file" id="userFile1" name="userFile1">
										<label for="userFile1" class="label_file size_md">선택된 파일 없음</label>
										<button type="button" class="input_btn fileSelect_btn size_md">파일 선택</button>
									</div>
									<p class="input_status point">차량사진을 업로드해주세요</p>
								</div>
							</div>
							<div class="car_infobox tbl_box">
								<table class="tbl space_auto">
									<colgroup>
										<col style="width: 90px;">
										<col style="width: 144px">
										<col style="width: 90px;">
										<col style="width: 144px">
										<col style="width: 90px;">
										<col style="width: 144px">
										<col style="width: 90px;">
										<col style="width: 144px">
									</colgroup>
									<tbody>
										<tr>
											<th data-th="차량종류">차량종류</th>
											<td data-th="차량종류" colspan="7">
												<div class="input_box">
													<input name="car_type" id="car_type" type="text" value="" class="input_text size_md" hname="차량종류" required="">
												</div>
											</td>
										</tr>
										<tr>
											<th data-th="탑승인원">탑승인원</th>
											<td data-th="탑승인원">
												<div class="input_box">
													<input name="passenger_cnt" id="passenger_cnt" type="text" value="" class="input_text size_md" hname="탑승인원" required="">
												</div>
											</td>
											<th data-th="좌석수">좌석수</th>
											<td data-th="좌석수">
												<div class="input_box">
													<input name="seat_cnt" id="seat_cnt" type="text" value="" class="input_text size_md" hname="좌석수" required="">
												</div>
											</td>
											<th data-th="수하물">수하물</th>
											<td data-th="수하물">
												<div class="input_box">
													<input name="baggage" id="baggage" type="text" value="" class="input_text size_md" hname="수하물" required="">
												</div>
											</td>
											<th data-th="최대인원">최대인원</th>
											<td data-th="최대인원">
												<div class="input_box">
													<input name="max_cnt" id="max_cnt" type="text" value="" class="input_text size_md" hname="최대인원" required="">
												</div>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>		
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE">등록</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
