<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyeT</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

</head>

<body>


    <div class="wrap">

        <!-- modal -->
        <div id="sch_filter_modal" class="modal type2 show">
            <div class="modal_box">
				<div class="modal_head">
					<p class="modal_tit">검색필터</p>
					<button type="button" class="close_btn modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="form_box">
						<div class="form_item">
							<p class="form_tit">
								<span class="txt">분야</span>
							</p>
							<div class="check_wrap">
								<div class="check_box full">
									<input type="checkbox" name="check1" id="check1-1" class="input_check" checked>
									<label for="check1-1" class="label_check">전체보기</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1-2" class="input_check">
									<label for="check1-2" class="label_check">공공행정</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1-3" class="input_check">
									<label for="check1-3" class="label_check">환경기상</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1-4" class="input_check">
									<label for="check1-4" class="label_check">재정금융</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1-5" class="input_check">
									<label for="check1-5" class="label_check">식품건강</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1-6" class="input_check">
									<label for="check1-6" class="label_check">보건의료</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1-7" class="input_check">
									<label for="check1-7" class="label_check">재난안전</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1-8" class="input_check">
									<label for="check1-8" class="label_check">문화관광</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1-9" class="input_check">
									<label for="check1-9" class="label_check">교통물류</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1-10" class="input_check">
									<label for="check1-10" class="label_check">사회복지</label>
								</div>
							</div>
						</div>
						<div class="form_item">
							<p class="form_tit">
								<span class="txt">분석과정</span>
							</p>
							<div class="check_wrap">
								<div class="check_box full">
									<input type="checkbox" name="check2" id="check2-1" class="input_check" checked>
									<label for="check2-1" class="label_check">전체보기</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check2" id="check2-2" class="input_check">
									<label for="check2-2" class="label_check">자동화</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check2" id="check2-3" class="input_check">
									<label for="check2-3" class="label_check">모델링</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check2" id="check2-4" class="input_check">
									<label for="check2-4" class="label_check">정제/가공</label>
								</div>		
							</div>
						</div>
						<div class="form_item">
							<p class="form_tit">
								<span class="txt">금액</span>
							</p>			
							<div class="multi_range">
								<div class="range_slider">
									<input type="range" id="input_left" min="0" max="1000000" value="128000" step="100"/>
									<input type="range" id="input_right" min="0" max="1000000"  value="689000" step="100"/>
								</div>
								<div class="slider">
									<div class="track"></div>
									<div class="range"></div>
									<div class="thumb_left">
										<div class="thumb left">
											<div class="popover">128,000원</div>
										</div>
									</div>
									<div class="thumb_right">
										<div class="thumb right">
											<div class="popover">689,000원</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
                <div class="modal_btnbox">
                    <button class="modal_btn button typeA modal_close">적용</button>
                    <button class="modal_btn button typeC">초기화</button>
                </div>
            </div>
        </div>

	</div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
