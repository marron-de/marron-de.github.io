<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EyeT</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

</head>

<body>


    <div class="wrap">

       <!-- modal -->
        <div id="curriculum_apply_modal" class="modal type2 show">
            <div class="modal_box">
				<div class="modal_head">
					<p class="modal_tit big">2023년 3월 데이터 전처리 과정 교육 교육신청</p>
					<button type="button" class="close_btn modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="modal_contbox">
						<div class="modal_cont">
							<div class="tbl_wrap">
								<p class="modal_conttit">신청 교육</p>
								<table class="tbl ver2">
									<colgroup>
										<col style="width: 277px;">
										<col style="width: 922px;">
									</colgroup>
									<tbody>
										<tr>
											<th>교육(세미나)명</th>
											<td class="left_align">
												98차 실습세미나 - SPSS를 활용한 반복측정 분산분석(RM-ANOVA)과 일반화 추정방식(GEE)
											</td>
										</tr>
										<tr>
											<th>교육(세미나)기간</th>
											<td class="left_align">
												2023.12.25 ~ 2025.12.31
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>
						<div class="modal_cont">
							<p class="modal_conttit">신청자 정보</p>
							<div class="form_box">
								<div class="form_itembox">
									<div class="input_box">
										<input type="text" class="input_text" placeholder="성명">
									</div>
									<div class="input_box">
										<input type="text" class="input_text" placeholder="소속기관/학교">
									</div>
									<div class="input_box">
										<input type="text" class="input_text" placeholder="연락처">
									</div>
									<div class="input_box">
										<input type="text" class="input_text" placeholder="부서/학과">
									</div>
									<div class="input_box">
										<input type="text" class="input_text" placeholder="이메일">
									</div>
									<div class="input_box">
										<input type="text" class="input_text" placeholder="직급">
									</div>
									<div class="input_box full">
										<input type="text" class="input_text" placeholder="기타(교재 수령 주소)">
									</div>
								</div>
								<div class="totalinfo">
									<p class="txt">교육비 : 90,000원</p>
								</div>
								<div class="payinfo">
									<p class="modal_conttit">결제 정보</p>
									<div class="radio_wrap">
										<div class="radio_box">
											<input type="radio" name="payment" id="payment1" class="input_radio">
											<label for="payment1" class="label_radio">무통장 입금</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="payment" id="payment2" class="input_radio" checked>
											<label for="payment2" class="label_radio">온라인 카드결제</label>
										</div>
									</div>
								</div>
								<div class="terminfo">
									<p class="modal_conttit">개인정보 수집 및 이용목적에 대한 동의</p>
									<div class="radio_wrap">
										<div class="radio_box">
											<input type="radio" name="personal" id="personal1" class="input_radio">
											<label for="personal1" class="label_radio">동의</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="personal" id="personal2" class="input_radio" checked>
											<label for="personal2" class="label_radio">비동의</label>
										</div>
									</div>
								<div class="input_box">
									<textarea class="input_text" placeholder="개인정보보를 보호법 제 30조에 따라 정보 주체의 개인정보를 보호하고 이와 관련한 고충을 신속하고 원활하게 처리할 수 있도록&#13;&#10;하기 위해 다음과 같이 개인정보를 처리합니다."></textarea>
								</div>
								</div>
							</div>
						</div>
					</div>
				</div>
                <div class="modal_btnbox">
					<button class="modal_btn button typeC">취소</button>
                    <button class="modal_btn button typeA modal_close">교육신청</button>
                </div>
            </div>
        </div>

	</div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
