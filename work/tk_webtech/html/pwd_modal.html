<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK웹테크</title>

    <!-- jquery -->
    <script src="../js/jquery-3.6.0.min.js"></script>

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js"></script>	

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- lucide -->
	<script src="https://unpkg.com/lucide@latest"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Noto+Sans+KR:wght@100..900&family=Noto+Serif+KR:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/Pretendard.css">

</head>

<body>


    <div class="wrap"> 

        <!-- pwd modal -->
        <div class="modal pwd_modal show">
			<div class="modal_inner">
				<div class="modal_box">
					<div class="modal_icon">
						<i data-lucide="circle-alert"></i>
					</div>
					<p class="modal_tit">비밀번호 입력</p>
					<p class="modal_desc">게시글 비밀번호를 입력해주세요</p>
					<div class="modal_input input_box">
						<input type="text" class="input_text" placeholder="비밀번호를 입력해주세요.">
					</div>
					<div class="modal_btnbox">
						<button class="modal_btn typeA">확인</button>
						<button class="modal_btn typeB modal_close">취소 </button>
					</div>
				</div>
			</div>
        </div>
		
    </div>



    <!-- JS -->
    <script src="../js/common.js"></script>



</body>

</html>
