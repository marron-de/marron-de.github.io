<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">인성검사 PT</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox done">
						<div class="progress">
							<div class="bar" style="width: 100%;"></div>
						</div>
						<div class="time">00:00</div>
					</div>
					<div class="question">
						<p class="q_toptxt">
							다음 질문을 읽고 각 물음에 솔직히 응답하여 주십시오.
						</p>
						<p class="q_sub">질문 1/110</p>
						<p class="q_tit">
							정당한 대가나 보상이 없는 선행을 베푸는 데는 <br>
							다소 소극적이다.
						</p>
						<div class="answer_box">
							<div class="answer_item">
								<input type="radio" name="answer1" id="answer1-1" class="input_answer" checked>
								<label for="answer1-1" class="label_answer">
									<span class="txt">전혀 그렇지 않다</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer1" id="answer1-2" class="input_answer">
								<label for="answer1-2" class="label_answer">
									<span class="txt">그렇지 않다</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer1" id="answer1-3" class="input_answer">
								<label for="answer1-3" class="label_answer">
									<span class="txt">보통이다</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer1" id="answer1-4" class="input_answer">
								<label for="answer1-4" class="label_answer">
									<span class="txt">그렇다</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer1" id="answer1-5" class="input_answer">
								<label for="answer1-5" class="label_answer">
									<span class="txt">매우 그렇다</span>
									<span class="check"></span>
								</label>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="page_btnbox">
				<button type="button" class="button typeA big2 full">검사완료</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
