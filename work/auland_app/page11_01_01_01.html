<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap">

		<div class="modal show">
			<div class="modal_box">
				<div class="modal_head">
					<p class="h_title">취업준비도 검사 ABT</p>	
					<button type="button" class="modal_close close_btn"></button>
				</div>
				<div class="modal_body">
					<p class="modal_tit">
						본 검사는 <span class="red">본인의 객관적인 취업준비 상태를</span> <br>
						<span class="red">진단하고 보완</span>하는데 도움을 주기 위한 검사입니다.
					</p>	
					<p class="modal_desc">
						각 항목별 본인의 취업준비 정보를 정확하게 <br>
						입력해 주시기 바랍니다.
					</p>
				</div>
				<div class="modal_btnbox">
					<button type="button" class="button typeA full">검사 시작하기</button>
				</div>
			</div>
		</div>
		
	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
