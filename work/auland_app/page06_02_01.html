<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap">

		<div class="modal show">
			<div class="modal_box">
				<div class="modal_head">
					<p class="h_title">인성검사 PT</p>	
					<button type="button" class="modal_close close_btn"></button>
				</div>
				<div class="modal_body">
					<p class="modal_tit">
						당신이 <span class="red">어떠한 성격특성을 가지고 있는지</span> <br>
						알려주기 위한 검사입니다.
					</p>	
					<p class="modal_desc">
						11가지 인성을 크게 세가지 주요 인성으로 구분한  <br>
						결과를 제공합니다. 인성수준별상세 정보를 제공함으로써 <br>
						본인의 성격특성을 파악할 수 있도록 도움을 드립니다.
					</p>
				</div>
				<div class="modal_btnbox">
					<button type="button" class="button typeA full">검사 시작하기</button>
				</div>
			</div>
		</div>
		
	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
