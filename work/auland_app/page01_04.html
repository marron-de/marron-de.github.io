<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap login_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox">
					<button type="button" class="back_btn"></button>
				</div>
				<div class="h_centerbox">
					<p class="h_title">로그인</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="profile_btn"></button>
					<button type="button" class="menu_btn menu_open"></button>
				</div>
			</div>
		</header>

		<!-- nav menu  -->
		<div class="nav_menu">
			<div class="inner menu_head">
				<div class="leftbox">
					로그인이 필요합니다.
				</div>
				<div class="rightbox">
					<button type="button" class="login_btn">로그인</button>
					<button type="button" class="close_btn menu_close"></button>
				</div>
			</div>
			<div class="menu_body">
				<ul class="accordion">
					<li>
						<a href="" class="acc_link">
							<span class="tit">검사소개</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">검사가이드</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li class="show">
						<div class="acc_link acc_tit">
							<span class="tit">검사하기</span>
							<span class="arrow"></span>
						</div>
						<ul class="acc_cont" style="display: block;">
							<li>
								<div class="listbox">
									<a href="" class="link">고학년</a>
									<a href="" class="link">저학년</a>
									<a href="" class="link">전문대</a>
								</div>
							</li>
						</ul>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">마이페이지</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">이용권구매</span>
							<span class="arrow"></span>
						</a>
					</li>
				</ul>
			</div>
		</div>

		<!-- container -->
		<div class="container">
			
			<section class="section login_section">
				<div class="inner">
					<div class="tit_box">
						<p class="tit">회원 로그인</p>
						<p class="desc">에듀스 계정으로 로그인할 수 있어요!</p>
					</div>
					<div class="form_box">
						<div class="form_item input_box">
							<input type="text" class="input_text" placeholder="아이디를 입력해주세요.">
						</div>
						<div class="form_item input_box">
							<input type="text" class="input_text" placeholder="휴대전화 번호를 입력해주세요.">
						</div>
						<div class="form_item check_wrap">
							<div class="check_box">
								<input type="checkbox" name="saveId" id="saveId" class="input_check" checked>
								<label for="saveId" class="label_check">아이디 저장</label>
							</div>
							<div class="check_box">
								<input type="checkbox" name="autoLogin" id="autoLogin" class="input_check">
								<label for="autoLogin" class="label_check">자동 로그인</label>
							</div>
						</div>
					</div>
					<div class="form_btns">
						<button type="button" class="button typeA big full">로그인</button>
					</div>
					<div class="sch_box">
						<a href="" class="link">아이디 찾기</a>
						<span class="dot"></span>
						<a href="" class="link">비밀번호 찾기</a>
						<span class="dot"></span>
						<a href="" class="link">회원가입</a>
					</div>
					<div class="sns_login">
						<p class="sns_tit">SNS 로그인</p>
						<div class="sns_box">
							<button type="button" class="sns_btn sns_google">
								<img src="img/sns_google.png" alt="" class="img">
							</button>
							<button type="button" class="sns_btn sns_kakao">
								<img src="img/sns_kakao.png" alt="" class="img">
							</button>
							<button type="button" class="sns_btn sns_naver">
								<img src="img/sns_naver.png" alt="" class="img">
							</button>
							<button type="button" class="sns_btn sns_apple">
								<img src="img/sns_apple.png" alt="" class="img">
							</button>
						</div>
					</div>
				</div>
			</section>
			
		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
