<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap mypage_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">결제금액</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section mypage_section">
				<div class="inner">
					<div class="payment_box">
						<div class="payment_list">
							<div class="item">
								<p class="tit">ITEM PLAN</p>
								<p class="price">25,000원</p>
							</div>
							<div class="item">
								<p class="tit">VAT</p>
								<p class="price">2,500원</p>
							</div>
							<div class="item">
								<p class="tit">최종결제금액</p>
								<p class="price total">27,500원</p>
							</div>
						</div>
						<button type="button" class="button typeA big2 full">결제하기</button>
					</div>
				</div>
			</section>
			
		</div>
		
	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
