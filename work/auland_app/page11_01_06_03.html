<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap">

		<div class="modal bottom show">
			<div class="modal_box">
				<div class="modal_head">
					<p class="h_title">수상경험 내용을 선택하세요!</p>	
					<button type="button" class="modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="check_list">
						<div class="check_item">
							<input type="radio" name="check" id="check1" class="check_input" checked>
							<label for="check1" class="check_txt">
								<span class="txt">[대기업] 광고/아이디어</span>
								<span class="icon"></span>
							</label>
						</div>
						<div class="check_item">
							<input type="radio" name="check" id="check2" class="check_input">
							<label for="check2" class="check_txt">
								<span class="txt">[대기업] 디자인/플래시</span>
								<span class="icon"></span>
							</label>
						</div>
						<div class="check_item">
							<input type="radio" name="check" id="check3" class="check_input">
							<label for="check3" class="check_txt">
								<span class="txt">[대기업] 브랜드/네이밍</span>
								<span class="icon"></span>
							</label>
						</div>
						<div class="check_item">
							<input type="radio" name="check" id="check4" class="check_input">
							<label for="check4" class="check_txt">
								<span class="txt">[대기업] 마케팅</span>
								<span class="icon"></span>
							</label>
						</div>
						<div class="check_item">
							<input type="radio" name="check" id="check5" class="check_input">
							<label for="check5" class="check_txt">
								<span class="txt">[대기업] 사진/영상/UCC</span>
								<span class="icon"></span>
							</label>
						</div>
					</div>
				</div>
			</div>
		</div>
		
	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
