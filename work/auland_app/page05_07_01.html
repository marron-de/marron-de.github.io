<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap mypage_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox">
					<button type="button" class="back_btn"></button>
				</div>
				<div class="h_centerbox">
					<p class="h_title">문의하기</p>
				</div>
				<div class="h_rightbox"></div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section mypage_section flexible">
				<div class="inner">
					<div class="form_box ver2">
						<div class="form_item input_box">
							<p class="label_text">문의유형</p>
							<div class="select_box">
								<select class="select">
									<option value="">문의 유형을 선택해주세요.</option>
								</select>
							</div>
						</div>
						<div class="form_item input_box">
							<p class="label_text">제목</p>
							<input type="text" class="input_text" placeholder="제목을 입력해주세요.">
						</div>
						<div class="form_item input_box">
							<p class="label_text">문의 내용</p>
							<textarea class="input_text" placeholder="내용을 입력해주세요."></textarea>
							<p class="input_count">0/1000</p>
						</div>
					</div>
				</div>
			</section>
	
			<div class="page_btnbox">
				<button type="button" class="button typeA big2 full">등록하기</button>
			</div>
			
		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
