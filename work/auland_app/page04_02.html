<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap guide_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox">
					<button type="button" class="back_btn"></button>
				</div>
				<div class="h_centerbox">
					<p class="h_title">저학년 검사 안내</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="profile_btn"></button>
					<button type="button" class="menu_btn menu_open"></button>
				</div>
			</div>
		</header>

		<!-- nav menu  -->
		<div class="nav_menu">
			<div class="inner menu_head">
				<div class="leftbox">
					로그인이 필요합니다.
				</div>
				<div class="rightbox">
					<button type="button" class="login_btn">로그인</button>
					<button type="button" class="close_btn menu_close"></button>
				</div>
			</div>
			<div class="menu_body">
				<ul class="accordion">
					<li>
						<a href="" class="acc_link">
							<span class="tit">검사소개</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">검사가이드</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li class="show">
						<div class="acc_link acc_tit">
							<span class="tit">검사하기</span>
							<span class="arrow"></span>
						</div>
						<ul class="acc_cont" style="display: block;">
							<li>
								<div class="listbox">
									<a href="" class="link">고학년</a>
									<a href="" class="link">저학년</a>
									<a href="" class="link">전문대</a>
								</div>
							</li>
						</ul>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">마이페이지</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">이용권구매</span>
							<span class="arrow"></span>
						</a>
					</li>
				</ul>
			</div>
		</div>

		<!-- container -->
		<div class="container">
			
			<section class="section video_section video_sec1">
				<div class="inner">
					<div class="titbox">
						<p class="tit">아우란트 저학년 홍보동영상</p>
						<div class="descbox">
							<p class="desc">강의수 4강</p>
							<span class="dot"></span>
							<p class="desc">강의시간 약 22분</p>
						</div>
					</div>
					<div class="vidcont">
						<div class="vidbox">
							<video playsinline loop preload="auto" class="video" poster="img/video_poster.png">
								<source src="img/testvideo.mp4" type="video/mp4">
							</video>
							<button type="button" class="play_video"></button>
						</div>
						<div class="controls">
							<div class="btnbox left">
								<button type="button" class="btn play_btn"></button>
							</div>
							<div class="time">
								<span class="now">0:50</span> / 5:00
							</div>
							<div class="progress">
								<div class="load" style="width:18.748%"></div>
								<div class="bar" style="width:12.5%;"></div>
							</div>
							<div class="btnbox right">
								<button type="button" class="btn volume_btn"></button>
								<button type="button" class="btn fullscreen_btn"></button>
								<button type="button" class="btn option_btn"></button>
							</div>
						</div>

					</div>
				</div>
			</section>
			
			<section class="section video_section video_sec2">
				<div class="inner">
					<div class="video_cont">
						<p class="video_tit">강의보기</p>
						<div class="video_list">
							<div class="item vidcont">
								<div class="vidbox">
									<video playsinline loop preload="auto" class="video" poster="img/video_poster.png">
										<source src="img/testvideo.mp4" type="video/mp4">
									</video>
									<button type="button" class="play_video"></button>
									<div class="progress">
										<div class="bar" style="width:55.17%;"></div>
									</div>
								</div>
								<div class="txtbox">
									<p class="tit">01 아우란트 검사소개</p>
									<p class="time">13분</p>
								</div>
							</div>
							<div class="item vidcont">
								<div class="vidbox">
									<video playsinline loop preload="auto" class="video" poster="img/video_poster.png">
										<source src="img/testvideo.mp4" type="video/mp4">
									</video>
									<button type="button" class="play_video"></button>
									<div class="progress">
										<div class="bar" style="width:55.17%;"></div>
									</div>
								</div>
								<div class="txtbox">
									<p class="tit">02 클론매칭 소개</p>
									<p class="time">3분</p>
								</div>
							</div>
							<div class="item vidcont">
								<div class="vidbox">
									<video playsinline loop preload="auto" class="video" poster="img/video_poster.png">
										<source src="img/testvideo.mp4" type="video/mp4">
									</video>
									<button type="button" class="play_video"></button>
									<div class="progress">
										<div class="bar" style="width:55.17%;"></div>
									</div>
								</div>
								<div class="txtbox">
									<p class="tit">03 검사결과 활용</p>
									<p class="time">5분</p>
								</div>
							</div>
							<div class="item vidcont">
								<div class="vidbox">
									<video playsinline loop preload="auto" class="video" poster="img/video_poster.png">
										<source src="img/testvideo.mp4" type="video/mp4">
									</video>
									<button type="button" class="play_video"></button>
									<div class="progress">
										<div class="bar" style="width:55.17%;"></div>
									</div>
								</div>
								<div class="txtbox">
									<p class="tit">04 검사 실시 안내</p>
									<p class="time">1분</p>
								</div>
							</div>
						</div>
					</div>
					<div class="video_cont">
						<p class="video_tit">안내 동영상 보기</p>
						<div class="video_btnbox">
							<button type="button" class="button full vid_btn">
								<span class="txt">저학년 검사 안내 동영상 보기</span>
								<span class="icon"></span>
							</button>
							<button type="button" class="button full vid_btn">
								<span class="txt">고학년 검사 안내 동영상 보기</span>
								<span class="icon"></span>
							</button>
						</div>
					</div>
				</div>
			</section>
			
		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
