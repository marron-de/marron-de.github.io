<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap join_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox">
					<button type="button" class="back_btn"></button>
				</div>
				<div class="h_centerbox">
					<p class="h_title">회원가입</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="profile_btn"></button>
					<button type="button" class="menu_btn menu_open"></button>
				</div>
			</div>
		</header>

		<!-- nav menu  -->
		<div class="nav_menu">
			<div class="inner menu_head">
				<div class="leftbox">
					로그인이 필요합니다.
				</div>
				<div class="rightbox">
					<button type="button" class="login_btn">로그인</button>
					<button type="button" class="close_btn menu_close"></button>
				</div>
			</div>
			<div class="menu_body">
				<ul class="accordion">
					<li>
						<a href="" class="acc_link">
							<span class="tit">검사소개</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">검사가이드</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li class="show">
						<div class="acc_link acc_tit">
							<span class="tit">검사하기</span>
							<span class="arrow"></span>
						</div>
						<ul class="acc_cont" style="display: block;">
							<li>
								<div class="listbox">
									<a href="" class="link">고학년</a>
									<a href="" class="link">저학년</a>
									<a href="" class="link">전문대</a>
								</div>
							</li>
						</ul>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">마이페이지</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">이용권구매</span>
							<span class="arrow"></span>
						</a>
					</li>
				</ul>
			</div>
		</div>

		<!-- container -->
		<div class="container">
			
			<section class="section join_section step3 full">
				<div class="inner">
					<div class="form_box ver2">
						<div class="form_item input_box">
							<p class="label_text">아이디</p>
							<div class="input_flex">
								<input type="text" class="input_text" placeholder="아이디를 입력해주세요.">
								<button type="button" class="button typeB input_btn">중복확인</button>
							</div>
						</div>
						<div class="form_item input_box">
							<p class="label_text">비밀번호</p>
							<input type="password" class="input_text" placeholder="비밀번호를 입력해주세요.">
						</div>
						<div class="form_item input_box">
							<p class="label_text">비밀번호 확인</p>
							<input type="password" class="input_text" placeholder="확인을 위해 비밀번호를 재입력해주세요.">
							<div class="input_descbox">
								<p class="input_desc">
									비밀번호는 영문소문자, 숫자를 포함하여 10~20자리로 입력하세요.
								</p>
								<p class="input_desc">
									비밀번호는 아이디와 유사하거나 3자 이상 중복될 경우 사용을 <br>자제해주세요.
								</p>
							</div>
						</div>
						<div class="form_item input_box">
							<p class="label_text">이름</p>
							<input type="text" class="input_text" placeholder="이름을 입력해주세요.">
						</div>
						<div class="form_item input_box">
							<p class="label_text">이메일주소</p>
							<input type="text" class="input_text" placeholder="이메일 주소를 입력해주세요.">
						</div>
						<div class="form_item input_box">
							<p class="label_text">휴대전화 번호</p>
							<div class="input_flex column">
								<div class="input_flex">
									<input type="text" class="input_text" placeholder="휴대전화 번호를 입력해주세요.">
									<button type="button" class="button typeB input_btn">인증요청</button>
								</div>
								<div class="input_flex">
									<div class="input_verification full">
										<input type="text" class="input_text" placeholder="인증번호를 입력해 주세요.">
										<span class="time">2:46</span>
									</div>
									<button type="button" class="button typeA input_btn">확인</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="page_btnbox">
				<button type="button" class="button typeC big full">취소</button>
				<button type="button" class="button typeA big full">회원가입</button>
			</div>
			
		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
