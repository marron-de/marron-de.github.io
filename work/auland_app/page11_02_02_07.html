<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">취업준비도 검사 ABT</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox">
						<div class="progress">
							<div class="bar" style="width: 80%;"></div>
						</div>
					</div>
					<div class="question">
						<p class="q_toptxt ver2">
							다음 항목을 입력해 주시기 바랍니다.
							<span class="small">(4/5)</span>
						</p>
						<p class="q_tit">진로, 취업관련 서비스 경험</p>
						<div class="form_box ver2">
							<div class="form_item input_box">
								<p class="label_text">서비스 이용횟수</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-1" class="input_radio" checked>
										<label for="radio1-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-2" class="input_radio">
										<label for="radio1-2" class="label_radio">1회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-3" class="input_radio">
										<label for="radio1-3" class="label_radio">2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-4" class="input_radio">
										<label for="radio1-4" class="label_radio">3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-5" class="input_radio">
										<label for="radio1-5" class="label_radio">4회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text flex">
									<span class="tit">종류</span>
									<span class="desc">(* 가장 비중이 큰 것 기입)</span>
								</p>
								<div class="radio_wrap">
									<div class="radio_box full start">
										<input type="radio" name="radio2" id="radio2-1" class="input_radio" checked>
										<label for="radio2-1" class="label_radio">
											학생생활 연구소를 통한 개인 상담
										</label>
									</div>
									<div class="radio_box full start">
										<input type="radio" name="radio2" id="radio2-2" class="input_radio">
										<label for="radio2-2" class="label_radio">
											취업관련 특강 및 세미나 참여
										</label>
									</div>
									<div class="radio_box full start">
										<input type="radio" name="radio2" id="radio2-3" class="input_radio">
										<label for="radio2-3" class="label_radio">
											취업정보 이용, 구직 및 부직 신청
										</label>
									</div>
									<div class="radio_box full start">
										<input type="radio" name="radio2" id="radio2-4" class="input_radio">
										<label for="radio2-4" class="label_radio">
											학과(부)에서 제공하는 서비스 이용
										</label>
									</div>
									<div class="radio_box full start">
										<input type="radio" name="radio2" id="radio2-5" class="input_radio">
										<label for="radio2-5" class="label_radio">
											진로 준비 및 취업관련 교과목 수강
										</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box mt16">
								<p class="q_tit">졸업 후 진로계획</p>
								<div class="input_box">
									<p class="label_text">계획 유,무</p>
									<div class="radio_wrap">
										<div class="radio_box">
											<input type="radio" name="radio3" id="radio3-1" class="input_radio" checked>
											<label for="radio3-1" class="label_radio">없음</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio3" id="radio3-2" class="input_radio">
											<label for="radio3-2" class="label_radio">있다</label>
										</div>
									</div>
								</div>
							</div>
							<div class="form_item input_box">							
								<p class="label_text flex">종류</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-1" class="input_radio" checked>
										<label for="radio4-1" class="label_radio">취업</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-2" class="input_radio">
										<label for="radio4-2" class="label_radio">편,입학</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-3" class="input_radio">
										<label for="radio4-3" class="label_radio">유학</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-4" class="input_radio">
										<label for="radio4-4" class="label_radio">대학원 진학</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-5" class="input_radio">
										<label for="radio4-5" class="label_radio">진학과 취업 병행</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-6" class="input_radio">
										<label for="radio4-6" class="label_radio">사업</label>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="page_btnbox">
				<button type="button" class="button typeC big2 full alert_ver">
					<span class="txt">임시저장</span>
					<span class="alert_icon">
						<img src="img/ico_alert3.png" alt="" class="btn">
						<div class="tooltip">
							<p class="txt">
								잠시 자리를 비우거나 휴식이 필요할 <br>
								때는 임시로 저장할 수 있어요!
							</p>
						</div>
					</span>
				</button>
				<button type="button" class="button typeA big2 full">다음</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
