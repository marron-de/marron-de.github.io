<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">취업준비도 검사 ABT</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox">
						<div class="progress">
							<div class="bar" style="width: 80%;"></div>
						</div>
					</div>
					<div class="question">
						<p class="q_toptxt ver2">
							다음 항목을 입력해 주시기 바랍니다.
							<span class="small">(4/5)</span>
						</p>
						<p class="q_tit">취업준비 경험</p>
						<div class="form_box ver2">
							<div class="form_item input_box">
								<p class="label_text">취업(진로) 관련 정보제공, 지도 받은 경험</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-1" class="input_radio" checked>
										<label for="radio1-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-2" class="input_radio">
										<label for="radio1-2" class="label_radio">1회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-3" class="input_radio">
										<label for="radio1-3" class="label_radio">2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-4" class="input_radio">
										<label for="radio1-4" class="label_radio">3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-5" class="input_radio">
										<label for="radio1-5" class="label_radio">4회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">취업 상담 경험</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-1" class="input_radio" checked>
										<label for="radio2-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-2" class="input_radio">
										<label for="radio2-2" class="label_radio">1회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-3" class="input_radio">
										<label for="radio2-3" class="label_radio">2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-4" class="input_radio">
										<label for="radio2-4" class="label_radio">3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-5" class="input_radio">
										<label for="radio2-5" class="label_radio">4회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">진로 적성, 직업 흥미검사 응시 경험</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio3" id="radio3-1" class="input_radio" checked>
										<label for="radio3-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio3" id="radio3-2" class="input_radio">
										<label for="radio3-2" class="label_radio">1회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio3" id="radio3-3" class="input_radio">
										<label for="radio3-3" class="label_radio">2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio3" id="radio3-4" class="input_radio">
										<label for="radio3-4" class="label_radio">3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio3" id="radio3-5" class="input_radio">
										<label for="radio3-5" class="label_radio">4회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">채용설명회 참여 횟수</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-1" class="input_radio" checked>
										<label for="radio4-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-2" class="input_radio">
										<label for="radio4-2" class="label_radio">1회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-3" class="input_radio">
										<label for="radio4-3" class="label_radio">2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-4" class="input_radio">
										<label for="radio4-4" class="label_radio">3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio4" id="radio4-5" class="input_radio">
										<label for="radio4-5" class="label_radio">4회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text flex">
									<span class="tit">취업 관련 강의 수강경험</span>
									<span class="desc">(직무적성검사, 자기소개서, 면접, 기타)</span>
								</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio5" id="radio5-1" class="input_radio" checked>
										<label for="radio5-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio5" id="radio5-2" class="input_radio">
										<label for="radio5-2" class="label_radio">1회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio5" id="radio5-3" class="input_radio">
										<label for="radio5-3" class="label_radio">2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio5" id="radio5-4" class="input_radio">
										<label for="radio5-4" class="label_radio">3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio5" id="radio5-5" class="input_radio">
										<label for="radio5-5" class="label_radio">4회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">직무적성검사 모의테스트 응시경험</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio6" id="radio6-1" class="input_radio" checked>
										<label for="radio6-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio6" id="radio6-2" class="input_radio">
										<label for="radio6-2" class="label_radio">1회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio6" id="radio6-3" class="input_radio">
										<label for="radio6-3" class="label_radio">2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio6" id="radio6-4" class="input_radio">
										<label for="radio6-4" class="label_radio">3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio6" id="radio6-5" class="input_radio">
										<label for="radio6-5" class="label_radio">4회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">자기소개서 작성경험</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio7" id="radio7-1" class="input_radio" checked>
										<label for="radio7-1" class="label_radio">없다</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio7" id="radio7-2" class="input_radio">
										<label for="radio7-2" class="label_radio">1~3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio7" id="radio7-3" class="input_radio">
										<label for="radio7-3" class="label_radio">4~6회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio7" id="radio7-4" class="input_radio">
										<label for="radio7-4" class="label_radio">7~9회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio7" id="radio7-5" class="input_radio">
										<label for="radio7-5" class="label_radio">10회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">모의면접 참여</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio8" id="radio8-1" class="input_radio" checked>
										<label for="radio8-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio8" id="radio8-2" class="input_radio">
										<label for="radio8-2" class="label_radio">1회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio8" id="radio8-3" class="input_radio">
										<label for="radio8-3" class="label_radio">2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio8" id="radio8-4" class="input_radio">
										<label for="radio8-4" class="label_radio">3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio8" id="radio8-5" class="input_radio">
										<label for="radio8-5" class="label_radio">4회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">취업스터디</p>
								<div class="radio_wrap">
									<div class="radio_box full start">
										<input type="radio" name="radio9" id="radio9-1" class="input_radio" checked>
										<label for="radio9-1" class="label_radio">
											활동 경험이 없다.
										</label>
									</div>
									<div class="radio_box full start">
										<input type="radio" name="radio9" id="radio9-2" class="input_radio">
										<label for="radio9-2" class="label_radio">
											총 활동기간이 3개월 미만으로 지속적이지는 않았지만 필요성을<br>느끼고 있다.
										</label>
									</div>
									<div class="radio_box full start">
										<input type="radio" name="radio9" id="radio9-3" class="input_radio">
										<label for="radio9-3" class="label_radio">
											현재는 하고 있지 않지만 과거에 3개월 이상의 스터디 경험이<br>있다.
										</label>
									</div>
									<div class="radio_box full start">
										<input type="radio" name="radio9" id="radio9-4" class="input_radio">
										<label for="radio9-4" class="label_radio">
											현재 스터디 활동을 하고 있으며 과거에도 3개월 이상의 경험이<br>있다.
										</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">			
								<p class="label_text flex">
									<span class="tit">취업 프로그램 참여 경험</span>
									<span class="desc">(이미지 메이킹, 취업 캠프 등)</span>
								</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio10" id="radio10-1" class="input_radio" checked>
										<label for="radio10-1" class="label_radio">없다</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio10" id="radio10-2" class="input_radio">
										<label for="radio10-2" class="label_radio">1회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio10" id="radio10-3" class="input_radio">
										<label for="radio10-3" class="label_radio">2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio10" id="radio10-4" class="input_radio">
										<label for="radio10-4" class="label_radio">3회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio10" id="radio10-5" class="input_radio">
										<label for="radio10-5" class="label_radio">4회 이상</label>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="personality_state">
				<div class="inner">
					<div class="txtbox">
						<p class="title">
							모든 문항이 완료되었습니다. <br>
							검사 완료를 클릭해주세요.
						</p>
					</div>
				</div>
			</div>

			<div class="page_btnbox gap2 mt0 nosticky">
				<button type="button" class="button typeC big2 full">이전</button>
				<button type="button" class="button gra1 big2 full">검사완료</button>
				<button type="button" class="button typeC big2 full">다음</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
