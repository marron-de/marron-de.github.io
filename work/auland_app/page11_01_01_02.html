<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">취업준비도 검사 ABT</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox">
						<div class="progress">
							<div class="bar" style="width: 20%;"></div>
						</div>
					</div>
					<div class="question">
						<p class="q_toptxt ver2">
							다음의 질문을 읽고 각 물음에 솔직히 응답하여 주십시오. 
							<span class="small">(1/5)</span>
						</p>
						<p class="q_tit">기본 정보</p>
						<div class="form_box ver2">
							<div class="form_item input_box">
								<p class="label_text">학교</p>
								<div class="input_flex">
									<input type="text" class="input_text" placeholder="학교를 입력해주세요.">
									<button type="button" class="button typeB">학교검색</button>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">전공</p>
								<div class="input_flex">
									<input type="text" class="input_text" placeholder="전공을 입력해주세요.">
									<button type="button" class="button typeB">전공검색</button>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">학점</p>
								<div class="input_box gap2">
									<p class="label_text">만점 선택</p>
									<div class="radio_wrap">
										<div class="radio_box">
											<input type="radio" name="radio1" id="radio1-1" class="input_radio" checked>
											<label for="radio1-1" class="label_radio">
												4.0만점
											</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio1" id="radio1-2" class="input_radio">
											<label for="radio1-2" class="label_radio">
												4.3만점
											</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio1" id="radio1-3" class="input_radio">
											<label for="radio1-3" class="label_radio">
												4.5만점
											</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio1" id="radio1-4" class="input_radio">
											<label for="radio1-4" class="label_radio">
												5.0만점
											</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio1" id="radio1-5" class="input_radio">
											<label for="radio1-5" class="label_radio">
												7.0만점
											</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio1" id="radio1-6" class="input_radio">
											<label for="radio1-6" class="label_radio">100점만점</label>
										</div>
									</div>
								</div>
							</div>
							<div class="form_item input_box gap2">
								<p class="label_text">내 학점</p>
								<div class="input_flex gap2">
									<input type="text" class="input_text wid64" placeholder="0">
									<span class="input_txt">점</span>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="page_btnbox">
				<button type="button" class="button typeC big2 full alert_ver">
					<span class="txt">임시저장</span>
					<span class="alert_icon">
						<img src="img/ico_alert3.png" alt="" class="btn">
						<div class="tooltip">
							<p class="txt">
								잠시 자리를 비우거나 휴식이 필요할 <br>
								때는 임시로 저장할 수 있어요!
							</p>
						</div>
					</span>
				</button>
				<button type="button" class="button typeA big2 full">다음</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
