<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap join_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox">
					<button type="button" class="back_btn"></button>
				</div>
				<div class="h_centerbox">
					<p class="h_title">회원가입</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="profile_btn"></button>
					<button type="button" class="menu_btn menu_open"></button>
				</div>
			</div>
		</header>

		<!-- nav menu  -->
		<div class="nav_menu">
			<div class="inner menu_head">
				<div class="leftbox">
					로그인이 필요합니다.
				</div>
				<div class="rightbox">
					<button type="button" class="login_btn">로그인</button>
					<button type="button" class="close_btn menu_close"></button>
				</div>
			</div>
			<div class="menu_body">
				<ul class="accordion">
					<li>
						<a href="" class="acc_link">
							<span class="tit">검사소개</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">검사가이드</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li class="show">
						<div class="acc_link acc_tit">
							<span class="tit">검사하기</span>
							<span class="arrow"></span>
						</div>
						<ul class="acc_cont" style="display: block;">
							<li>
								<div class="listbox">
									<a href="" class="link">고학년</a>
									<a href="" class="link">저학년</a>
									<a href="" class="link">전문대</a>
								</div>
							</li>
						</ul>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">마이페이지</span>
							<span class="arrow"></span>
						</a>
					</li>
					<li>
						<a href="" class="acc_link">
							<span class="tit">이용권구매</span>
							<span class="arrow"></span>
						</a>
					</li>
				</ul>
			</div>
		</div>

		<!-- container -->
		<div class="container">
			
			<section class="section join_section step2 flexible">
				<div class="inner">
					<div class="form_box">
						<div class="form_item check_wrap">
							<div class="check_box full allcheck">
								<input type="checkbox" name="allCheck" id="allCheck" class="input_check">
								<label for="allCheck" class="label_check">
									<span class="bold">아래 내용을 모두 확인하였으며 전체 동의합니다.</span>
								</label>
							</div>
							<div class="check_box full">
								<input type="checkbox" name="agreement" id="agreement" class="input_check sub_check" checked>
								<label for="agreement" class="label_check">
									이용약관 [<a href="" class="link">전문보기</a>]
								</label>
							</div>
							<div class="check_box full">
								<input type="checkbox" name="privacy" id="privacy" class="input_check sub_check">
								<label for="privacy" class="label_check">
									개인정보 수집 및 허용 [<a href="" class="link">전문보기</a>]
								</label>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="page_btnbox">
				<button type="button" class="button typeA big full">다음</button>
			</div>
			
		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
