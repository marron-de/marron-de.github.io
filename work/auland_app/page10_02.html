<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">직무선호도 BNT3</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox">
						<div class="progress">
							<div class="bar" style="width: 50%;"></div>
						</div>
						<div class="time">09:50</div>
					</div>
					<div class="question">
						<p class="q_toptxt">
							다음의 질문을 읽고 각 물음에 솔직히 응답하여 주십시오.
						</p>
						<p class="q_sub">질문 1/95</p>
						<p class="q_tit">
							산업안전원 직무를 얼마나 선호하는지 <br>
							본인의 기준에 따라 체크해 주시기 바랍니다.
						</p>
						<div class="answer_box">
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-1" class="input_answer" checked>
								<label for="answer4-1" class="label_answer">
									<span class="txt">매우 하고 싶지 않음</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-2" class="input_answer">
								<label for="answer4-2" class="label_answer">
									<span class="txt">하고 싶지 않음</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-3" class="input_answer">
								<label for="answer4-3" class="label_answer">
									<span class="txt">관심 없음</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-4" class="input_answer">
								<label for="answer4-4" class="label_answer">
									<span class="txt">하고 싶음</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-5" class="input_answer">
								<label for="answer4-5" class="label_answer">
									<span class="txt">매우 하고 싶음</span>
									<span class="check"></span>
								</label>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="page_btnbox">
				<button type="button" class="button typeC big2 full alert_ver">
					<span class="txt">임시저장</span>
					<span class="alert_icon">
						<img src="img/ico_alert3.png" alt="" class="btn">
						<div class="tooltip">
							<p class="txt">
								잠시 자리를 비우거나 휴식이 필요할 <br>
								때는 임시로 저장할 수 있어요!
							</p>
						</div>
					</span>
				</button>
				<button type="button" class="button typeA big2 full">다음</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
