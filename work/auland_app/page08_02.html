<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">직무선호도 BNT1</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox">
						<div class="progress">
							<div class="bar" style="width: 50%;"></div>
						</div>
						<div class="time">09:50</div>
					</div>
					<div class="question">
						<p class="q_toptxt">
							다음의 직무 활동들을 얼마나 선호하십니까? <br>
							질문을 읽고 각 물음에 솔직히 응답하여 주십시오.
						</p>
						<p class="q_sub">질문 1/105</p>
						<p class="q_tit">
							집이나 선호도 건축물, 도로등을 만들고 수리하는 일
						</p>
						<div class="answer_box">
							<div class="answer_item">
								<input type="radio" name="answer2" id="answer2-1" class="input_answer" checked>
								<label for="answer2-1" class="label_answer">
									<span class="txt">매우 선호하지 않음</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer2" id="answer2-2" class="input_answer">
								<label for="answer2-2" class="label_answer">
									<span class="txt">선호하지 않음</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer2" id="answer2-3" class="input_answer">
								<label for="answer2-3" class="label_answer">
									<span class="txt">보통이다</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer2" id="answer2-4" class="input_answer">
								<label for="answer2-4" class="label_answer">
									<span class="txt">선호함</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer2" id="answer2-5" class="input_answer">
								<label for="answer2-5" class="label_answer">
									<span class="txt">매우 선호함</span>
									<span class="check"></span>
								</label>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="personality_state">
				<div class="inner">
					<div class="txtbox">
						<p class="title">
							잠시 자리를 비우거나 휴식이 필요할 때는 <br>	
							임시로 저장할 수 있어요!
						</p>
					</div>
				</div>
			</div>

			<div class="page_btnbox mt0 nosticky">
				<button type="button" class="button typeA big2 full">임시저장</button>
				<button type="button" class="button typeC big2 full">나가기</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
