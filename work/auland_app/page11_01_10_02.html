<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">취업준비도 검사 ABT</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox">
						<div class="progress">
							<div class="bar" style="width: 100%;"></div>
						</div>
					</div>
					<div class="question">
						<p class="q_toptxt">
							다음 항목을 입력해주시기 바랍니다.
							<span class="normal">(<span class="red">5</span>/5)</span>
						</p>
						<p class="q_sub">질문 1/10</p>
						<p class="q_tit">
							취업에 대한 목적의식이 분명하다.
						</p>
						<div class="answer_box">
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-1" class="input_answer" checked>
								<label for="answer4-1" class="label_answer">
									<span class="txt">전혀 그렇지 않다</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-2" class="input_answer">
								<label for="answer4-2" class="label_answer">
									<span class="txt">그렇지 않다</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-3" class="input_answer">
								<label for="answer4-3" class="label_answer">
									<span class="txt">보통이다</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-4" class="input_answer">
								<label for="answer4-4" class="label_answer">
									<span class="txt">그렇다</span>
									<span class="check"></span>
								</label>
							</div>
							<div class="answer_item">
								<input type="radio" name="answer4" id="answer4-5" class="input_answer">
								<label for="answer4-5" class="label_answer">
									<span class="txt">매우 그렇다</span>
									<span class="check"></span>
								</label>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="personality_state">
				<div class="inner">
					<div class="txtbox">
						<p class="title">
							잠시 자리를 비우거나 휴식이 필요할 때는 <br>	
							임시로 저장할 수 있어요!
						</p>
					</div>
				</div>
			</div>

			<div class="page_btnbox gap2 mt0 nosticky">
				<button type="button" class="button typeC big2 full">이전</button>
				<button type="button" class="button typeC big2 full">임시저장</button>
				<button type="button" class="button typeA big2 full">다음</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
