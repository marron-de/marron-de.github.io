<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">취업준비도 검사 ABT</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox">
						<div class="progress">
							<div class="bar" style="width: 40%;"></div>
						</div>
					</div>
					<div class="question">
						<p class="q_toptxt ver2">
							다음 항목을 입력해 주시기 바랍니다.
							<span class="small">(2/5)</span>
						</p>
						<p class="q_tit flex">
							<span class="tit">외국어 능력</span>
							<span class="desc">(가지고 있는 것만 체크)</span>
						</p>
						<div class="form_box ver2">
							<div class="form_item input_box">
								<p class="label_text">TOEIC 점수</p>
								<div class="input_flex gap2">
									<input type="text" class="input_text wid64" placeholder="0">
									<span class="input_txt">점</span>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">TOEFL 점수</p>
								<div class="input_flex gap2">
									<input type="text" class="input_text wid64" placeholder="0">
									<span class="input_txt">점</span>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">OPIC 점수</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-1" class="input_radio" checked>
										<label for="radio1-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-2" class="input_radio">
										<label for="radio1-2" class="label_radio">IM1</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-3" class="input_radio">
										<label for="radio1-3" class="label_radio">IM2</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-4" class="input_radio">
										<label for="radio1-4" class="label_radio">IM3</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-5" class="input_radio">
										<label for="radio1-5" class="label_radio">IH</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-6" class="input_radio">
										<label for="radio1-6" class="label_radio">AL</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">TOEIC SPEAKING</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-1" class="input_radio" checked>
										<label for="radio2-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-2" class="input_radio">
										<label for="radio2-2" class="label_radio">IM1</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-3" class="input_radio">
										<label for="radio2-3" class="label_radio">IM2</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-4" class="input_radio">
										<label for="radio2-4" class="label_radio">IM3</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-5" class="input_radio">
										<label for="radio2-5" class="label_radio">IH</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio2" id="radio2-6" class="input_radio">
										<label for="radio2-6" class="label_radio">AL</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">TEPS</p>
								<div class="input_flex gap2">
									<input type="text" class="input_text wid64" placeholder="0">
									<span class="input_txt">점</span>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">G-Telp Level</p>
								<div class="input_box gap2">
									<p class="label_text">레벨 선택</p>
									<div class="radio_wrap">
										<div class="radio_box">
											<input type="radio" name="radio3" id="radio3-1" class="input_radio" checked>
											<label for="radio3-1" class="label_radio">Level 1</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio3" id="radio3-2" class="input_radio">
											<label for="radio3-2" class="label_radio">Level 2</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio3" id="radio3-3" class="input_radio">
											<label for="radio3-3" class="label_radio">Level 3</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio3" id="radio3-4" class="input_radio">
											<label for="radio3-4" class="label_radio">Level 4</label>
										</div>
										<div class="radio_box">
											<input type="radio" name="radio3" id="radio3-5" class="input_radio">
											<label for="radio3-5" class="label_radio">Level 5</label>
										</div>
									</div>
								</div>
							</div>
							<div class="form_item input_box gap2">
								<p class="label_text">점수</p>
								<div class="input_flex gap2">
									<input type="text" class="input_text wid64" placeholder="0">
									<span class="input_txt">점</span>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">회화능력 수준</p>
								<div class="radio_wrap">
									<div class="radio_box full start">
										<input type="radio" name="radio4" id="radio4-1" class="input_radio" checked>
										<label for="radio4-1" class="label_radio">
											기본적인 단어의 나열 수준 (하)
										</label>
									</div>
									<div class="radio_box full start">
										<input type="radio" name="radio4" id="radio4-2" class="input_radio">
										<label for="radio4-2" class="label_radio">
											문장을 통해 기본적인 의사표현 가능 (중)
										</label>
									</div>
									<div class="radio_box full start">
										<input type="radio" name="radio4" id="radio4-3" class="input_radio">
										<label for="radio4-3" class="label_radio">
											자연스러운 의사소통 가능 (상)
										</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">영어 제외 구사 가능한 제2외국어</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio5" id="radio5-1" class="input_radio" checked>
										<label for="radio5-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio5" id="radio5-2" class="input_radio">
										<label for="radio5-2" class="label_radio">1개 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">
									영어 제외 및 제2외국어 종류 
									<span class="small">(가장 비중이 큰 것 기업)</span>
								</p>
								<div class="radio_wrap gap2">
									<div class="radio_box">
										<input type="radio" name="radio6" id="radio6-1" class="input_radio" checked>
										<label for="radio6-1" class="label_radio">중국어</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio6" id="radio6-2" class="input_radio">
										<label for="radio6-2" class="label_radio">일어</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio6" id="radio6-3" class="input_radio">
										<label for="radio6-3" class="label_radio">유럽권 국가 언어</label>
									</div>
									<div class="radio_box full">
										<input type="radio" name="radio6" id="radio6-4" class="input_radio">
										<label for="radio6-4" class="label_radio input_flex gap2">
											<span class="txt">기타</span>
											<input type="text" class="input_text" placeholder="0">
										</label>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="page_btnbox">
				<button type="button" class="button typeC big2 full alert_ver">
					<span class="txt">임시저장</span>
					<span class="alert_icon">
						<img src="img/ico_alert3.png" alt="" class="btn">
						<div class="tooltip">
							<p class="txt">
								잠시 자리를 비우거나 휴식이 필요할 <br>
								때는 임시로 저장할 수 있어요!
							</p>
						</div>
					</span>
				</button>
				<button type="button" class="button typeA big2 full">다음</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
