<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">취업준비도 검사 ABT</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox">
						<div class="progress">
							<div class="bar" style="width: 60%;"></div>
						</div>
					</div>
					<div class="question">
						<p class="q_toptxt ver2">
							다음 항목을 입력해 주시기 바랍니다.
							<span class="small">(3/5)</span>
						</p>
						<p class="q_tit">인턴 횟수</p>
						<div class="form_box ver2">
							<div class="form_item input_box">
								<p class="label_text">인턴 횟수</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-1" class="input_radio" checked>
										<label for="radio1-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-2" class="input_radio">
										<label for="radio1-2" class="label_radio">1~2개</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-3" class="input_radio">
										<label for="radio1-3" class="label_radio">3~4개</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-4" class="input_radio">
										<label for="radio1-4" class="label_radio">5개 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text flex">
									<span class="tit">인턴 내용</span>
									<span class="desc">(* 기간이나 비중이 큰 순으로 가입)</span>
								</p>
								<div class="input_flex">
									<input type="text" class="input_text" placeholder="인턴 내용을 선택해주세요.">
									<button type="button" class="button typeB">선택</button>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text flex">
									<span class="tit">인턴 내용</span>
									<span class="desc">(* 위 선택된 기업에서의 기간)</span>
								</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="check2" id="check2-1" class="input_radio" checked>
										<label for="check2-1" class="label_radio">1개월 이하</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="check2" id="check2-2" class="input_radio">
										<label for="check2-2" class="label_radio">2~3개월</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="check2" id="check2-3" class="input_radio">
										<label for="check2-3" class="label_radio">4~5개월</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="check2" id="check2-4" class="input_radio">
										<label for="check2-4" class="label_radio">6개월 이상</label>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="personality_state">
				<div class="inner">
					<div class="txtbox">
						<p class="title">
							잠시 자리를 비우거나 휴식이 필요할 때는 <br>	
							임시로 저장할 수 있어요!
						</p>
					</div>
				</div>
			</div>

			<div class="page_btnbox gap2 mt0 nosticky">
				<button type="button" class="button typeC big2 full">이전</button>
				<button type="button" class="button typeC big2 full">임시저장</button>
				<button type="button" class="button typeA big2 full">다음</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
