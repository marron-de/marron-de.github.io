<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap">

		<div class="modal show">
			<div class="modal_box">
				<div class="modal_head">
					<p class="h_title">직무선호도 BNT2</p>	
					<button type="button" class="modal_close close_btn"></button>
				</div>
				<div class="modal_body">
					<p class="modal_tit">
						직무역량 검사는 본인이 <span class="red">실제로 다음과 같은</span>
						<br>
						<span class="red">직무활동을 수행</span>하게 될 경우, 얼마나 잘 할 수 있다고 
						<br>
						생각하는지 응답하는 검사입니다.
					</p>	
					<p class="modal_desc">
						앞서 시행한 직무 선호도 검사와 동일한 문항으로 <br>
						구성되어 있습니다. 검사 문항을 자세히 읽으신 후, 앞에서 <br>
						응답한 것과는 별도로, 현재 다음과 같은 직무활동을 수행할만한 역량을 가지고 있는지를 고려하며 응답해 주시길 바랍니다.
					</p>
				</div>
				<div class="modal_btnbox">
					<button type="button" class="button typeA full">검사 시작하기</button>
				</div>
			</div>
		</div>
		
	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
