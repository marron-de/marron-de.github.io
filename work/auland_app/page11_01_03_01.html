<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap personality_wrap">

		<!-- header -->
		<header class="header">
			<div class="inner h_inner">
				<div class="h_leftbox"></div>
				<div class="h_centerbox">
					<p class="h_title">취업준비도 검사 ABT</p>
				</div>
				<div class="h_rightbox">
					<button type="button" class="close_btn"></button>
				</div>
			</div>
		</header>

		<!-- container -->
		<div class="container">
			
			<section class="section personality_section flexible">
				<div class="inner">
					<div class="progressbox">
						<div class="progress">
							<div class="bar" style="width: 60%;"></div>
						</div>
					</div>
					<div class="question">
						<p class="q_toptxt ver2">
							다음 항목을 입력해 주시기 바랍니다.
							<span class="small">(3/5)</span>
						</p>
						<p class="q_tit">연수 및 해외경험</p>
						<div class="form_box ver2">
							<div class="form_item input_box">
								<p class="label_text">경험 횟수</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-1" class="input_radio" checked>
										<label for="radio1-1" class="label_radio">없음</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-2" class="input_radio">
										<label for="radio1-2" class="label_radio">1~2회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-3" class="input_radio">
										<label for="radio1-3" class="label_radio">3~4회</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="radio1" id="radio1-4" class="input_radio">
										<label for="radio1-4" class="label_radio">5회 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">국가명</p>
								<div class="input_flex">
									<input type="text" class="input_text" placeholder="국가명을 입력하세요.">
									<button type="button" class="button typeB">국가명 검색</button>
								</div>
								<p class="input_desc nodot">(* 기간이나 비중이 큰 경험을 선택)</p>
							</div>
							<div class="form_item input_box">
								<p class="label_text flex">
									<span class="tit">기간</span>
									<span class="desc">(* 위 선택된 국가에서의 기간 / 비중이 큰 경험을 선택)</span>
								</p>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" name="check2" id="check2-1" class="input_radio" checked>
										<label for="check2-1" class="label_radio">1~2개월</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="check2" id="check2-2" class="input_radio">
										<label for="check2-2" class="label_radio">3~6개월</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="check2" id="check2-3" class="input_radio">
										<label for="check2-3" class="label_radio">7~11개월</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="check2" id="check2-4" class="input_radio">
										<label for="check2-4" class="label_radio">12개월 이상</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text flex">
									<span class="tit">목적</span>
									<span class="desc">(* 복수선택가능)</span>
								</p>
								<div class="check_wrap">
									<div class="check_box">
										<input type="checkbox" name="check1" id="check1-1" class="input_check" checked>
										<label for="check1-1" class="label_check">어학실력 향상</label>
									</div>
									<div class="check_box">
										<input type="checkbox" name="check1" id="check1-2" class="input_check">
										<label for="check1-2" class="label_check">다양한 경험</label>
									</div>
									<div class="check_box">
										<input type="checkbox" name="check1" id="check1-3" class="input_check">
										<label for="check1-3" class="label_check">여행</label>
									</div>
									<div class="check_box">
										<input type="checkbox" name="check1" id="check1-4" class="input_check">
										<label for="check1-4" class="label_check">기타</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box">
								<p class="label_text">국가명</p>
								<div class="select_box">
									<select class="select">
										<option value="">국가명을 선택하세요</option>
									</select>
								</div>
							</div>
						</div>
					</div>
				</div>
			</section>
	
			<div class="page_btnbox">
				<button type="button" class="button typeC big2 full alert_ver">
					<span class="txt">임시저장</span>
					<span class="alert_icon">
						<img src="img/ico_alert3.png" alt="" class="btn">
						<div class="tooltip">
							<p class="txt">
								잠시 자리를 비우거나 휴식이 필요할 <br>
								때는 임시로 저장할 수 있어요!
							</p>
						</div>
					</span>
				</button>
				<button type="button" class="button typeA big2 full">다음</button>
			</div>

		</div>

	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
