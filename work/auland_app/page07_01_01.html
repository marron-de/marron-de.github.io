<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>아우란트</title>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
	
	<!-- CSS -->
	<link rel="stylesheet" href="css/commons.css">
	<link rel="stylesheet" href="css/style.css">

	<!-- Font -->
	<link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="wrap">

		<div class="modal show">
			<div class="modal_box">
				<div class="modal_head">
					<p class="h_title">역량검사 KT</p>	
					<button type="button" class="modal_close close_btn"></button>
				</div>
				<div class="modal_body">
					<p class="modal_tit">
						당신의 <span class="red">보유역량 수준을 알려주기 위한 검사</span>입니다.
					</p>	
					<p class="modal_desc">
						기업에서 사람을 채용할 때 필요로 하는 9가지 역량을 <br>
						핵심역량과 중요역량으로 구분하여 측정한 결과를 제공합니다. 역량 수준별 상세 정보를 제공함으로서 본인의 역량 보유 정도 및 강, 약점을 파악할 수 있도록 도움을 드립니다.
					</p>
				</div>
				<div class="modal_btnbox">
					<button type="button" class="button typeA full">검사 시작하기</button>
				</div>
			</div>
		</div>
		
	</div>


	<!-- JS -->
	<script src="js/common.js"></script>


</body>

</html>
