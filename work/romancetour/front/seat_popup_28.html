<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로망스투어</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/front_style.css">

    <!-- Font -->
    <link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


    <div class="wrap">

        <!-- 임시 header -->
        <header class="temp_header">
            <img src="img/header_pc.jpg" alt="" class="img pc">
            <img src="img/header_m.png" alt="" class="img tablet">
        </header>

        <!-- container -->
        <div class="container">
            <section class="section">			
				<div class="temp_imgbox">
					<img src="img/temp_img1_pc.jpg" alt="" class="temp_img pc">
					<img src="img/temp_img1_m.jpg" alt="" class="temp_img tablet">
				</div>
				<div class="inner">
					<div class="seat_box">
						<div class="left">
							<p class="tit">인원</p>
							<p class="desc">최소 20명(정원 30명)</p>
						</div>
						<div class="right">
							<button type="button" class="seat_btn typeA seatPopup_show">좌석보기</button>
							<button type="button" class="seat_btn typeB">예약하기</button>
						</div>
					</div>
				</div>
				<div class="temp_imgbox">
					<img src="img/temp_img2_pc.jpg" alt="" class="temp_img pc">
					<img src="img/temp_img2_m.jpg" alt="" class="temp_img pc tablet">
				</div>
            </section>		
        </div>

		<!-- busSeat modal -->
		<div class="busSeat_modal show">
			<div class="modal_box">
				<div class="modal_head">
					<p class="modal_tit">좌석보기</p>
					<button type="button" class="modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="alert_txt">
						<span class="icon"></span>
						<p class="txt">
							예매 시 구매하신 사전 좌석은 아래 좌석 배치도에 
							자동으로 표시되어 확인하실 수 있어요
						</p>
					</div>
					<div class="seat_area">
						<div class="seat_picbox">
							<p class="seat_tit">28인승 버스</p>
							<div class="seat_pic">
								<div class="top_row">
									<div class="driver"></div>
									<div class="exit"></div>
								</div>
								<div class="top_txt">
									<span class="txt">창측</span>
									<span class="txt">통로측</span>
									<span class="txt"></span>
									<span class="txt">창측</span>
								</div>
								<div class="row">
									<div class="item seat disabled">
										<span class="num">1</span>
									</div>
									<div class="item seat disabled">
										<span class="num">2</span>
									</div>
									<div class="item arrow"></div>
									<div class="item seat guide">
										<span class="num">3</span>
									</div>
								</div>
								<div class="row">
									<div class="item seat">
										<span class="num">4</span>
									</div>
									<div class="item seat">
										<span class="num">5</span>
									</div>
									<div class="item arrow"></div>
									<div class="item seat">
										<span class="num">6</span>
									</div>
								</div>
								<div class="row">
									<div class="item seat">
										<span class="num">7</span>
									</div>
									<div class="item seat">
										<span class="num">8</span>
									</div>
									<div class="item arrow"></div>
									<div class="item seat">
										<span class="num">9</span>
									</div>
								</div>
								<div class="row">
									<div class="item seat">
										<span class="num">10</span>
									</div>
									<div class="item seat">
										<span class="num">11</span>
									</div>
									<div class="item arrow"></div>
									<div class="item seat selected">
										<span class="num">12</span>
									</div>
								</div>
								<div class="row">
									<div class="item seat">
										<span class="num">13</span>
									</div>
									<div class="item seat">
										<span class="num">14</span>
									</div>
									<div class="item arrow"></div>
									<div class="item seat">
										<span class="num">15</span>
									</div>
								</div>
								<div class="row">
									<div class="item seat">
										<span class="num">16</span>
									</div>
									<div class="item seat">
										<span class="num">17</span>
									</div>
									<div class="item arrow"></div>
									<div class="item seat">
										<span class="num">18</span>
									</div>
								</div>
								<div class="row">
									<div class="item seat">
										<span class="num">19</span>
									</div>
									<div class="item seat">
										<span class="num">20</span>
									</div>
									<div class="item arrow"></div>
									<div class="item seat">
										<span class="num">21</span>
									</div>
								</div>
								<div class="row">
									<div class="item seat">
										<span class="num">22</span>
									</div>
									<div class="item seat">
										<span class="num">23</span>
									</div>
									<div class="item arrow"></div>
									<div class="item seat">
										<span class="num">24</span>
									</div>
								</div>
								<div class="row">
									<div class="item seat">
										<span class="num">25</span>
									</div>
									<div class="item seat">
										<span class="num">26</span>
									</div>
									<div class="item seat">
										<span class="num">27</span>
									</div>
									<div class="item seat">
										<span class="num">28</span>
									</div>
								</div>
							</div>
						</div>
						<div class="seat_label">
							<div class="item">
								<span class="color color1"></span>
								<span class="txt">선택 가능</span>
							</div>
							<div class="item">
								<span class="color color2"></span>
								<span class="txt">좌석 마감</span>
							</div>
							<div class="item">
								<span class="color color3"></span>
								<span class="txt">내 좌석</span>
							</div>
							<div class="item">
								<span class="color color4"></span>
								<span class="txt">가이드석</span>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

        <!-- 임시 footer -->
        <footer class="temp_footer">
            <img src="img/footer_pc.jpg" alt="" class="img pc">
            <img src="img/footer_m.jpg" alt="" class="img tablet">
        </footer>

    </div>



    <!-- JS -->
    <script src="js/script.js"></script>



</body>

</html>
