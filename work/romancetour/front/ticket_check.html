<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로망스투어</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/front_style.css">

    <!-- Font -->
    <link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


    <div class="wrap">

        <!-- 임시 header -->
        <header class="temp_header">
            <img src="img/header_pc.jpg" alt="" class="img pc">
            <img src="img/header_m.png" alt="" class="img tablet">
        </header>

		<!-- 모바일 상단 영역 -->
		<div class="sub_headbox">
			<button type="button" class="back_btn">
				<img src="img/ic_back.png" alt="" class="img">
			</button>
			<p class="title">버스 탑승권 확인</p>
		</div>

        <!-- container -->
        <div class="container">
			<div class="temp_subimg"></div>
            <section class="section seat_section">	
				<div class="inner">
					<div class="ticket_cont">
						<div class="ticket_tit">탑승권 확인</div>
						<div class="ticket_areawrap">
							<div class="ticket_area">
								<div class="contbox">
									<div class="topbox">
										<div class="left">
											<p class="tit">홍길동</p>
											<p class="desc">예약번호 : 202506191455235147</p>
										</div>
										<div class="right">
											<button type="button" class="seat_label">
												<span class="icon"></span>
												<span class="txt">좌석 16번</span>
											</button>
										</div>
									</div>
									<div class="infobox">
										<div class="item">
											<div class="tit">운행 경로</div>
											<div class="desc">
												<span class="txt">서울</span>
												<span class="arrow"></span>
												<span class="txt">청도</span>
											</div>
										</div>
										<div class="line"></div>
										<div class="item">
											<div class="tit">탑승일</div>
											<div class="desc">2025년 06월 24일(월)</div>
										</div>
										<div class="line"></div>
										<div class="item">
											<div class="tit">탑승시간</div>
											<div class="desc">오후 12:00 ~ 오후 02:10</div>
										</div>
										<div class="line"></div>
										<div class="item">
											<div class="tit">탑승지</div>
											<div class="desc">서울시청역 3번 출구</div>
										</div>
									</div>
									<p class="note_txt">출발 10분 전까지  탑승지에 도착해 주세요.</p>
								</div>
								<div class="linebox">
									<div class="deco deco1"></div>
									<div class="line"></div>
									<div class="deco deco2"></div>
								</div>
								<div class="qrbox">
									<img src="img/img_qr.png" alt="" class="qr_img">
								</div>
							</div>
						</div>
					</div>
					
					<div class="seat_btnbox">
						<button type="button" class="seat_btn typeA">목록</button>
					</div>
				</div>
            </section>		
        </div>

        <!-- 임시 footer -->
        <footer class="temp_footer">
            <img src="img/footer_pc.jpg" alt="" class="img pc">
            <img src="img/footer_m.jpg" alt="" class="img tablet">
        </footer>

        <!-- 임시 navigation -->
        <div class="temp_navigation">
            <img src="img/navigation_m.png" alt="" class="img">
        </div>

    </div>



    <!-- JS -->
    <script src="js/script.js"></script>



</body>

</html>
