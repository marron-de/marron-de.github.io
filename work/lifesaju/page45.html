<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

	<!-- AOS -->
	<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
	<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body class="no_top_banner">

	<div class="web_wrap">

		<div class="web_left consult100_wrap">

			<!-- container -->
			<div class="container">
				<div class="intro_section">
					<div class="inner">
						<div class="txtbox">
							<span class="badge">100원 이벤트</span>
							<p class="tit">
								전화사주 <br>
								<span id="count" data-time="1500">10000</span>원에 상담하기 
							</p>
							<p class="sub">서브텍스트</p>
						</div>
						<div class="imgbox">
							<img src="img/consult100_introimg.png" alt="" class="img">
						</div>
						<div class="fixbtnbox">
							<button type="button" class="pri_btn vibration" onclick="instaKakaoModal()">시작하기</button>
							<button type="button" class="sub_btn">친구에게 공유하기</button>
						</div>
					</div>
				</div>
			</div>

			<div class="kakao_modal modal ver3 instaKakao_modal">			
				<div class="modal_box">
					<div class="modal_body">	
						<div class="titbox">
							<p class="tit">이 카드의 메시지, 바로 확인할까요?</p>
							<p class="desc">카카오로 로그인으로 바로 확인할 수 있어요!</p>
						</div>
						<button type="button" class="kakao_btn">
							<span class="icon"></span>
							<span class="txt">카카오 로그인 후 해석보기</span>
						</button>
					</div>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>



    <!-- countUp -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.6.2/countUp.umd.js"></script>

	<!-- confetti -->
	<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

	<!-- JS -->
	<script src="js/common.js"></script>



</body>

</html>
