<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>


    <div class="wrap">

		<!-- review write modal -->
        <div class="reviewWrite_modal modal ver2 show">			
			<div class="modal_box">
				<button type="button" class="modal_close"></button>
				<div class="titlebox">
					<p class="tit">상담은 어떠셨나요?</p>	
				</div>			
				<div class="contbox">
					<div class="topbox">
						<div class="thum">
							<img src="img/call_profile.png" alt="" class="img">
						</div>
						<p class="name">재윤</p>
						<p class="info">
							<span class="txt">전화상담</span>
							<span class="bar"></span>
							<span class="txt">24.07.02</span>
							<span class="bar"></span>
							<span class="txt">상담시간 10분~30분</span>
						</p>
						<div class="ratebox">
							<div class="rating">
								<input type="radio" id="star1-5" name="rating1" value="5" class="input_star">
								<label for="star1-5" class="label_star"></label>
								<input type="radio" id="star1-4" name="rating1" value="4" class="input_star" checked="">
								<label for="star1-4" class="label_star"></label>
								<input type="radio" id="star1-3" name="rating1" value="3" class="input_star">
								<label for="star1-3" class="label_star"></label>
								<input type="radio" id="star1-2" name="rating1" value="2" class="input_star">
								<label for="star1-2" class="label_star"></label>
								<input type="radio" id="star1-1" name="rating1" value="1" class="input_star">
								<label for="star1-1" class="label_star"></label>
							</div>
							<p class="rate_txt">
								4점(좋았어요)
							</p>
						</div>
					</div>
					<div class="stylebox">
						<p class="tit">추천한 상담 스타일</p>
						<div class="badgebox">
							<div class="emoji_badge emoji1 on">
								<span class="icon"></span>
								<span class="txt">소름돋아요</span>
							</div>
							<div class="emoji_badge emoji2 on">
								<span class="icon"></span>
								<span class="txt">현실적이에요</span>
							</div>
							<div class="emoji_badge emoji5">
								<span class="icon"></span>
								<span class="txt">용해요</span>
							</div>
							<div class="emoji_badge emoji3">
								<span class="icon"></span>
								<span class="txt">친절해요</span>
							</div>
							<div class="emoji_badge emoji4">
								<span class="icon"></span>
								<span class="txt">편안해요</span>
							</div>
						</div>
					</div>
					<div class="textbox">
						<div class="check_box">
							<input type="checkbox" class="input_check" id="onlyCeo">
							<label for="onlyCeo" class="label_check">사장님에게만 보이게</label>
						</div>
						<div class="input_box">
							<textarea class="input_text" placeholder="후기를 작성해주세요."></textarea>
						</div>
					</div>
				</div>
				<div class="modal_btnbox">
					<button type="button" class="btn">작성 완료</button>
				</div>
			</div>
		</div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
