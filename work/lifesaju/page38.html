<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>인생사주</title>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- chart.js -->
	<script src="js/chart.js"></script>
	<script src="js/chartjs-plugin-datalabels.js"></script>

	<!-- phosphor-icons -->
	<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/mob.css">

	<!-- Font -->
	<link rel="stylesheet" href="font/Pretendard/Pretendard.css">
	<link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>

	<div class="web_wrap">

		<div class="web_left login_wrap2">

			<!-- container -->
			<div class="container">
				<div class="login_section">
					<div class="swiper loginbg_slider">
						<div class="swiper-wrapper">
							<div class="swiper-slide item">
								<img src="img/login_slide_img1.png" alt="" class="img">
							</div>
							<div class="swiper-slide item">
								<img src="img/login_slide_img2.png" alt="" class="img">
							</div>
							<div class="swiper-slide item">
								<img src="img/login_slide_img3.png" alt="" class="img">
							</div>
						</div>
						<div class="swiper-pagination pagination"></div>
					</div>
					<div class="inner contbox">
						<div class="history_login">
							<img src="img/login_apple_small.png" alt="" class="icon">
							<span class="txt">애플로 로그인 한 적 있어요</span>
						</div>
						<div class="login_btns">
							<button type="button" class="login_btn type_kakao">
								<img src="img/login_kakao.png" alt="" class="icon">
								<span class="txt">카카오로 로그인</span>
							</button>
							<button type="button" class="login_btn type_apple">
								<img src="img/login_apple.png" alt="" class="icon">
								<span class="txt">Apple로 로그인</span>
							</button>
							<button type="button" class="login_btn type_id" onclick="idLoginModal()">
								<span class="txt">아이디로 로그인</span>
							</button>
						</div>
					</div>
				</div>
			</div>

			<!-- 아이디 로그인 팝업 -->
			<div class="idLogin_modal modal ver3 show">			
				<div class="modal_box">
					<div class="modal_body">	
						<div class="bar"></div>
						<div class="formbox">
							<div class="inputbox">
								<input type="text" class="input" placeholder="아이디">
							</div>
							<div class="inputbox">
								<input type="text" class="input" placeholder="비밀번호">
							</div>
							<div class="btnbox">
								<button type="button" class="btn typeA">로그인</button>
								<button type="button" class="btn typeB">로그인 문의</button>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>



	<!-- countUp -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.6.2/countUp.umd.js"></script>

	<!-- JS -->
	<script src="js/common.js"></script>




</body>

</html>
