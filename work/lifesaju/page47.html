<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

	<!-- AOS -->
	<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
	<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body class="no_top_banner">

	<div class="web_wrap">

		<div class="web_left consult100_wrap">

			<!-- container -->
			<div class="container">
				<div class="list_section">
					<div class="inner">
						<div class="fixheadbox">
							<div class="top">
								<button type="button" class="back_btn"></button>
							</div>
							<div class="bottom">
								<p class="title">
									<span class="color">100원</span>에 상담 받고 싶은 <br>
									선생님을 골라주세요
								</p>
							</div>
						</div>
						<div class="contbox">
							<div class="item">
								<div class="imgbox">
									<img src="img/consult_list_thum1.png" alt="" class="img">
									<input type="checkbox" class="check" checked>
								</div>
								<div class="txtbox">
									<p class="title">
										<span class="badge typeA">타로</span>
										<span class="txt">도화</span>
									</p>
									<p class="price">
										<span class="ori">10,000원</span>
										<span class="arrow"></span>
										<span class="sale">100원 </span>
									</p>
									<p class="desc">
										오프라인 타로샵에서  <br>
										어렵게 모셔온 선생님
									</p>
								</div>
							</div>
							<div class="item">
								<div class="imgbox">
									<img src="img/consult_list_thum2.png" alt="" class="img">
									<input type="checkbox" class="check">
								</div>
								<div class="txtbox">
									<p class="title">
										<span class="badge typeB">점사</span>
										<span class="txt">보라</span>
									</p>
									<p class="price">
										<span class="ori">10,000원</span>
										<span class="arrow"></span>
										<span class="sale">100원 </span>
									</p>
									<p class="desc">
										12년 경력의 화경점사로 <br>
										꿰뚫는 영적 안내자
									</p>
								</div>
							</div>
							<div class="item">
								<div class="imgbox">
									<img src="img/consult_list_thum3.png" alt="" class="img">
									<input type="checkbox" class="check">
								</div>
								<div class="txtbox">
									<p class="title">
										<span class="badge typeA">타로</span>
										<span class="txt">도은</span>
									</p>
									<p class="price">
										<span class="ori">10,000원</span>
										<span class="arrow"></span>
										<span class="sale">100원 </span>
									</p>
									<p class="desc">
										영으로 읽어내는 소름돋는  <br>
										영타로
									</p>
								</div>
							</div>
							<div class="item">
								<div class="imgbox">
									<img src="img/consult_list_thum4.png" alt="" class="img">
									<input type="checkbox" class="check">
								</div>
								<div class="txtbox">
									<p class="title">
										<span class="badge typeC">사주</span>
										<span class="txt">초연</span>
									</p>
									<p class="price">
										<span class="ori">10,000원</span>
										<span class="arrow"></span>
										<span class="sale">100원 </span>
									</p>
									<p class="desc">
										인생이 흔들릴 때 <br>
										따뜻하고 명쾌한 해석
									</p>
								</div>
							</div>
						</div>
						<div class="fixbtnbox">
							<button type="button" class="pri_btn vibration">
								<span class="countup" data-start="10000" data-end="100" data-time="1500" data-delay="0">0</span>원
								상담 받으러 가기
							</button>
						</div>
					</div>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>



    <!-- countUp -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.6.2/countUp.umd.js"></script>

	<!-- JS -->
	<script src="js/common.js"></script>



</body>

</html>
