<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body class="no_top_banner"> 

	<div class="web_wrap">

		<div class="web_left">

			<!-- header -->
			<!-- 비회원일 경우 nonmember_ver 클래스 추가 -->
			<header class="header">
				<div class="inner h_inner">
					<div class="h_logo">
						<a href="">
							<img src="img/logo.png" alt="" />
						</a>
					</div>
					<div class="h_selbox">
						<select class="h_select">
							<option value="">고민을 선택해보세요</option>
							<option value="고민1">고민1</option>
							<option value="고민2">고민2</option>
							<option value="고민3">고민3</option>
						</select>
					</div>
					<div class="h_schbox">
						<input type="text" class="input_sch" placeholder="선생님, 상담주제, 고민, 지역, 상품 등 ">
						<button class="sch_btn"></button>
					</div>
					<div class="h_side">
						<button class="side_btn coin_btn">
							<img src="img/h_coin.png" alt="" class="icon">
							<span class="txt">코인충전</span>
						</button>
						<div class="bar"></div>
						<button class="side_btn cart_btn">
							<img src="img/h_cart.png" alt="" class="icon">
							<span class="txt">장바구니</span>
						</button>
						<div class="bar"></div>
						<button class="side_btn login_btn">
							<span class="txt">마이페이지</span>
						</button>
					</div>
					<div class="h_side2">
						<button class="side_btn2 login_btn">로그인</button>
						<button class="side_btn2 free_btn">무료로 시작하기</button>
					</div>
				</div>
			</header>

			<!-- container -->
			<div class="container">
				<div class="inner">
				</div>
			</div>

			<!-- navigaion -->
			<div class="navigaion">
				<ul class="nav">
					<li class="home">
						<a href="" class="link">
							<img src="img/nav_home.png" alt="" class="icon">
							<span class="txt">홈</span>
						</a>
					</li>
					<li class="sbookmark">
						<a href="" class="link">
							<img src="img/nav_bookmark.png" alt="" class="icon">
							<span class="txt">단골</span>
						</a>
					</li>
					<li class="popular">
						<a href="" class="link">
							<img src="img/nav_popular.png" alt="" class="icon">
							<span class="txt">인기</span>
						</a>
					</li>
					<li class="mymenu">
						<a href="" class="link">
							<img src="img/nav_mymenu.png" alt="" class="icon">
							<span class="txt">마이메뉴</span>
						</a>
					</li>
					<li class="coin">
						<a href="" class="link">
							<img src="img/nav_coin.png" alt="" class="icon">
							<span class="txt">코인충전</span>
						</a>
					</li>
				</ul>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="icon"></span>
						<span class="txt">지금 설치하기</span>
					</a>
				</div>
			</div>
			<div class="bottombox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
		</div>

	</div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
