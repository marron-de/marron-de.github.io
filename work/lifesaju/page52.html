<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

	<!-- AOS -->
	<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
	<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body class="no_top_banner">

	<div class="web_wrap">

		<div class="web_left saju_wrap">

			<!-- container -->
			<div class="container">
				<div class="info_section">
					<div class="headbox inner">
						<div class="leftbox">
							<button type="button" class="back_btn"></button>
						</div>
						<p class="title">사주정보 입력</p>
						<div class="rightbox"></div>
					</div>
					<div class="contbox">
						<div class="form_box">
							<div class="form_item input_box">
								<label class="label_text">이름</label>
								<input class="input_text" placeholder="한글 최대 6글자" required></input>
							</div>
							<div class="form_item input_box">
								<label for="" class="label_text">성별</label>
								<div class="radio_wrap">
									<div class="radio_box">
										<input type="radio" class="input_radio" id="gender_man" name="gender">
										<label for="gender_man" class="label_radio">남자</label>
									</div>
									<div class="radio_box">
										<input type="radio" class="input_radio" id="gender_woman" name="gender">
										<label for="gender_woman" class="label_radio">여자</label>
									</div>
								</div>
							</div>
							<div class="form_item input_box opt_ver">
								<label for="" class="label_text">생년월일</label>
								<input class="input_text" placeholder="생년월일 8자리" required></input>
								<div class="optbox">
									<div class="radio_wrap">
										<div class="radio_box">
											<input type="radio" class="input_radio" id="birth_opt1" name="birth_opt">
											<label for="birth_opt1" class="label_radio">평달</label>
										</div>
										<div class="radio_box">
											<input type="radio" class="input_radio" id="birth_opt2" name="birth_opt">
											<label for="birth_opt2" class="label_radio">윤달</label>
										</div>
									</div>
								</div>
							</div>
							<div class="form_item input_box opt_ver">
								<label for="" class="label_text">태어난 시간</label>
								<input class="input_text" placeholder="00:00" required></input>
								<div class="optbox">
									<div class="radio_wrap">
										<div class="radio_box">
											<input type="radio" class="input_radio" id="time_opt1" name="time_opt">
											<label for="time_opt1" class="label_radio">시간 모름</label>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="btnbox">
						<button type="button" class="btn register_btn" disabled>등록하기</button>
					</div>
				</div>
			</div>

			<div class="modal ver3 sajuinfo_modal show">			
				<div class="modal_box">
					<div class="modal_body">	
						<div class="titbox">
							<p class="tit">당신의 사주가 맞으신가요?</p>
						</div>
						<div class="infobox">
							<div class="topbox">
								<p class="name">홍길동</p>
								<p class="info">양력 | 2000-01-01 | 00:00 | 남성</p>
							</div>
							<div class="sajucont">
								<div class="textbox textbox1">
									<div class="item">시주</div>
									<div class="bar"></div>
									<div class="item">일주</div>
									<div class="bar"></div>
									<div class="item">월주</div>
									<div class="bar"></div>
									<div class="item">년주</div>
								</div>
								<div class="iconbox">
									<div class="item">
										<img src="img/saju_word1.png" alt="" class="icon">
										<p class="txt">비견</p>
									</div>
									<div class="item">
										<img src="img/saju_word1.png" alt="" class="icon">
										<p class="txt">일원</p>
									</div>
									<div class="item">
										<img src="img/saju_word2.png" alt="" class="icon">
										<p class="txt">정관</p>
									</div>
									<div class="item">
										<img src="img/saju_word3.png" alt="" class="icon">
										<p class="txt">겁재</p>
									</div>
									<div class="item">
										<img src="img/saju_word4.png" alt="" class="icon">
										<p class="txt">정인</p>
									</div>
									<div class="item">
										<img src="img/saju_word5.png" alt="" class="icon">
										<p class="txt">비견</p>
									</div>
									<div class="item">
										<img src="img/saju_word6.png" alt="" class="icon">
										<p class="txt">식신</p>
									</div>
									<div class="item">
										<img src="img/saju_word7.png" alt="" class="icon">
										<p class="txt">편인</p>
									</div>
								</div>
							</div>
						</div>
						<div class="bottom_btnbox">
							<button type="button" class="pri_btn">네, 맞아요</button>
						</div>
					</div>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>



    <!-- countUp -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.6.2/countUp.umd.js"></script>

	<!-- JS -->
	<script src="js/common.js"></script>



</body>

</html>
