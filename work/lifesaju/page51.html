<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

	<!-- AOS -->
	<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
	<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body class="no_top_banner">

	<div class="web_wrap">

		<div class="web_left saju_wrap">

			<!-- container -->
			<div class="container">
				<div class="intro_section" data-aos="fade" data-aos-duration="1500" data-aos-delay="200">
					<div class="inner">
						<div class="titbox">
							<div class="typingbox typingbox1" data-aos="fade" data-aos-duration="100">
								<div class="cursor transparent"></div>
								<p class="text">연애를 힘들게 만드는</p>
								<div class="cursor"></div>
							</div>
							<div class="typingbox typingbox2" data-aos="fade" data-aos-duration="100" data-aos-delay="1800">
								<div class="cursor transparent"></div>
								<p class="text">나의 나쁜 습관</p>
								<div class="cursor"></div>
							</div>
						</div>
						<div class="imgbox">
							<img src="img/saju_pic.jpg" alt="" class="img">
						</div>
						<div class="anibox marquee" data-duration="2">
							<div class="marquee_group">
								<div class="item">
									<img src="img/saju_icon1.png" alt="" class="icon">
								</div>
								<div class="item">
									<img src="img/saju_icon2.png" alt="" class="icon">
								</div>
								<div class="item">
									<img src="img/saju_icon3.png" alt="" class="icon">
								</div>
								<div class="item">
									<img src="img/saju_icon4.png" alt="" class="icon">
								</div>
								<div class="item">
									<img src="img/saju_icon5.png" alt="" class="icon">
								</div>
								<div class="item">
									<img src="img/saju_icon6.png" alt="" class="icon">
								</div>
								<div class="item">
									<img src="img/saju_icon7.png" alt="" class="icon">
								</div>
								<div class="item">
									<img src="img/saju_icon8.png" alt="" class="icon">
								</div>
							</div>
						</div>						
						<div class="btnbox bottom_btnbox">
							<div class="people_badge">
								<div class="txt" data-aos="fade-up" data-aos-duration="800" data-aos-delay="2000" data-aos-anchor=".intro_section">
									<span class="bold">100,000명</span>이 해석을 확인했어요.
								</div>
							</div>
							<div class="btnbox">
								<button type="button" class="pri_btn">사주 확인하기</button>
							</div>
						</div>
					</div>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>



    <!-- countUp -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.6.2/countUp.umd.js"></script>

	<!-- JS -->
	<script src="js/common.js"></script>



</body>

</html>
