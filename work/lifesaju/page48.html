<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

	<!-- AOS -->
	<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
	<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body class="no_top_banner">

	<div class="web_wrap">

		<div class="web_left consult100_wrap">

			<!-- container -->
			<div class="container">
				<div class="detail_section">
					<div class="inner">
						<div class="fixheadbox">
							<div class="top">
								<button type="button" class="back_btn"></button>
							</div>
						</div>
						<div class="contbox">
							<div class="imgbox">
								<img src="img/consult_list_pic.png" alt="" class="img">
								<span class="count">100개 남음</span>
							</div>
							<div class="txtbox">
								<div class="titbox">
									<p class="title">
										<span class="badge typeA">타로</span>
										<span class="txt">도화</span>
									</p>
									<div class="cate">
										<span class="badge">애정</span>
										<span class="badge">재회</span>
									</div>
								</div>
								<div class="pricebox">
									<div class="top">
										<p class="txt">
											6분 상담 시 
											<span class="line">10,000원</span>
										</p>
										<p class="sale">-9,900원</p>
									</div>
									<p class="price">
										<span class="countup" data-start="10000" data-end="100" data-time="3000" data-delay="0">0</span>원
									</p>
								</div>
								<div class="share_banner">
									<p class="txt">친구에게 공유하면 바로 100원에 상담할 수 있어요</p>
								</div>
							</div>
						</div>
						<div class="fixbtnbox">
							<div class="swiper people_slider">
								<div class="swiper-wrapper">
									<div class="swiper-slide">
										홍*동님 
										<span class="bold">100원 구매 성공!</span> 
										(1분 전)
									</div>
									<div class="swiper-slide">
										김*준님  
										<span class="bold">100원 구매 성공!</span> 
										(3분 전)
									</div>
									<div class="swiper-slide">
										홍*영님  
										<span class="bold">100원 구매 성공!</span> 
										(5분 전)
									</div>
								</div>
							</div>
							<button type="button" class="pri_btn vibration">공유하고 100원 깎기 </button>
							<button type="button" class="sub_btn">혜택 포기하기</button>
						</div>
					</div>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>



    <!-- countUp -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.6.2/countUp.umd.js"></script>

	<!-- JS -->
	<script src="js/common.js"></script>



</body>

</html>
