<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>

	<div class="web_wrap">

		<div class="web_left">

			<!-- join guide modal -->
			<div class="joinGuide_modal step4">
				<div class="headbox">
					<div class="top">
						<button type="button" class="back_btn"></button>
						<button type="button" class="nextTime_btn">다음에하기</button>
					</div>
					<div class="progress">
						<div class="bar"></div>
					</div>
				</div>
				<div class="bodybox">
					<div class="txtbox">
						<p class="tit">
							카드만 등록하면 <br>
							가입이 완료돼요!
						</p>
						<div class="descbox">
							<p class="desc">
								등록 후 바로 무료 상담을 <br>
								시작하실 수 있어요.
							</p>
							<p class="desc">
								지금 결제되진 않으니 걱정 마세요. <br>
								필요 없으시면 언제든지 해지도 가능해요.
							</p>
						</div>
					</div>
				</div>
				<div class="btnbox">
					<button type="button" class="btn next_btn">신용/체크카드</button>
					<button type="button" class="kakao_btn">
						<img src="img/ico_kakaopay.png" alt="" class="icon">
					</button>
				</div>
			</div>

			<div class="cardRegister_modal modal ver3 show">			
				<div class="modal_box">
					<div class="gift_box">
						<img src="img/ic_gift.png" alt="" class="icon">
						<p class="txt">
							카드 등록하면, <span class="bold">7분 무료 통화</span>
						</p>
					</div>
					<div class="modal_body">		
						<p class="title">
							신용정보 시작을 위해 <br>						
							아래 내용에 동의가 필요해요.
						</p>
						<div class="checkwrap">
							<div class="check_box">
								<input type="checkbox" class="input_check" name="cardRegister" id="cardRegister1">
								<label for="cardRegister1" class="label_check">
									<span class="txt">브랜드페이 서비스 이용약관</span>
									<a href="" class="link"></a>
								</label>
							</div>
							<div class="check_box">
								<input type="checkbox" class="input_check" name="cardRegister" id="cardRegister2">
								<label for="cardRegister2" class="label_check">
									<span class="txt">전자금융거래 기본약관</span>
									<a href="" class="link"></a>
								</label>
							</div>
							<div class="check_box">
								<input type="checkbox" class="input_check" name="cardRegister" id="cardRegister3">
								<label for="cardRegister3" class="label_check">
									<span class="txt">개인정보 수집 및 이용 동의</span>
									<a href="" class="link"></a>
								</label>
							</div>
							<div class="check_box">
								<input type="checkbox" class="input_check" name="cardRegister" id="cardRegister4">
								<label for="cardRegister4" class="label_check">
									<span class="txt">개인정보 제3자 제공 동의</span>
									<a href="" class="link"></a>
								</label>
							</div>
							<div class="check_box">
								<input type="checkbox" class="input_check" name="cardRegister" id="cardRegister5">
								<label for="cardRegister5" class="label_check">
									<span class="txt">자동승인 이용약관</span>
									<a href="" class="link"></a>
								</label>
							</div>				
						</div>
					</div>
					<div class="modal_btnbox">
						<button type="button" class="btn">모두 동의</button>
					</div>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
