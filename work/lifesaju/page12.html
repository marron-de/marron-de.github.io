<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>

	<div class="web_wrap">

		<div class="web_left">

			<!-- join guide modal-->
			<div class="joinGuide_modal step2">
				<div class="headbox">
					<div class="top">
						<button type="button" class="back_btn"></button>
					</div>
					<div class="progress">
						<div class="bar"></div>
					</div>
				</div>
				<div class="bodybox">
					<div class="txtbox">
						<p class="tit">
							가입만 해도, <br>7분 무료 통화 기회!
						</p>
						<div class="descbox">
							<p class="desc">
								지금 가장 궁금한 고민을 <br>
								원하는 선생님과 바로 상담해보세요.
							</p>
							<p class="desc">
								결제 없이, 무료 포인트로 <br>
								먼저 체험할 수 있어요.
							</p>
						</div>
					</div>
					<div class="imgbox">
						<img src="img/joinGuide_img2.png" alt="" class="img2">
					</div>
				</div>
				<div class="btnbox">
					<button type="button" class="btn next_btn">다음</button>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
