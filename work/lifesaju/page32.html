<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>인생사주</title>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- jquery -->
	<script src="js/jquery-3.6.0.min.js"></script>

	<!-- chart.js -->
	<script src="js/chart.js"></script>
	<script src="js/chartjs-plugin-datalabels.js"></script>

	<!-- phosphor-icons -->
	<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="css/common.css">
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/mob.css">

	<!-- Font -->
	<link rel="stylesheet" href="font/Pretendard/Pretendard.css">
	<link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>

	<div class="web_wrap">

		<div class="web_left character_wrap">

			<!-- container -->
			<div class="container">
				<div class="character_section intro_section">
					<div class="inner contbox">
						<img src="img/logo3.png" alt="" class="logo">
						<p class="title">
							포인트 받고,<br>
							소망초 키우기
						</p>
						<img src="img/fire_character.png" alt="" class="character">
						<p class="msg">
							지금 시작하면, <br>
							총 <span class="color"><span class="countup" data-target="5600" data-time="1000" data-delay="0">0</span>P</span>를 받을 수 있어요
						</p>
						<button type="button" class="start_btn">시작하기</button>
					</div>
				</div>
			</div>

			<!-- navigaion -->
			<div class="navigaion">
				<ul class="nav">
					<li class="home">
						<a href="" class="link">
							<div class="icon">
								<img src="img/nav_home_off.png" alt="" class="off">
								<img src="img/nav_home_on.png" alt="" class="on">
							</div>
							<span class="txt">홈</span>
						</a>
					</li>
					<li class="content">
						<a href="" class="link">
							<div class="icon">
								<img src="img/nav_content_off.png" alt="" class="off">
								<img src="img/nav_content_on.png" alt="" class="on">
							</div>
							<span class="txt">콘텐츠</span>
						</a>
					</li>
					<li class="fortune active">
						<a href="" class="link">
							<div class="icon">
								<img src="img/nav_fortune_off.png" alt="" class="off">
								<img src="img/nav_fortune_on.png" alt="" class="on">
							</div>
							<span class="txt">오늘의 운세</span>
						</a>
					</li>
					<li class="popular">
						<a href="" class="link">
							<div class="icon">
								<img src="img/nav_popular_off.png" alt="" class="off">
								<img src="img/nav_popular_on.png" alt="" class="on">
							</div>
							<span class="txt">단골</span>
						</a>
					</li>
					<li class="mymenu">
						<a href="" class="link">
							<div class="icon">
								<img src="img/nav_mymenu_off.png" alt="" class="off">
								<img src="img/nav_mymenu_on.png" alt="" class="on">
							</div>
							<span class="txt">마이메뉴</span>
						</a>
					</li>
				</ul>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>


	
	<!-- countUp -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.6.2/countUp.umd.js"></script>

	<!-- JS -->
	<script src="js/common.js"></script>




</body>

</html>
