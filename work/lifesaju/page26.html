<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>

	<div class="web_wrap">

		<div class="web_left">

			<!-- payment method modal -->
			<div class="paymentMethod_modal">
				<div class="headbox">
					<div class="top">
						<button type="button" class="back_btn"></button>
					</div>
					<div class="progress">
						<div class="bar"></div>
					</div>
				</div>
				<div class="bodybox">
					<div class="txtbox">
						<div class="titbox">
							<p class="tit">결제카드를 등록해 주세요</p>						
						</div>
					</div>
					<div class="form_box">
						<div class="form_item input_box">
							<label class="label_text">카드번호(14~16자리)</label>
							<input class="input_text" placeholder="0000-0000-0000-0000" required></input>
						</div>
						<div class="form_item input_box w50">
							<label for="" class="label_text">유효기간</label>
							<input class="input_text" placeholder="MM / YY" required></input>
						</div>
						<div class="form_item input_box w50">
							<label for="" class="label_text">카드 비밀번호</label>
							<input class="input_text" placeholder="앞 두자리" required></input>
						</div>
						<div class="form_item input_box">
							<label for="" class="label_text">생년월일</label>
							<input class="input_text" placeholder="생년월일 6자리" required></input>
						</div>
					</div>
				</div>
				<div class="btnbox">
					<button type="button" class="btn register_btn" disabled>등록하기</button>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
			<div class="bottombox">
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="txt">지금 설치하기</span>
						<span class="icon"></span>
					</a>
				</div>
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
			</div>
		</div>

	</div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
