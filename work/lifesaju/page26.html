<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>


    <div class="wrap">

		<!-- first consult modal-->
        <div class="firstConsult_modal modal ver3 show state2">			
			<div class="modal_box">
				<div class="modal_body">		
					<img src="img/call_img1.png" alt="" class="img">
					<p class="tit">
						<span class="txt txt1">
							약 5분간 무료로 첫 상담을 제공해요.
						</span>
						<span class="txt txt2">
							상담이 끝난 뒤 결제가 진행돼요.
						</span>
					</p>
					<div class="descbox descbox1">
						<p class="desc">
							종료 시 음성 안내 후 자동결제가 진행되며, <br>
							언제든 종료할 수 있어요.
							<br><br>
							계속 진행할까요?
						</p>
					</div>
					<div class="descbox descbox2">
						<p class="desc">
							통화 시간에 따라 상담 종료 후, <br>
							등록된 결제 수단으로 자동결제가 진행돼요. <br>
							언제든 원하실 때 직접 통화를 종료하실 수 있어요.
						</p>
						<p class="desc">
							계속 진행할까요?
						</p>
					</div>
				</div>
				<div class="modal_btnbox">
					<button type="button" class="btn typeB modal_close">아니요</button>
					<button type="button" class="btn">네</button>
				</div>
			</div>
		</div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
