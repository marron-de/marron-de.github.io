<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>

	<div class="web_wrap">

		<div class="web_left">

			<!-- join guide modal -->
			<div class="joinGuide_modal step3">
				<div class="headbox">
					<div class="top">
						<button type="button" class="back_btn"></button>
					</div>
					<div class="progress">
						<div class="bar"></div>
					</div>
				</div>
				<div class="bodybox">
					<div class="txtbox">
						<p class="tit">
							인생사주 서비스 <br>
							이용약관을 확인해주세요
						</p>
						<div class="descbox"></div>
					</div>
					<div class="checkwrap">
						<div class="check_box">
							<input type="checkbox" class="input_check" name="joinTerms" id="joinTerms_0">
							<label for="joinTerms_0" class="label_check">모두 동의</label>
						</div>
						<div class="check_line"></div>
						<div class="check_box">
							<input type="checkbox" class="input_check" name="joinTerms" id="joinTerms_1" required>
							<label for="joinTerms_1" class="label_check">[필수] 만 14세 이상입니다</label>
						</div>
						<div class="check_box">
							<input type="checkbox" class="input_check" name="joinTerms" id="joinTerms_2" required>
							<label for="joinTerms_2" class="label_check">
								[필수] 개인정보 수집 및 이용 동의 <a href="" class="link">보기</a>
							</label>
						</div>
						<div class="check_box">
							<input type="checkbox" class="input_check" name="joinTerms" id="joinTerms_3" required>
							<label for="joinTerms_3" class="label_check">
								[필수] 이용약관 동의 <a href="" class="link">보기</a>
							</label>
						</div>
						<div class="check_box">
							<input type="checkbox" class="input_check" name="joinTerms" id="joinTerms_4">
							<label for="joinTerms_4" class="label_check">
								[선택] 서비스 진행 상황, 할인 쿠폰 및 프로모션,혜택·마케팅 이메일, SMS, 앱 알림 수신동의
							</label>
						</div>					
					</div>
				</div>
				<div class="btnbox">
					<button type="button" class="btn next_btn join_btn" disabled>동의하고 가입하기</button>
				</div>
			</div>

		</div>

		<div class="web_right">
			<div class="topbox">
				<div class="imgbox">
					<img src="img/ic_qr.png" alt="" class="qr">
				</div>
				<div class="txtbox">
					<p class="tit">
						<span class="color">인생사주 앱 설치</span>하고 <br>
						<span class="color">웰컴 쿠폰</span> 바로 받기!
					</p>
					<a href="" class="link">
						<span class="icon"></span>
						<span class="txt">지금 설치하기</span>
					</a>
				</div>
			</div>
			<div class="bottombox">
				<div class="swiper webright_slider">
					<div class="swiper-wrapper">
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
						<div class="swiper-slide item">
							<a href="" class="banner">
								<img src="img/web_sidebannner1.png" alt="" class="img">
							</a>
						</div>
					</div>
					<div class="swiper-pagination pagination"></div>
				</div>
			</div>
		</div>

	</div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
