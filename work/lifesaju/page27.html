<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>


    <div class="wrap">

		<!-- join complete  modal-->
        <div class="callGuide_modal modal ver2 show">			
			<div class="modal_box">	
				<button type="button" class="modal_close"></button>
				<div class="top_box">
					<img src="img/call_img2.png" alt="" class="icon">
					<p class="tit">전화 상담 안내</p>
					<p class="desc">다음 절차를 따라 진행해 주세요</p>
				</div>
				<div class="step_box">
					<div class="step">
						<span class="color">070-5234-8700</span> 전화하기
					</div>
					<div class="arrow"></div>
					<div class="step">
						상담사 고유번호 <span class="color">[341]</span>을 입력
					</div>
					<div class="arrow"></div>
					<div class="step">
						상담시작
					</div>
				</div>
				<div class="last">
					<span class="icon"></span>
					<span class="txt">통화 종료 후, 사용 시간만큼 자동 결제됩니다</span>
				</div>
			</div>
		</div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
