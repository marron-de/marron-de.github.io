<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생사주</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- phosphor-icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mob.css">

    <!-- Font -->
    <link rel="stylesheet" href="font/Pretendard/Pretendard.css">
    <link rel="stylesheet" href="font/GapyeongHanseokbong/GapyeongHanseokbong.css">

</head>

<body>


    <div class="wrap">

		<!-- payment method modal -->
        <div class="paymentMethod_modal">
			<div class="headbox">
				<div class="top">
					<button type="button" class="back_btn"></button>
				</div>
				<div class="progress">
					<div class="bar"></div>
				</div>
			</div>
			<div class="bodybox">
				<div class="txtbox">
					<div class="titbox">
						<p class="tit">결제수단</p>			
						<button type="button" class="add_btn">추가하기</button>			
					</div>
				</div>
				<div class="radiowrap">
					<div class="radio_box">
						<input type="radio" class="input_radio" name="pay_method" id="pay_method1" checked>
						<label for="pay_method1" class="label_radio">
							<img src="img/ico_kakaopay.png" alt="" class="img">
						</label>
						<button type="button" class="del_btn"></button>
					</div>
					<div class="radio_box">
						<input type="radio" class="input_radio" name="pay_method" id="pay_method2">
						<label for="pay_method2" class="label_radio">비씨(0000)</label>
						<button type="button" class="del_btn"></button>
					</div>
				</div>
			</div>
		</div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
