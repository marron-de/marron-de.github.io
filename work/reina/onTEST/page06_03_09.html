<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 show" id="examCheckPopup">
            <div class="modal_box size_big">
				<div class="modal_head">
					<p class="h_title">시험지 확인</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="examcheck_box">
						<div class="form_label padding4">
							<div class="form_flex full between">
								<div class="input_flex gap2">	
									<div class="input_txt flexible">
										<span class="bold">문항번호</span>
										<span class="bold color1">A25558</span>
									</div>
									<div class="bar"></div>	
									<div class="input_txt">
										<span class="bold">응시영역</span>
									</div>
									<div class="select_box w240">
										<select class="select select2">
											<option value="0분">0분</option>
											<option value="10분">10분</option>
											<option value="20분">20분</option>
											<option value="30분">30분</option>
											<option value="40분">40분</option>
											<option value="50분">50분</option>
											<option value="60분">60분</option>
										</select>
									</div>
								</div>
								<div class="input_flex gap2">	
									<div class="input_txt flexible">
										<span class="bold">점수</span>
										<span class="txt">
											<span class="color1">26</span>/30
										</span>
									</div>
									<div class="bar"></div>	
									<div class="input_txt flexible">
										<span class="bold">점수</span>
										<span class="bold color1">26</span>
									</div>
									<div class="bar"></div>	
									<div class="input_txt flexible">
										<span class="bold">오답수</span>
										<span class="bold color2">4</span>
									</div>
								</div>
							</div>
						</div>
						<div class="exambox">
							<div class="examitem">
								<div class="titbox">
									<p class="tit">01. 컴퓨터 스위치의 History와 관련하여 스위치의 발전 순서는?</p>
									<p class="desc">(정답 : 1번)</p>
								</div>
								<div class="descbox">
									<div class="descitem correct">
										<span class="num">①</span>
										<span class="txt">기계식스위치 -> 진공관스위치 -> 반도체스위치</span>
									</div>
									<div class="descitem">
										<span class="num">②</span>
										<span class="txt">진공관스위치 -> 기계식스위치 -> 반도체스위치</span>
									</div>
									<div class="descitem">
										<span class="num">③</span>
										<span class="txt">기계식스위치 -> 반도체스위치 -> 진공관스위치</span>
									</div>
									<div class="descitem">
										<span class="num">④</span>
										<span class="txt">진공관스위치 -> 반도체스위치 -> 기계식스위치</span>
									</div>
								</div>
							</div>
						</div>
					</div>				
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
