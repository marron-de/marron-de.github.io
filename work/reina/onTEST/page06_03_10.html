<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 show" id="videoPlayPopup">
            <div class="modal_box size_big">
				<div class="modal_head">
					<p class="h_title">동영상 재생</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body padding0">
					<div class="play_box">
						<div class="el_layout play_top">
							<div class="leftbox"></div>
							<div class="rightbox">	
								<div class="desc">영상 바로가기</div>
								<div class="select_box w96">
									<select class="select select2">
										<option value="0분">0분</option>
										<option value="1분">1분</option>
										<option value="2분">2분</option>
										<option value="3분">3분</option>
										<option value="4분">4분</option>
										<option value="5분">5분</option>
										<option value="6분">6분</option>
										<option value="7분">7분</option>
										<option value="8분">8분</option>
										<option value="9분">9분</option>
										<option value="10분">10분</option>
									</select>
								</div>
								<div class="tit">
									<span class="point">총 40분</span>
								</div>
							</div>
						</div>
						<div class="vidbox">
							<div class="video">
								<video id="video" class="video" poster="img/testvideo_thum.jpg" src="video/testvideo.mp4" playsinline></video>
								<button type="button" class="vid_btn play_btn"></button>
								<button type="button" class="vid_btn pause_btn"></button>
							</div>
							<div class="controls">
								<button type="button" class="control_btn play"></button>
								<div class="time">
									<span class="now">0:50</span> / 5:00
								</div>
								<div class="progress">
									<div class="load" style="width: 12.684%;"></div>
									<div class="bar" style="width: 5.582%;"></div>
								</div>
								<div class="btnbox">
									<button type="button" class="btn volume_btn"></button>
									<button type="button" class="btn full_btn"></button>
									<button type="button" class="btn opt_btn"></button>
								</div>
							</div>
						</div>
					</div>				
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
