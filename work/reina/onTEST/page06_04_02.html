								</tr>
							</thead>
							<tbody>
								<tr>
									<td data-th="radiobox">
										<div class="radio_box">
											<input type="radio" class="input_radio" name="examSelect" checked>
										</div>
									</td>
									<td data-th="생성기업명">에듀스</td>
