<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 register_modal show" id="examRegisterSetPopup">
            <div class="modal_box">
				<div class="modal_head">
					<p class="h_title">시험지 등록 설정</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="form_box">
						<div class="input_box">
							<label class="label_text">파일등록</label>
							<div class="input_filebox pdf_ver">
								<input type="file" name="frm_file1" id="frm_file1" class="input_file" data-accept="pdf" data-size="20mb">
								<div class="file_upload">
									<div class="upload_box">
										<img src="img/sample_pdf_img.png" alt="" class="img">
									</div>
									<button type="button" class="del_btn" style="display: block;"></button>
								</div>
								<div class="file_txtbox">
									<p class="tit">
										왼쪽 아이콘을 클릭하거나 <br>
										PDF 파일을 끌어다 놓으세요..
									</p>
									<p class="desc">
										PDF 파일만 가능합니다. <br>
										웹게시형 PDF 권장 <br>
										20MB 이하
									</p>
									<p class="filename">
										2025년 온라인 모의 시험.pdf
									</p>
								</div>
							</div>
						</div>
					</div>					
				</div>
				<div class="modal_foot">
					<button type="button" class="btn">설정 완료</button>
				</div>
			</div>
        </div>

    </div>



	<!-- pdf -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
	
    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
