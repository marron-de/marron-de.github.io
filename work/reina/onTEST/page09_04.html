<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 show" id="surveyResultPopup">
            <div class="modal_box size_big">
				<div class="modal_head">
					<p class="h_title">설문 결과지</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="form_box survey_wrap">
						<div class="survey_box">
							<p class="survey_tit">2025 하반기 교육 만족도 조사</p>
							<div class="form_label padding">
								<p class="txt default">
									설문 참여인원 : <span class="bold">50</span>명<br>
									설문 조사기간 : 2025-12-25(금) ~ 2026-10-24(수) / <span class="bold">30</span>일
								</p>
							</div>
						</div>
						<div class="survey_box">
							<div class="survey_item">
								<p class="survey_subtit">01. 하반기 교육에 대해서 만족하셨나요?</p>
								<div class="survey_result">
									<div class="result_txtbox">
										<div class="txtitem">
											<p class="tit">1) 매우 만족</p>
											<p class="desc">
												<span class="bold">80%</span>
												<span class="txt">(20명)</span>
											</p>
										</div>
										<div class="txtitem">
											<p class="tit">2) 만족</p>
											<p class="desc">
												<span class="bold">20%</span>
												<span class="txt">(05명)</span>
											</p>
										</div>
										<div class="txtitem">
											<p class="tit">3) 보통</p>
											<p class="desc">
												<span class="bold">10%</span>
												<span class="txt">(10명)</span>
											</p>
										</div>
										<div class="txtitem">
											<p class="tit">4) 미흡</p>
											<p class="desc">
												<span class="bold">05%</span>
												<span class="txt">(05명)</span>
											</p>
										</div>
										<div class="txtitem">
											<p class="tit">5) 매우 미흡</p>
											<p class="desc">
												<span class="bold">10%</span>
												<span class="txt">(10명)</span>
											</p>
										</div>
									</div>
									<div class="result_bar"></div>
									<div class="result_chart">
										<div class="chart_box">
											<canvas id="pieChart" class="chart" width="142" height="142"></canvas>
										</div>
										<div class="label_box">
											<div class="label">
												<span class="color color1"></span>
												<span class="txt">매우 만족</span>
											</div>
											<div class="label">
												<span class="color color2"></span>
												<span class="txt">만족</span>
											</div>
											<div class="label">
												<span class="color color3"></span>
												<span class="txt">보통</span>
											</div>
											<div class="label">
												<span class="color color4"></span>
												<span class="txt">미흡</span>
											</div>
											<div class="label">
												<span class="color color5"></span>
												<span class="txt">매우 미흡</span>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
						<div class="form_line"></div>
						<div class="survey_box">
							<div class="survey_item">
								<p class="survey_subtit2">* 이전 문항에서 미흡 또는 매우 미흡을 선택한 경우 그 사유를 간략히 기재해주시기 바랍니다.</p>
								<div class="input_box">
									<div class="input_flex">
										<input type="text" class="input_text" placeholder="매우 만족합니다.">
										<button type="button" class="btn icon_ver">
											<img src="img/ico_write.png" alt="" class="icon">
										</button>
									</div>
									<div class="input_flex">
										<input type="text" class="input_text" placeholder="매우 만족합니다.">
										<button type="button" class="btn icon_ver">
											<img src="img/ico_write.png" alt="" class="icon">
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>					
				</div>
				<div class="modal_foot">
					<button type="button" class="btn auto w100">확인</button>
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>
	<script>	
		const chartEl = document.getElementById('pieChart');
		if (chartEl) {
			const ctx = chartEl.getContext('2d');
			const config = {
				type: 'pie',
				data: {
					labels: ['매우 만족', '만족', '보통', '미흡', '매우 미흡'],
					datasets: [{
						label: '만족도 평가',
						data: [21, 5, 10, 28, 36],
						backgroundColor: [
							'#9e6cff',
							'#4974ff', 
							'#16de40', 
							'#ffea00', 
							'#ff5250' 
						],
						borderWidth: 0
					}]
				},
				options: {
					responsive: false,
					plugins: {
						legend: {display: false},
						tooltip: {enabled: false}
					},
					hover: { mode: null }
				}
			};
			new Chart(ctx, config);
		}	
	</script>



</body>

</html>
