<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 examBank_modal show" id="examBankPopup">
            <div class="modal_box">
				<div class="modal_head">
					<p class="h_title">문제은행 저장</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">			
					<div class="form_box gap1">
						<div class="form_item">
							<div class="input_flex gap2">
								<button type="button" class="btn icon_ver2">
									<img src="img/ico_arrowdown.png" alt="" class="icon">
									<span class="txt">펼치기</span>
								</button>
								<button type="button" class="btn icon_ver2">
									<img src="img/ico_arrowup.png" alt="" class="icon">
									<span class="txt">닫기</span>
								</button>
								<button type="button" class="btn icon_ver2">
									<img src="img/ico_plus2.png" alt="" class="icon">
									<span class="txt">모듈추가</span>
								</button>
							</div>					
						</div>
						<div class="form_item">				
							<div class="directory_box h265">
								<div class="directory_item cat1">
									<div class="path_box">
										<div class="path"></div>
										<button type="button" class="path_btn"></button>
									</div>
									<div class="item_box">
										<div class="title">
											<div class="icon_box">
												<img src="img/ico_folder2.png" alt="" class="icon">
											</div>
											<div class="txt_box">
												<p class="txt">모듈 <span class="point">(1)</span></p>
											</div>
											<button type="button" class="btn small type_add">
												<img src="img/ico_plus.png" alt="" class="icon">
												<span class="txt">유형 추가</span>
											</button>
											<button type="button" class="icon_btn delete_btn">
												<img src="img/ico_delete.png" alt="" class="icon">
											</button>
											<div class="input_box w120">
												<input type="text" class="input_text" placeholder="모듈">
											</div>
										</div>
										<div class="directory_item cat2">
											<div class="path_box">
												<div class="path"></div>
												<button type="button" class="path_btn"></button>
											</div>
											<div class="item_box">
												<div class="title">
													<div class="icon_box">
														<img src="img/ico_doc.png" alt="" class="icon">
													</div>
													<div class="txt_box">
														<p class="txt">유형 <span class="point">(1)</span></p>
													</div>
													<button type="button" class="btn small type_add">
														<img src="img/ico_plus.png" alt="" class="icon">
														<span class="txt">세부유형 추가</span>
													</button>
													<button type="button" class="icon_btn delete_btn">
														<img src="img/ico_delete.png" alt="" class="icon">
													</button>
													<div class="input_box w120">
														<input type="text" class="input_text" placeholder="유형">
													</div>
												</div>
												<div class="directory_item cat3">
													<div class="path_box">
														<div class="path"></div>
													</div>
													<div class="item_box">
														<div class="title">
															<div class="icon_box">
																<img src="img/ico_doc.png" alt="" class="icon">
															</div>
															<div class="txt_box">
																<p class="txt">세부유형 <span class="point">(1)</span></p>
															</div>
															<button type="button" class="icon_btn delete_btn">
																<img src="img/ico_delete.png" alt="" class="icon">
															</button>
															<div class="input_box w120">
																<input type="text" class="input_text" placeholder="세부유형">
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="modal_foot">
					<button type="button" class="btn close_btn">확인</button>
				</div>
			</div>
        </div>

    </div>



	<!-- pdf -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
	
    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
