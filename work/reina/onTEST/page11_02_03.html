<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 show" id="callbackPopup">
            <div class="modal_box size_big">
				<div class="modal_head">
					<p class="h_title">콜백전송</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="form_label padding">
						<div class="txt">
							import requests <br>
							import json
							<br><br>
							# 콜백 URL (상대 서버가 준비한 엔드포인트) <br>
							callback_url = "https://example.com/callback"
							<br><br>
							# 전달할 데이터 (예: 주문 완료 알림) <br>
							payload = { <br>
							&nbsp;&nbsp;&nbsp;&nbsp;"order_id": "12345", <br>
							&nbsp;&nbsp;&nbsp;&nbsp;"status": "completed", <br>
							&nbsp;&nbsp;&nbsp;&nbsp;"timestamp": "2025-09-19T10:30:00Z" <br>
							}
							<br><br>
							# 헤더 설정 <br>
							headers = { <br>
							&nbsp;&nbsp;&nbsp;&nbsp;"Content-Type": "application/json"
						</div>
					</div>			
				</div>
				<div class="modal_foot">
					<button type="button" class="btn auto typeD">
						<img src="img/ico_copy.png" alt="" class="icon">
						<span class="txt">복사하기</span>
					</button>
					<button type="button" class="btn w100">확인</button>
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
