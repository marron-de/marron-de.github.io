<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 show" id="surveyFormPopup">
            <div class="modal_box size_big">
				<div class="modal_head">
					<p class="h_title">설문 조사지</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="form_box survey_wrap">
						<div class="survey_box">
							<p class="survey_tit">2025 하반기 교육 만족도 조사</p>
							<div class="form_label padding">
								<p class="txt default">
									본 조사는 교육 서비스에 대한 만족도를 파악하여 향후 보다 나은 서비스를 제공하고자 하는데 그 목적이 있습니다. <br>
									귀하의 협조에 미리 감사합니다.
								</p>
							</div>
						</div>
						<div class="survey_box">
							<div class="survey_item">
								<p class="survey_subtit">01. 하반기 교육에 대해서 만족하셨나요?</p>
								<div class="radio_wrap column_ver">
									<div class="radio_box">
										<input type="radio" name="survey1" id="survey1_1" class="input_radio" checked>
										<label for="survey1_1" class="label_radio">매우 만족</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="survey1" id="survey1_2" class="input_radio">
										<label for="survey1_2" class="label_radio">보통</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="survey1" id="survey1_3" class="input_radio">
										<label for="survey1_3" class="label_radio">미흡</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="survey1" id="survey1_4" class="input_radio">
										<label for="survey1_4" class="label_radio">만족</label>
									</div>
									<div class="radio_box">
										<input type="radio" name="survey1" id="survey1_5" class="input_radio">
										<label for="survey1_5" class="label_radio">매우 미흡</label>
									</div>
								</div>
							</div>
							<div class="survey_item">
								<p class="survey_subtit2">* 이전 문항에서 미흡 또는 매우 미흡을 선택한 경우 그 사유를 간략히 기재해주시기 바랍니다.</p>
								<div class="input_box">
									<textarea class="input_text" placeholder="내용을 입력하세요."></textarea>
								</div>
							</div>
						</div>
						<div class="form_line"></div>
						<div class="survey_box">
							<div class="survey_item">
								<p class="survey_subtit">01. 하반기 교육에 대해서 만족하셨나요?</p>
								<div class="check_wrap column_ver">
									<div class="check_box">
										<input type="radio" name="survey2_1" id="survey2_1" class="input_check" checked>
										<label for="survey2_1" class="label_check">매우 만족</label>
									</div>
									<div class="check_box">
										<input type="radio" name="survey2_2" id="survey2_2" class="input_check">
										<label for="survey2_2" class="label_check">보통</label>
									</div>
									<div class="check_box">
										<input type="radio" name="survey2_3" id="survey2_3" class="input_check">
										<label for="survey2_3" class="label_check">미흡</label>
									</div>
									<div class="check_box">
										<input type="radio" name="survey2_4" id="survey2_4" class="input_check">
										<label for="survey2_4" class="label_check">만족</label>
									</div>
									<div class="check_box">
										<input type="radio" name="survey2_5" id="survey2_5" class="input_check">
										<label for="survey2_5" class="label_check">매우 미흡</label>
									</div>
								</div>
							</div>
							<div class="survey_item">
								<p class="survey_subtit2">* 이후 받고 싶은 교육을 한 과목만 기재해주시기 바랍니다.</p>
								<div class="input_box">
									<input type="text" class="input_text" placeholder="내용을 입력하세요.">
								</div>
							</div>
						</div>
					</div>					
				</div>
				<div class="modal_foot">
					<button type="button" class="btn auto w100">제출</button>
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
