<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 examInputPopup show" id="totalExamInputPopup">
            <div class="modal_box">
				<div class="modal_head">
					<p class="h_title">문제 입력</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="form_box wrap">
						<div class="form_item w50">
							<div class="input_box">
								<label class="label_text">문제 유형</label>
								<div class="select_box">
									<select class="select select2">
										<option value="01. 수리 영역">01. 수리 영역</option>
									</select>
								</div>
							</div>
						</div>
						<div class="form_item">
							<div class="input_box">
								<label class="label_text">전체 문제등록</label>
								<div class="input_editorbox">
									<div class="editor">
										<div class="item item1">
											<select class="editor_select">
												<option value="나눔고딕" selected="">나눔고딕</option>
												<option value="프리텐다드">프리텐다드</option>
											</select>
										</div>
										<div class="bar"></div>
										<div class="item item2">
											<select class="editor_select">
												<option value="제목1">제목1</option>
												<option value="제목2">제목2</option>
												<option value="제목3">제목3</option>
												<option value="본문1">본문1</option>
												<option value="본문2">본문2</option>
												<option value="본문3" selected="">본문3</option>
											</select>
										</div>
										<div class="bar"></div>
										<div class="item item3">
											<button type="button" class="icon_btn">
												<img src="img/editor_fontIcon1.png" alt="">
											</button>
											<button type="button" class="icon_btn">
												<img src="img/editor_fontIcon2.png" alt="">
											</button>
											<button type="button" class="icon_btn">
												<img src="img/editor_fontIcon3.png" alt="">
											</button>
										</div>
										<div class="bar"></div>
										<div class="item item4">
											<button type="button" class="icon_btn">
												<img src="img/editor_fontIcon4.png" alt="">
											</button>
											<button type="button" class="icon_btn">
												<img src="img/editor_fontIcon5.png" alt="">
											</button>
										</div>
										<div class="bar"></div>
										<div class="item item5">
											<button type="button" class="icon_btn">
												<img src="img/editor_fontIcon6.png" alt="">
											</button>
											<button type="button" class="icon_btn">
												<img src="img/editor_fontIcon7.png" alt="">
											</button>
											<button type="button" class="icon_btn">
												<img src="img/editor_fontIcon8.png" alt="">
											</button>
										</div>
									</div>
									<textarea class="input_text h352" placeholder="내용을 입력해주세요"></textarea>
								</div>
							</div>
						</div>
					</div>					
				</div>
				<div class="modal_foot">
					<button type="button" class="btn">입력 완료</button>
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
