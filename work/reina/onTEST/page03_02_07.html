<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 show" id="listeningSettingPopup">
            <div class="modal_box">
				<div class="modal_head">
					<p class="h_title">듣기평가 설정</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="form_box">
						<div class="input_box">
							<label class="label_text">첫 안내 시간</label>
							<div class="input_flex gap2">
								<span class="input_txt">시험 시작</span>
								<div class="select_box">
									<select class="select select2">
										<option value="1">1</option>
										<option value="2">2</option>
										<option value="3">3</option>
										<option value="4">4</option>
										<option value="5">5</option>
										<option value="6">6</option>
										<option value="7">7</option>
										<option value="8">8</option>
										<option value="9">9</option>
										<option value="10" selected>10</option>
									</select>
								</div>
								<span class="input_txt">초 후 듣기평가 시작</span>
							</div>
						</div>
						<div class="input_box">
							<label class="label_text">음성파일 설정</label>
							<div class="tbl_wrap">
								<table class="tbl">
									<colgroup>
										<col style="width: 113px;">
										<col style="width: 467px;">
										<col style="width: 275px;">
										<col style="width: 145px;">
										<col style="width: 24px;">
									</colgroup>
									<thead>
										<tr>
											<th data-th="번호">번호</th>
											<th data-th="파일등록">파일등록</th>
											<th data-th="다음 재생시까지 대기시간(초)">다음 재생시까지 대기시간(초)</th>
											<th data-th="미리 듣기">미리 듣기</th>
											<th data-th="버튼"></th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<td data-th="번호">01</td>
											<td data-th="파일등록">
												<div class="tbl_file">
													<img src="img/ico_folder.png" alt="" class="icon">
													<span class="txt">25년 온라인 시험 문제.mp4</span>
												</div>
											</td>
											<td data-th="다음 재생시까지 대기시간(초)">
												<div class="select_box">
													<select class="select select2">
														<option value="1">1</option>
														<option value="2">2</option>
														<option value="3">3</option>
														<option value="4">4</option>
														<option value="5">5</option>
														<option value="6">6</option>
														<option value="7">7</option>
														<option value="8">8</option>
														<option value="9">9</option>
														<option value="10" selected>10</option>
													</select>
												</div>
											</td>
											<td data-th="미리 듣기">
												<button type="button" class="tbl_btn">
													<img src="img/ico_volume.png" alt="" class="icon">
													<span class="txt">미리 듣기</span>
												</button>
											</td>
											<td data-th="버튼">
												<button type="button" class="icon_btn">
													<img src="img/ico_delete.png" alt="" class="icon">
												</button>
											</td>
										</tr>
										<tr>
											<td data-th="번호">02</td>
											<td data-th="파일등록">
												<div class="tbl_file">
													<img src="img/ico_folder.png" alt="" class="icon">
													<span class="txt">파일을 선택해주세요.</span>
												</div>
											</td>
											<td data-th="다음 재생시까지 대기시간(초)">
												<div class="select_box">
													<select class="select select2">
														<option value="1">1</option>
														<option value="2">2</option>
														<option value="3">3</option>
														<option value="4">4</option>
														<option value="5">5</option>
														<option value="6">6</option>
														<option value="7">7</option>
														<option value="8">8</option>
														<option value="9">9</option>
														<option value="10" selected>10</option>
													</select>
												</div>
											</td>
											<td data-th="미리 듣기">
												<button type="button" class="tbl_btn">
													<img src="img/ico_volume.png" alt="" class="icon">
													<span class="txt">미리 듣기</span>
												</button>
											</td>
											<td data-th="버튼">
												<button type="button" class="icon_btn">
													<img src="img/ico_delete.png" alt="" class="icon">
												</button>
											</td>
										</tr>
									</tbody>
								</table>
								<div class="tbl_bottom">
									<div class="leftbox"></div>
									<div class="rightbox">									
										<button type="button" class="btn typeB disabled" disabled>
											<img src="img/ico_minus.png" alt="" class="icon">
											<span class="txt">삭제</span>
										</button>
										<button type="button" class="btn typeB">
											<img src="img/ico_plus.png" alt="" class="icon">
											<span class="txt">추가</span>
										</button>
									</div>
								</div>
							</div>
						</div>
					</div>					
				</div>
				<div class="modal_foot">
					<button type="button" class="btn">입력 완료</button>
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
