<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 show" id="statisticsReportPopup">
            <div class="modal_box size_big">
				<div class="modal_head">
					<p class="h_title">Statistics Report</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="txtbox">
						<p class="title">반도체 소자와 공정이론 시험</p>
						<div class="info_box">
							<div class="info_item">
								<p class="tit">응시일</p>
								<p class="desc">2025-10-24</p>
							</div>
							<div class="info_item column">
								<p class="tit">시험정보</p>
								<p class="desc">
									총점 : <span class="point">25점</span>
								</p>
							</div>
							<div class="info_item column">
								<p class="tit"></p>
								<p class="desc">
									영역<br>
									1. 반도체 공정의 이해 <br>
									2. 반도체 소자 <br>
									응시시간 : <span class="point">30분</span>
								</p>
							</div>
						</div>
					</div>
					<div class="tbl_wrap">
						<table class="tbl">
							<colgroup>
								<col style="width: 140px;">
								<col style="width: 376px;">
								<col style="width: 140px;">
								<col style="width: 376px;">
							</colgroup>
							<tbody>
								<tr>
									<th data-th="지원 인원">지원 인원</th>
									<td data-th="지원 인원">162명</td>
									<th data-th="시험 인원">시험 인원</th>
									<td data-th="시험 인원">162명</td>
								</tr>
								<tr>
									<th data-th="평균 점수">평균 점수</th>
									<td data-th="평균 점수">21.2/25점</td>
									<th data-th="표준 편차">표준 편차</th>
									<td data-th="표준 편차">2.46565</td>
								</tr>
								<tr>
									<th data-th="전체 점수(25) 비교">전체 점수(25)<br>비교</th>
									<td data-th="전체 점수(25) 비교" colspan="3" class="chart_td">
										<div class="bar_chartbox">
											<div class="barchart">
												<div class="baritem type1" data-score="20.4">
													<div class="bar"></div>
													<span class="score">21.2점</span>
												</div>
												<div class="baritem type2" data-score="21.15">
													<div class="bar"></div>
													<span class="score">23.4점</span>
												</div>
												<div class="baritem type3" data-score="25">
													<div class="bar"></div>
													<span class="score">25점</span>
												</div>
												<div class="baritem type4" data-score="9.7">
													<div class="bar"></div>
													<span class="score">9점</span>
												</div>
											</div>
											<div class="y_labelbox">
												<div class="label">평균점수</div>
												<div class="label">상위 30% 점수</div>
												<div class="label">최고점수</div>
												<div class="label">최하점수</div>
											</div>
											<div class="x_labelbox">
												<div class="label">0점</div>
												<div class="label">5점</div>
												<div class="label">10점</div>
												<div class="label">15점</div>
												<div class="label">20점</div>
												<div class="label">25점</div>
											</div>
										</div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>				
				</div>
				<div class="modal_foot">
					<button type="button" class="btn typeD auto">
						<img src="img/ico_print.png" alt="" class="icon">
						<span class="txt">인쇄하기</span>
					</button>
					<button type="button" class="btn w100">저장</button>
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
