<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 show" id="supervisorPopup">
            <div class="modal_box">
				<div class="modal_head">
					<p class="h_title">감독관 배정</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="form_box">
						<div class="input_box">
							<label class="label_text">
								감독관 계정 <span class="required">*</span>
							</label>							
							<div class="form_label2">
								<div class="select_box flexible">
									<input type="text" class="select_input full typeA" value="hynix">
									<input type="text" class="select_input w64" value="001">
									<span class="select_txt margin0">-</span>
									<input type="text" class="select_input w64" value="050">
								</div>
							</div>
						</div>
						<div class="input_box">
							<label class="label_text">
								등록 인원수 <span class="required">*</span>
							</label>
							<div class="form_label2">
								<div class="select_box flexible">
									<input type="text" class="select_input full" value="100">
								</div>
							</div>
						</div>
						<div class="input_box">
							<label class="label_text">배정할 감독관 수</label>
							<div class="input_flex">
								<div class="select_box">
									<select class="select select2">
										<option value="1">1</option>
										<option value="2">2</option>
										<option value="3">3</option>
										<option value="4">4</option>
										<option value="5" selected>5</option>
									</select>
								</div>
								<button type="button" class="input_btn w96">확인</button>
							</div>
						</div>
					</div>		
				</div>
                <div class="modal_foot">
                    <button type="button" class="btn typeD auto">
						<img src="img/ico_camera.png" alt="" class="icon">
						<span class="txt">미리보기</span>
					</button>
                    <button type="button" class="btn auto">
						<img src="img/ico_excel_w.png" alt="" class="icon">
						<span class="txt">엑셀저장</span>
					</button>
                </div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
