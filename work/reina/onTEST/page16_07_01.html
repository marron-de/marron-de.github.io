<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST</title>

    <!-- Swiper -->
    <link rel="stylesheet" href="css/swiper-bundle.min.css" />
    <script src="js/swiper-bundle.min.js"></script>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- chart.js -->
    <script src="js/chart.js"></script>
    <script src="js/chartjs-plugin-datalabels.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal type2 show" id="accessLinkPopup">
            <div class="modal_box">
				<div class="modal_head">
					<p class="h_title">접속링크</p>
					<button type="button" class="close_btn"></button>
				</div>
				<div class="modal_body">
					<div class="access_box">
						<div class="form_label2">
							<div class="select_box">
								<select class="select select2" data-class="ver2">
									<option value="화상 접속링크" data-class="typeA" selected>화상 접속링크</option>
									<option value="화상 업로드 접속링크" data-class="typeC">화상 업로드 접속링크</option>
									<option value="TREFF 접속링크 (감독관 전용)" data-class="typeD">TREFF 접속링크 (감독관 전용)</option>
								</select>
							</div>
						</div>
						<div class="qrbox">
							<img src="img/qr_img.png" alt="" class="qr">
						</div>
					</div>			
				</div>
				<div class="modal_foot">
					<button type="button" class="btn auto">
						<img src="img/ico_copy_w.png" alt="" class="icon">
						<span class="txt">링크복사</span>
					</button>
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
