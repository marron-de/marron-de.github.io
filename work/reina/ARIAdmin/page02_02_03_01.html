<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIEP Admin</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap layout evaluationList_wrap">

		<!-- navigation -->
		<div class="navigation">
			<div class="nav_logo">
                <img src="img/logo.svg" alt="" class="logo">
				<div class="profile">
					<img src="img/nav_profile.png" alt="" class="icon">
				</div>
            </div>
			<ul class="nav">
                <li class="show">
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_nav1.svg" alt=""></span>
                        <span class="title">
							<span class="txt">평가 목록</span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">평가 목록</div>
						</div>
                    </a>
				</li>
                <li>
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_nav2.svg" alt=""></span>
                        <span class="title">
							<span class="txt">평가 등록</span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">평가 등록</div>
						</div>
                    </a>
				</li>
                <li>
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_nav3.svg" alt=""></span>
                        <span class="title">
							<span class="txt">전역 설정</span>
							<span class="human"></span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">전역 설정</div>
						</div>
                    </a>
				</li>
                <li>
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_nav4.svg" alt=""></span>
                        <span class="title">
							<span class="txt">기업 관리</span>
							<span class="human"></span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">기업 관리</div>
						</div>
                    </a>
				</li>
            </ul>
			<ul class="nav nav_bottom">
                <li>
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_login_w.svg" alt=""></span>
                        <span class="title">
							<span class="txt">전체 관리자 로그인</span>
							<span class="human"></span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">전체 관리자 로그인</div>
						</div>
                    </a>
				</li>
			</ul>
			<button type="button" class="nav_btn"></button>
		</div>

        <!-- container -->
        <div class="container">
			
			<!-- page header -->
			<header class="page_header">
				<div class="leftbox">
					<p class="breadcrumb">
						<span class="tit small">평가 목록</span>
						<span class="arrow"></span>
						<span class="tit">평가 설정</span>
					</p>
				</div>
				<div class="rightbox">
					<div class="mypage_btn">
						<p class="hello">
							Hellow! <span class="name">에듀스</span>
						</p>
						<span class="icon"></span>
					</div>
					<div class="btnbox">
						<button type="button" class="btn typeB login_btn">
							<img src="img/ico_logout_b.svg" alt="" class="icon">
							<span class="txt">로그아웃</span>
						</button>
					</div>
				</div>
			</header>

			<!-- page tabbox -->
			<div class="page_tabbox">
				<a href="#none" class="tablink">기본정보</a>
				<a href="#none" class="tablink">항목설정</a>
				<a href="#none" class="tablink on">분석설정</a>
				<a href="#none" class="tablink">입력설정</a>
				<a href="#none" class="tablink">API실행</a>
				<a href="#none" class="tablink">결과분석</a>
				<a href="#none" class="tablink">결과보기</a>
			</div>

			<!-- page content -->
			<div class="page_cont">
				<section class="page_section ver2">
					<div class="sec_cont">
						<div class="form_box">
							<div class="form_item form_flex column_ver">
								<p class="form_tit big lead100">역량평가</p>
								<div class="form_cont form_flex">
									<div class="select_box wid528">
										<select class="select select2" data-placeholder="역량평가 미사용" data-class="ver2">
											<option value=""></option>
											<option value="역량평가 미사용" data-class="typeA">역량평가 미사용</option>
											<option value="역량평가 사용" data-class="typeA">역량평가 사용</option>
										</select>
									</div>
								</div>
							</div>
							<div class="form_line"></div>
							<div class="form_item form_flex column_ver">
								<p class="form_tit big lead100">일반설정</p>
								<div class="form_cont form_flex">
									<div class="switch_box reverse label_ver wid256">
										<input type="checkbox" id="switch1" class="input_switch">
										<label for="switch1" class="label_switch ver2">글자수 제한</label>
									</div>
									<div class="switch_box reverse label_ver wid256">
										<input type="checkbox" id="switch2" class="input_switch">
										<label for="switch2" class="label_switch ver2">추가질문 생성</label>
									</div>
								</div>
							</div>
							<div class="form_line"></div>
							<div class="form_item form_flex column_ver">
								<p class="form_tit big lead100">타사지원</p>
								<div class="form_cont form_flex">
									<div class="select_box wid528">
										<select class="select select2" data-placeholder="타사지원 미사용" data-class="ver2">
											<option value=""></option>
											<option value="타사지원 미사용" data-class="typeB">타사지원 미사용</option>
											<option value="타사지원 사용" data-class="typeB">타사지원 사용</option>
										</select>
									</div>
								</div>
							</div>
							<div class="form_line"></div>
							<div class="form_item form_flex column_ver">
								<p class="form_tit big lead100">적합성</p>
								<div class="form_cont form_flex">
									<div class="select_box wid528">
										<select class="select select2" data-placeholder="적합성 미사용" data-class="ver2">
											<option value=""></option>
											<option value="적합성 미사용" data-class="typeC">적합성 미사용</option>
											<option value="적합성 사용" data-class="typeC">적합성 사용</option>
										</select>
									</div>
								</div>
							</div>
							<div class="form_line"></div>
							<div class="form_item form_flex column_ver">
								<p class="form_tit big lead100">블라인드 체크</p>
								<div class="form_cont form_flex">
									<div class="select_box wid528">
										<select class="select select2" data-placeholder="블라인드 체크 미사용" data-class="ver2">
											<option value=""></option>
											<option value="블라인드 체크 미사용" data-class="typeA">블라인드 체크 미사용</option>
											<option value="블라인드 체크 사용" data-class="typeA">블라인드 체크 사용</option>
										</select>
									</div>
								</div>
							</div>
						</div>
					</div>
				</section>
			</div>

			<!-- page bottom -->
			<div class="page_bottom">
				<div class="leftbox">
					<button type="button" class="btn typeB">
						<span class="txt">목록으로</span>
					</button>
				</div>
				<div class="btnbox">
					<button type="button" class="btn typeB">
						<span class="txt">취소</span>
					</button>
					<button type="button" class="btn typeA">
						<span class="txt">저장</span>
					</button>
				</div>
				<div class="rightbox"></div>
			</div>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
