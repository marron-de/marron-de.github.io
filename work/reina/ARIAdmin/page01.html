<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIEP Admin</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap login_wrap">

        <!-- container -->
        <div class="container">

            <section class="section login_section">
                <div class="login_box">
                    <div class="logobox">
						<img src="img/logo.svg" alt="" class="img">
                    </div>
                    <div class="form_box">
                        <div class="form_item input_box">
							<label for="login_id" class="label_text">아이디</label>
                            <input type="text" id="login_id" class="input_text" placeholder="아이디를 입력해주세요">
                        </div>
                        <div class="form_item input_box">
							<label for="login_pwd" class="label_text">비밀번호</label>
							<div class="input_secret">
	                            <input type="password" id="login_pwd" class="input_text" placeholder="비밀번호를 입력해주세요">
								<button type="button" class="secret_btn"></button>
							</div>
							<div class="check_box login_check">
								<input type="checkbox" id="remember_id" class="input_check" checked>
								<label for="remember_id" class="label_check center">
									아이디 기억하기
								</label>
							</div>
                        </div>	
                    </div>
                    <div class="form_btn">
                        <button type="button" class="btn full big gra1 submit_btn">로그인</button>
                    </div>
                </div>
            </section>

			<section class="login_foot">
				<p class="txt">hello@reina.solutions</p>
				<span class="bar"></span>
				<p class="txt">000-1234-5678</p>
			</section>

        </div>

    </div>


    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
