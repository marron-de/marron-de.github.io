<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIEP Admin</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap login_wrap">

        <!-- container -->
        <div class="container">

            <section class="section login_section">
                <div class="login_box">
                    <div class="titbox">
						<p class="title">로그인</p>
                    </div>
                    <div class="form_box">
                        <div class="input_box">
                            <input type="text" id="login_id" class="input_text" placeholder="아이디 입력">
                        </div>
                        <div class="input_box">
                            <input type="password" id="login_pwd" class="input_text" placeholder="비밀번호 입력">
                        </div>
                        <div class="input_flex">
							<div class="input_box">
                            	<input type="password" id="login_code" class="input_text" placeholder="인증요청을 해주세요.">
							</div>
							<button type="button" class="input_btn">
								OTP 인증 요청
							</button>
                        </div>
						<div class="input_flex between">
							<div class="check_box">
								<input type="checkbox" id="remember_id" class="input_check">
								<label for="remember_id" class="label_check center">
									아이디 저장
								</label>
							</div>							
							<div class="sch_box">
								<a href="" class="link">로그인</a>
								<span class="dot"></span>
								<a href="" class="link">사용문의</a>
							</div>
						</div>
                    </div>
                    <div class="btn_box">
                        <button type="button" class="btn full big submit_btn">로그인</button>
                    </div>
                </div>
            </section>

        </div>

    </div>


    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
