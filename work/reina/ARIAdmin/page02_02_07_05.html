<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIEP Admin</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">
		
		<!-- modal -->
        <div class="modal ver2 show" id="saveIntroduction_modal">
            <div class="modal_box">
				<div class="modal_head">
					<p class="modal_title">자기소개서 저장</p>
					<button type="button" class="modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="filter_box">
						<div class="filter_item filter_item1">
							<div class="switch_box reverse full">
								<input type="checkbox" name="switch1" id="switch1" class="input_switch" checked>
								<label for="switch1" class="label_switch">생성질문 포함</label>
							</div>
							<div class="bar"></div>
							<div class="check_wrap">
								<div class="check_box">
									<input type="checkbox" name="check1" id="check1" class="input_check" checked>
									<label for="check1" class="label_check">1차</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check2" id="check2" class="input_check" checked>
									<label for="check2" class="label_check">2차</label>
								</div>
							</div>
						</div>
						<div class="filter_item filter_item2">
							<div class="radio_wrap">
								<div class="radio_box">
									<input type="radio" name="radio1" id="radio1-1" class="input_radio" checked>
									<label for="radio1-1" class="label_radio">개별파일 저장</label>
								</div>
								<div class="radio_box">
									<input type="radio" name="radio1" id="radio1-2" class="input_radio">
									<label for="radio1-2" class="label_radio">통합파일 저장</label>
								</div>
							</div>
						</div>
					</div>	
				</div>
				<div class="modal_btnbox">
					<div class="btn_box">
						<button type="button" class="btn typeB auto modal_btn">
							<span class="txt">취소</span>
						</button>
						<button type="button" class="btn typeA auto modal_btn">
							<span class="txt">확인</span>
						</button>
					</div>
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
