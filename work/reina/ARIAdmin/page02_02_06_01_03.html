<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIEP Admin</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">

		<!-- modal -->
        <div class="modal show" id="wordBlock_modal">
            <div class="modal_box">
				<div class="modal_head">
					<p class="modal_title">단어 블록 지정</p>
					<button type="button" class="modal_close"></button>
				</div>
				<div class="modal_body">					
					<div class="radio_wrap">
						<div class="radio_box">
							<input type="radio" name="radio" id="radio1-1" class="input_radio" checked>
							<label for="radio1-1" class="label_radio">타사지원</label>
						</div>
						<div class="radio_box">
							<input type="radio" name="radio" id="radio1-2" class="input_radio">
							<label for="radio1-2" class="label_radio">자사명오기재</label>
						</div>
					</div>
				</div>
				<div class="modal_btnbox">
					<button type="button" class="btn typeA big full modal_btn">
						<span class="txt">추가</span>
					</button>
				</div>
			</div>
        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
