<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIEP Admin</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap">

        <!-- container -->
        <div class="container">
			
			<div style="flex: 1; width: 100%;height: 100%; display: flex; flex-direction: column; align-items: center;justify-content: center;gap: 1rem;">
				<button type="button" class="btn typeB wid100">
					<img src="img/ico_play.svg" alt="" class="icon">
					<span class="txt">실행</span>
				</button>
				<button type="button" class="btn typeA wid100">
					<img src="img/ico_play.svg" alt="" class="icon white">
					<span class="txt">실행</span>
				</button>
				<button type="button" class="btn typeA wid100">
					<img src="img/gif_loading.gif" alt="" class="gif">
					<span class="txt">진행중</span>
				</button>
				<button type="button" class="btn typeC wid100">
					<img src="img/ico_slashCircle.svg" alt="" class="icon">
					<span class="txt">오류</span>
				</button>
				<button type="button" class="btn typeD wid100">
					<img src="img/ico_refresh_red.svg" alt="" class="icon">
					<span class="txt">재실행</span>
				</button>
				<button type="button" class="btn typeD wid100">
					<img src="img/gif_refresh.gif" alt="" class="gif2">
					<span class="txt">진행중</span>
				</button>
			</div>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
