<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIEP Admin</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- datepicker -->
	<link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

	<!-- Select2 -->
	<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap layout evaluationList_wrap">

		<!-- navigation -->
		<div class="navigation">
			<div class="nav_logo">
                <img src="img/logo.svg" alt="" class="logo">
				<div class="profile">
					<img src="img/nav_profile.png" alt="" class="icon">
				</div>
            </div>
			<ul class="nav">
                <li class="show">
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_nav1.svg" alt=""></span>
                        <span class="title">
							<span class="txt">평가 목록</span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">평가 목록</div>
						</div>
                    </a>
				</li>
                <li>
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_nav2.svg" alt=""></span>
                        <span class="title">
							<span class="txt">평가 등록</span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">평가 등록</div>
						</div>
                    </a>
				</li>
                <li>
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_nav3.svg" alt=""></span>
                        <span class="title">
							<span class="txt">전역 설정</span>
							<span class="human"></span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">전역 설정</div>
						</div>
                    </a>
				</li>
                <li>
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_nav4.svg" alt=""></span>
                        <span class="title">
							<span class="txt">기업 관리</span>
							<span class="human"></span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">기업 관리</div>
						</div>
                    </a>
				</li>
            </ul>
			<ul class="nav nav_bottom">
                <li>
                    <a href="" class="acc_tit">
                        <span class="icon"><img src="img/ico_login_w.svg" alt=""></span>
                        <span class="title">
							<span class="txt">전체 관리자 로그인</span>
							<span class="human"></span>
						</span>
						<div class="tooltip left_center">
							<div class="txtbox">전체 관리자 로그인</div>
						</div>
                    </a>
				</li>
			</ul>
			<button type="button" class="nav_btn"></button>
		</div>

        <!-- container -->
        <div class="container">
			
			<!-- page header -->
			<header class="page_header">
				<div class="leftbox">
					<p class="breadcrumb">
						<span class="tit small">평가 목록</span>
						<span class="arrow"></span>
						<span class="tit">평가 설정</span>
					</p>
				</div>
				<div class="rightbox">
					<div class="mypage_btn">
						<p class="hello">
							Hellow! <span class="name">에듀스</span>
						</p>
						<span class="icon"></span>
					</div>
					<div class="btnbox">
						<button type="button" class="btn typeB login_btn">
							<img src="img/ico_logout_b.svg" alt="" class="icon">
							<span class="txt">로그아웃</span>
						</button>
					</div>
				</div>
			</header>

			<!-- page tabbox -->
			<div class="page_tabbox">
				<a href="#none" class="tablink">기본정보</a>
				<a href="#none" class="tablink">항목설정</a>
				<a href="#none" class="tablink">분석설정</a>
				<a href="#none" class="tablink on">입력설정</a>
				<a href="#none" class="tablink">API실행</a>
				<a href="#none" class="tablink">결과분석</a>
				<a href="#none" class="tablink">결과보기</a>
			</div>

			<!-- page result -->
			<div class="page_result ver2">
				<p class="total">
					<span class="txt">평가대상자</span>
					<span class="num">20</span>
				</p>
			</div>

			<!-- page content -->
			<div class="page_cont">
				<section class="page_section">
					<div class="sec_cont">
						<div class="form_box">
							<div class="form_item form_flex column_ver gap20">
								<p class="form_tit big">
									지원분야 선택
									<span class="required">*</span>
								</p>
								<div class="form_cont">
									<button type="button" class="btn big typeB wid256">
										<img src="img/ico_luggage.svg" alt="" class="icon">
										<span class="txt">지원분야 선택</span>
									</button>
									<p class="alert_txt">
										<img src="img/ico_alert_red.svg" alt="" class="icon">
										<span class="txt">엑셀 데이터에 직무정보가 있을 경우 해당 정보가 우선 입력됩니다.</span>
									</p>
								</div>
							</div>
							<div class="form_line"></div>
							<div class="form_item form_flex column_ver gap20">
								<p class="form_tit big">
									파일 등록
									<span class="required">*</span>
								</p>
								<div class="form_cont">
									<div class="input_filewrap">
										<div class="input_filebox">
											<input type="file" name="file1" id="file1" class="input_file">
											<label for="file1" class="label_file">
												<img src="img/ico_uploadCloud.svg" alt="" class="icon">
												<p class="tit">
													엑셀 파일을 이곳에 드래그&드롭하여 등록하세요.
												</p>
												<div class="button">
													파일 열기
												</div>
											</label>
											<div class="upload_box">
												<button type="button" class="del_btn">
													<img src="img/ico_close.svg" alt="" class="icon">
												</button>
												<img src="img/sample_logo2.png" alt="" class="img">
											</div>
											<button type="button" class="btn typeB auto sample_btn">
												<img src="img/ico_downcircle.svg" alt="" class="icon">
												<span class="txt">샘플 엑셀 다운로드</span>
											</button>
										</div>
										<div class="input_filebox dragover">
											<input type="file" name="file2" id="file2" class="input_file">
											<label for="file2" class="label_file">
												<img src="img/ico_uploadCloud.svg" alt="" class="icon">
												<p class="tit">
													엑셀 파일을 이곳에 드래그&드롭하여 등록하세요.
												</p>
												<div class="button">
													파일 열기
												</div>
											</label>
											<div class="upload_box">
												<button type="button" class="del_btn">
													<img src="img/ico_close.svg" alt="" class="icon">
												</button>
												<img src="img/sample_logo2.png" alt="" class="img">
											</div>
											<button type="button" class="btn typeB auto sample_btn">
												<img src="img/ico_downcircle.svg" alt="" class="icon">
												<span class="txt">샘플 엑셀 다운로드</span>
											</button>
										</div>
									</div>
								</div>
							</div>
							<div class="form_line"></div>
							<div class="form_item form_flex column_ver">
								<p class="form_tit big">입력 후 API실행</p>
								<div class="form_cont">
									<div class="switch_box reverse label_ver wid256">
										<div class="tooltip_box full_h hover">
											<button type="button" class="tooltip_btn">
												<img src="img/ico_help_alert.svg" alt="" class="icon">
											</button>
											<div class="tooltip down_center">
												<div class="txtbox">
													추가 입력일 경우 개별로 실행해주세요.
												</div>
											</div>
										</div>
										<input type="checkbox" id="switch1" class="input_switch" checked>
										<label for="switch1" class="label_switch ver2">추가질문 생성</label>
									</div>
								</div>
							</div>
						</div>
					</div>
				</section>
			</div>

			<!-- page bottom -->
			<div class="page_bottom">
				<div class="leftbox">
					<button type="button" class="btn typeB">
						<span class="txt">목록으로</span>
					</button>
				</div>
				<div class="btnbox">
					<button type="button" class="btn typeB">
						<span class="txt">취소</span>
					</button>
					<button type="button" class="btn typeA">
						<span class="txt">저장</span>
					</button>
				</div>
				<div class="rightbox"></div>
			</div>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
