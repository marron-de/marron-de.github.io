<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST TREFF</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap treffLogin_wrap">

        <!-- container -->
        <div class="container padding">

			<!-- treff header -->
			<header class="treff_header">
				<div class="logobox">
					<img src="img/TREFF_logo.png" alt="" class="logo">
				</div>
				<div class="menubox">

				</div>
				<div class="sidebox"></div>
			</header>

			<!-- treff layout -->
			<div class="treff_layout">

				<section class="section login_section">
					<div class="login_box">
						<div class="titbox">
							<p class="title">Integrated Control Center</p>
						</div>
						<div class="form_box">
							<div class="input_box">
								<input type="text" id="login_id" class="input_text" placeholder="아이디 입력">
								<div class="input_flex between">
									<p class="alert_txt">
										<img src="img/ico_alert2.png" alt="" class="icon">
										<span class="txt">배정받은 감독관 ID로 로그인 해주시기 바랍니다. </span>
									</p>						
									<div class="sch_box">
										<a href="mailto:hello@reina.solutions" class="link">로그인 문의</a>
									</div>
								</div>
							</div>
						</div>
						<div class="btn_box">
							<button type="button" class="btn full big submit_btn">로그인</button>
						</div>
					</div>
				</section>
				
			</div>


        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
