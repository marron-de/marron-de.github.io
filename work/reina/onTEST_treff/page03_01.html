<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST TREFF</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap controlScreen_wrap mobPage">

        <!-- container -->
        <div class="container padding">

			<header class="header">
				<div class="h_inner">
					<div class="logobox">
						<img src="img/TREFF_logo.png" alt="" class="logo">
					</div>
					<div class="sidebox">
						<button type="button" class="btn auto land_view">접속종료</button>
					</div>
				</div>
			</header>

            <section class="section h_full control_section">
				<div class="portrait_box port_view">
					<div class="titbox">
						<p class="tit">감독관 통제 시스템</p>
						<p class="desc">onTEST Supervisor Control System</p>
					</div>
					<div class="txtbox">
						<img src="img/ico_landscape.png" alt="" class="icon">
						<p class="tit">스마트폰을 가로로 거치해주시기 바랍니다.</p>
					</div>
				</div>
				<div class="control_box land_view">
					<div class="leftbox">
						<div class="webcam_box">
							<button type="button" class="icon_btn mike_btn">
								<img src="img/ico_mike_btn.png" alt="" class="icon">
							</button>
						</div>
						<div class="id_box">
							<p class="tit">응시자 ID</p>
							<p class="id">A292513</p>
						</div>
					</div>
					<div class="rightbox">
						<div class="chatbox">	
							<div class="chatitem other_chat">
								<div class="chat">
									<div class="profile">
										<img src="img/chat_profile_basic.png" alt="" class="profile_img">
									</div>
									<div class="txtbox">
										<div class="msgbox">
											<div class="msg">
												<span class="txt">
													박수한님, 5분 뒤 면접 진행이 있을 예정입니다. <br>
													준비해주시기 바랍니다.
												</span>
											</div>
										</div>	
										<div class="msgbox">
											<div class="msg">
												<span class="txt">
													준비해주시기 바랍니다.
												</span>
											</div>
										</div>	
									</div>
								</div>
							</div>	
						</div>
						<div class="alert_text typeB">
							<img src="img/ico_alert_red.png" alt="" class="icon">
							<p class="txt">
								화면이 정상적이지 않다면, 새로고침 해주세요. <br>
								시험이 종료되면 접속종료를 누른 다음, 브라우저를 닫아주세요.
							</p>
						</div>
					</div>
				</div>
            </section>

			<div class="footer">
				<div class="f_inner">
					<p class="f_txt">hello@reina.solutions</p>
					<span class="f_bar"></span>
					<p class="f_txt">02-323-7980</p>
				</div>
			</div>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
