    <title>onTEST 모바일</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

        <!-- container -->

			<header class="header">
				<div class="h_inner">
					<div class="logobox">
						<img src="img/logo.png" alt="" class="logo">
					</div>
					<div class="sidebox">
						<div class="timer">
							<img src="img/ico_timer.png" alt="" class="icon">
							<div class="clock">
								<span class="min">01</span>
								<span class="dot">:</span>
								<span class="sec">39</span>
							</div>
						</div>
					</div>
				</div>
			</header>

													</span>

									<img src="img/ico_arrowsend.png" alt="" class="icon">
