<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST 모바일</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap login_wrap">

        <!-- container -->
        <div class="container padding">

			<header class="header">
				<div class="h_inner">
					<div class="logobox">
						<img src="img/logo.png" alt="" class="logo">
					</div>
					<div class="sidebox"></div>
				</div>
			</header>

            <section class="section h_full login_section">
				<div class="page_inner">
					<div class="login_box">
						<div class="titbox">
							<p class="tit">25년 국립어학원 온라인 시험</p>
							<p class="desc">2025년 12월 23일 16:00</p>
						</div>
						<div class="form_box">
							<div class="input_box">
								<input type="text" class="input_text" placeholder="아이디 입력해주세요.">
							</div>
							<div class="input_box">
								<input type="password" class="input_text" placeholder="비밀번호를 입력해주세요.">
							</div>
						</div>
						<div class="btn_box">
							<button type="button" class="btn full submit_btn">응시하기</button>
						</div>
						<p class="alert_text typeA">
							<img src="img/ico_alert_blue.png" alt="" class="icon">
							<span class="txt">
								온라인 시험은 크롬 브라우저에 최적화되어 있습니다. <br>
								크롬 브라우저로 접속하기를 권장합니다.
							</span>
						</p>
					</div>
				</div>
            </section>

			<div class="footer">
				<div class="f_inner">
					<p class="f_txt">장애 문의</p>
					<span class="f_bar"></span>
					<p class="f_txt">hello@reina.solutions</p>
				</div>
			</div>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
