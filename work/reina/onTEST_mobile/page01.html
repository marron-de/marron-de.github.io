<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST 모바일</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap examSelect_wrap">

        <!-- container -->
        <div class="container padding">

			<header class="header">
				<div class="h_inner">
					<div class="logobox">
						<img src="img/logo.png" alt="" class="logo">
					</div>
					<div class="sidebox"></div>
				</div>
			</header>

            <section class="section h_full exam_section">
				<div class="page_inner">
					<div class="exam_box">
						<div class="titbox">
							<p class="tit">감독할 시험을 선택해주세요.</p>
						</div>
						<div class="form_box">
							<div class="check_wrap">
								<div class="check_box checked">
									<input type="checkbox" name="check" id="check_1" class="input_check" checked>
									<label for="check_1" class="label_check">2025년 국립어학원 온라인 시험</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check" id="check_2" class="input_check">
									<label for="check_2" class="label_check">2025년 국립어학원 온라인 시험</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check" id="check_3" class="input_check">
									<label for="check_3" class="label_check">2025년 국립어학원 온라인 시험</label>
								</div>
								<div class="check_box">
									<input type="checkbox" name="check" id="check_4" class="input_check">
									<label for="check_4" class="label_check">2025년 국립어학원 온라인 시험</label>
								</div>
							</div>
						</div>
						<div class="btn_box">
							<button type="button" class="btn full">선택</button>
						</div>
					</div>
				</div>
            </section>

			<div class="footer">
				<div class="f_inner">
					<p class="f_txt">장애 문의</p>
					<span class="f_bar"></span>
					<p class="f_txt">hello@reina.solutions</p>
				</div>
			</div>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
