<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST 모바일</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
    <div class="wrap termination_wrap">

        <!-- container -->
        <div class="container padding">

			<header class="header">
				<div class="h_inner">
					<div class="logobox">
						<img src="img/logo.png" alt="" class="logo">
					</div>
					<div class="sidebox"></div>
				</div>
			</header>

			<section class="section h_full termination_section">
				<div class="page_inner">
					<div class="termination_box">
						<div class="imgbox">
							<img src="img/termination_img.png" alt="" class="img">
						</div>
						<div class="titbox">
							<p class="tit">
								시험이 모두 종료되었습니다. <br>
								브라우저를 닫아주시기 바랍니다.
							</p>
						</div>
						<div class="resultbox">
							<p class="tit">25년 온라인 시험</p>
							<div class="result">
								<p class="left">내가 푼 문항</p>
								<p class="right">30/30 (100%)</p>
							</div>
						</div>
						<div class="alert_text typeA">
							<img src="img/ico_alert_blue.png" alt="" class="icon">
							<p class="txt">
								여기에는 안내 사항이 표시됩니다. <br>
								여기에는 안내 사항이 표시됩니다.
							</p>
						</div>
					</div>
				</div>
            </section>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
