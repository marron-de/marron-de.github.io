<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>onTEST 모바일화상감시</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	
    <link href="css/Pretendard.css">

</head>

<body>

    
	<div class="wrap sessionInfo_wrap">

        <!-- container -->
        <div class="container padding">

			<header class="header">
				<div class="h_inner">
					<div class="logobox">
						<img src="img/logo.png" alt="" class="logo">
					</div>
					<div class="sidebox">
						<button type="button" class="btn auto">접속종료</button>
					</div>
				</div>
			</header>

            <section class="section h_full session_section">
				<div class="page_inner">
					<div class="session_box">
						<div class="picturebox">
							<div class="imgbox">
								<img src="img/preview_bg.png" alt="" class="img default">
							</div>
							<div class="labelbox">
								<p class="tit">응시자 ID</p>
								<p class="num">A292513</p>
							</div>
						</div>
						<div class="txtbox">
							<div class="note_box">
								<div class="title">
									<img src="img/ico_alert.png" alt="" class="icon">
									<span class="txt">안내사항</span>
								</div>
								<div class="descbox">
									<p class="desc">
										<span class="num">1. </span>
										<span class="txt">
											예시 화면처럼 모니터와 응시자의 얼굴 그리고 손이 나올 수 있도록 올바르게 거치합니다. 
										</span>
									</p>
									<p class="desc">
										<span class="num">2.</span>
										<span class="txt">
											감독관의 목소리가 들리지 않는다면 볼륨을 높이거나 사용 중인 <br class="port_view">다른 모든 앱을 종료해야 합니다. 
										</span>
									</p>
								</div>
							</div>
							<div class="alert_text typeB">
								<img src="img/ico_alert_red.png" alt="" class="icon">
								<p class="txt">
									스마트폰을 가로로 거치해주시기 바랍니다. <br>시험이 종료되면 접속종료를 누른 다음, 브라우저를 닫아주세요.
								</p>
							</div>
						</div>
					</div>
				</div>
            </section>

			<div class="footer">
				<div class="f_inner">
					<p class="f_txt">hello@reina.solutions</p>
					<span class="f_bar"></span>
					<p class="f_txt">02-323-7980</p>
				</div>
			</div>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
