<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유니온소프트</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- Google Icon -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />


    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="page_wrap h100">		

		<!-- header -->
		<header class="header">
			<div class="leftbox">
				<button type="button" class="back_btn">
					<span class="material-symbols-outlined icon">arrow_back</span>
				</button>
			</div>
			<div class="h_title">유니온소프트 • 직원호출</div>
			<div class="rightbox"></div>
		</header>

		<!-- top area -->
		<div class="top_area">
			<div class="leftbox">
				<div class="tblnum">
					<p class="tit">테이블 번호</p>
					<p class="num">010</p>
				</div>
			</div>
			<div class="rightbox">
				<div class="character">
					<img src="img/character.png" alt="" class="img">
				</div>
			</div>
		</div>

		<!-- contents -->
		<div class="contents callAdd_wrap">
			<section class="section callAdd_sec1 inner">
				<div class="request_box">
					<div class="item">
						<p class="title">물 좀 주세요</p>
						<div class="controlbox">
							<button type="button" class="control_btn minus_btn">
								<span class="material-symbols-outlined icon">do_not_disturb_on</span>
							</button>
							<input type="text" class="count_input" value="1">
							<button type="button" class="control_btn plus_btn">
								<span class="material-symbols-outlined icon">add_circle</span>
							</button>
						</div>
					</div>
					<div class="item">
						<p class="title">냅킨 좀 주세요</p>
						<div class="controlbox">
							<button type="button" class="control_btn minus_btn">
								<span class="material-symbols-outlined icon">do_not_disturb_on</span>
							</button>
							<input type="text" class="count_input" value="1">
							<button type="button" class="control_btn plus_btn">
								<span class="material-symbols-outlined icon">add_circle</span>
							</button>
						</div>
					</div>
					<div class="add_item">
						<button type="button" class="add_request">
							<span class="material-symbols-outlined icon">add_2</span>
							<span class="txt">요청사항 추가</span>
						</button>
					</div>
				</div>
			</section>
		</div>

		<!-- fixed bottom -->
		<div class="fixed_bottom ver2">
			<div class="inner">
				<div class="request_box">
					<div class="leftbox">
						<p class="tit">요청사항</p>
					</div>
					<div class="rightbox">
						<p class="price">2건</p>
					</div>
				</div>
				<button type="button" class="order_btn">요청하기</button>
			</div>
		</div>

		<!-- 삭제 팝업 -->
		<div id="delete_popup" class="modal">
			<div class="modal_box">
				<div class="modal_head">
					<p class="modal_tit">요청을 삭제하시겠습니까?</p>
				</div>
				<div class="modal_body">
					<p class="modal_desc">
						선택하신 요청을 삭제 하시겠습니까?
					</p>
				</div>
				<div class="modal_foot">
					<div class="modal_btnbox">
						<button type="button" class="modal_btn typeA modal_close">취소</button>
						<button type="button" class="modal_btn typeC">삭제</button>
					</div>
				</div>
			</div>
		</div>

	</div>


    <!-- JS -->
    <script src="js/common.js"></script>


</body>

</html>
