<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유니온소프트</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- Google Icon -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />


    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="page_wrap">		

		<!-- header -->
		<header class="header">
			<div class="leftbox">
				<button type="button" class="back_btn">
					<span class="material-symbols-outlined icon">arrow_back</span>
				</button>
			</div>
			<div class="h_title">유니온소프트 • 주문서</div>
			<div class="rightbox"></div>
		</header>

		<!-- top area -->
		<div class="top_area">
			<div class="leftbox">
				<div class="tblnum">
					<p class="tit">테이블 번호</p>
					<p class="num">010</p>
				</div>
			</div>
			<div class="rightbox">
				<div class="character">
					<img src="img/character.png" alt="" class="img">
				</div>
			</div>
		</div>

		<!-- contents -->
		<div class="contents payment_wrap">
			<section class="section payment_sec1 inner">
				<div class="payment_list">
					<div class="menu_box">
						<div class="item">
							<div class="imgbox">
								<img src="img/prd_thum1.png" alt="" class="thum">
							</div>
							<div class="txtbox">
								<div class="infobox">
									<p class="name">햄치즈 샌드위치</p>
									<p class="opt">아메리카노 추가(HOT)</p>
									<p class="price">7,000원</p>
								</div>
								<div class="controlbox">
									<button type="button" class="control_btn minus_btn">
										<span class="material-symbols-outlined icon">do_not_disturb_on</span>
									</button>
									<input type="text" class="count_input" value="1">
									<button type="button" class="control_btn plus_btn">
										<span class="material-symbols-outlined icon">add_circle</span>
									</button>
								</div>
							</div>
						</div>
						<div class="item">
							<div class="imgbox">
								<img src="img/prd_thum1.png" alt="" class="thum">
							</div>
							<div class="txtbox">
								<div class="infobox">
									<p class="name">햄치즈 샌드위치</p>

									<button type="button" class="control_btn minus_btn">

									<input type="text" class="count_input" value="1">
									<button type="button" class="control_btn plus_btn">
										<span class="material-symbols-outlined icon">add_circle</span>
									</button>
								</div>
							</div>
						</div>
						<div class="item">
							<div class="imgbox">
								<img src="img/prd_thum1.png" alt="" class="thum">
							</div>
							<div class="txtbox">
								<div class="infobox">
									<p class="name">햄치즈 샌드위치</p>
									<p class="price">7,000원</p>
								</div>
								<div class="controlbox">
									<button type="button" class="control_btn minus_btn">
										<span class="material-symbols-outlined icon">do_not_disturb_on</span>
									</button>
									<input type="text" class="count_input" value="1">
									<button type="button" class="control_btn plus_btn">
										<span class="material-symbols-outlined icon">add_circle</span>
									</button>
								</div>
							</div>
						</div>
						<div class="item">
							<div class="imgbox">
								<img src="img/prd_thum1.png" alt="" class="thum">
							</div>
							<div class="txtbox">
								<div class="infobox">
									<p class="name">햄치즈 샌드위치</p>
									<p class="price">7,000원</p>
								</div>
								<div class="controlbox">
									<button type="button" class="control_btn minus_btn">
										<span class="material-symbols-outlined icon">do_not_disturb_on</span>
									</button>
									<input type="text" class="count_input" value="1">
									<button type="button" class="control_btn plus_btn">
										<span class="material-symbols-outlined icon">add_circle</span>
									</button>
								</div>
							</div>
						</div>			

						<div class="item hide">
							<div class="imgbox">
								<img src="img/prd_thum1.png" alt="" class="thum">
							</div>
							<div class="txtbox">
								<div class="infobox">
									<p class="name">햄치즈 샌드위치</p>
									<p class="price">7,000원</p>
								</div>
								<div class="controlbox">
									<button type="button" class="control_btn minus_btn">
										<span class="material-symbols-outlined icon">do_not_disturb_on</span>
									</button>
									<input type="text" class="count_input" value="1">
									<button type="button" class="control_btn plus_btn">

									</button>
									<input type="text" class="count_input" value="1">
									<button type="button" class="control_btn plus_btn">
										<span class="material-symbols-outlined icon">add_circle</span>
									</button>
								</div>
							</div>
						</div>						
					</div>
					<button type="button" class="more_btn" onclick="moreView(this);">
						<span class="txt">2건 더보기</span>
						<span class="material-symbols-outlined icon">keyboard_arrow_up</span>
					</button>
					<div class="total_box">
						<div class="item">
							<span class="tit">
								<span class="txt">주문금액</span>
							</span>
							<span class="price">36,500원</span>
						</div>
						<div class="item">
							<span class="tit">
								<span class="txt">포인트 사용</span>
								<span class="prd_tag type_optional">포인트 조회</span>
							</span>
							<span class="price">0원</span>
						</div>
						<div class="item last">

								<span class="txt">결제금액</span>
							</span>
							<span class="price">36,500원</span>
						</div>
					</div>
				</div>
				<div class="method_box">
					<div class="titbox">
						<p class="title">결제수단</p>
						<div class="check_box">
							<input type="checkbox" name="useNextOrder" id="useNextOrder" class="input">
							<label for="useNextOrder" class="label">
								<span class="material-symbols-outlined icon">check</span>
								<span class="txt">다음 주문에서도 사용</span>
							</label>
						</div>
					</div>
					<div class="listbox">
						<div class="item">
							<div class="radio_box">
								<input type="radio" name="payMethod" id="payMethod1" class="input_radio">
								<label for="payMethod1" class="label_radio kakao_label">
									<img src="img/badge_kakao.png" alt="" class="icon">
									<span class="txt">카카오페이</span>
								</label>
							</div>
							<div class="bottom_txt">
								페이머니로 결제하면 <span class="color">페이포인트 2번</span> 적립!
							</div>
						</div>
						<div class="item">
							<div class="radio_box">
								<input type="radio" name="payMethod" id="payMethod2" class="input_radio">
								<label for="payMethod2" class="label_radio">
									<span class="txt">간편결제</span>
								</label>
							</div>
							<div class="pay_list">
								<div class="pay_radio_box">
									<input type="radio" name="payMethodPay" id="payMethodPay1" class="input" checked>
									<label for="payMethodPay1" class="label">
										<span class="icon">
											<img src="img/pay_kakao.png" alt="" class="img">
										</span>
										<span class="txt">카카오페이</span>
										<span class="material-symbols-outlined check">check</span>
									</label>
								</div>
								<div class="pay_radio_box">
									<input type="radio" name="payMethodPay" id="payMethodPay2" class="input">
									<label for="payMethodPay2" class="label">
										<span class="icon">
											<img src="img/pay_naver.png" alt="" class="img">
										</span>
										<span class="txt">네이버페이</span>
										<span class="material-symbols-outlined check">check</span>
									</label>
								</div>
							</div>
						</div>
						<div class="item">
							<div class="radio_box">
								<input type="radio" name="payMethod" id="payMethod3" class="input_radio">
								<label for="payMethod3" class="label_radio">
									<span class="txt">신용 · 체크카드</span>
								</label>
							</div>
							<div class="pay_list">
								<div class="pay_radio_box">
									<input type="radio" name="payMethodCard" id="payMethodCard1" class="input" checked>
									<label for="payMethodCard1" class="label">
										<span class="icon"></span>
										<span class="txt">삼성카드</span>
										<span class="material-symbols-outlined check">check</span>
									</label>
								</div>
								<div class="pay_radio_box">
									<input type="radio" name="payMethodCard" id="payMethodCard2" class="input">
									<label for="payMethodCard2" class="label">
										<span class="icon"></span>
										<span class="txt">현대카드</span>

									<label for="payMethodCard3" class="label">
										<span class="icon"></span>
										<span class="txt">신한카드</span>
										<span class="material-symbols-outlined check">check</span>
									</label>
								</div>
							</div>
						</div>
					</div>

		<!-- fixed bottom -->
		<div class="fixed_bottom ver4">
			<div class="inner">
				<button type="button" class="order_btn">36,500원 주문하기</button>
				<p class="order_desc">결제완료 후 주문이 시작돼요</p>

    <script src="js/common.js"></script>
