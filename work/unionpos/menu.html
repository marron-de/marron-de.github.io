<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유니온소프트</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- Google Icon -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />


    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="page_wrap">		

		<!-- header -->
		<header class="header">
			<div class="leftbox">
				<button type="button" class="back_btn">
					<span class="material-symbols-outlined icon">arrow_back</span>
				</button>
			</div>
			<div class="h_title">유니온소프트</div>
			<div class="rightbox">
				<a href="order_list_active.html" class="h_link">주문내역</a>
			</div>
		</header>

		<!-- contents -->
		<div class="contents menu_wrap">
			<section class="section menu_sec1">
				<div class="menu_info">
					<div class="imgbox">
						<img src="img/prd_img.png" alt="" class="img">
					</div>
					<div class="txtbox">
						<p class="name">닭가슴살 치폴레 샌드위치</p>
						<div class="descbox">
							<p class="desc">
								닭가슴살, 사과, 토마토, 수제소스, 치폴레마요 소스, 야채, 양파, 피클이 들어간 샌드위치 <br>
								닭가슴살, 사과, 토마토, 수제소스, 치폴레마요 소스, 야채, 양파, 피클이 들어간 샌드위치
							</p>
							<button type="button" class="more_btn">
								<span class="material-symbols-outlined filled icon">arrow_drop_down_circle</span>
							</button>
						</div>
						<p class="price">8,000원</p>
					</div>
				</div>
				<div class="menu_opt_list">
					<div class="opt_box">
						<p class="title">
							<span class="txt">세트 업그레이드</span>
							<span class="prd_tag type_required">필수</span>
						</p>
						<div class="listbox">
							<div class="item">
								<div class="radio_box">
									<input type="radio" id="prd_opt1-1" class="input_radio" name="prd_opt1" checked>
									<label for="prd_opt1-1" class="label_radio">
										<span class="tit">아메리카노 추가 (HOT)</span>
										<span class="desc">+1,500원</span>
									</label>
								</div>
							</div>
							<div class="item">
								<div class="radio_box">
									<input type="radio" id="prd_opt1-2" class="input_radio" name="prd_opt1">
									<label for="prd_opt1-2" class="label_radio">
										<span class="tit">아메리카노 추가 (ICE)</span>
										<span class="desc">+1,500원</span>
									</label>
								</div>
							</div>
						</div>
					</div>
					<div class="opt_box">
						<p class="title">
							<span class="txt">제외 야채</span>
							<span class="prd_tag type_optional">선택</span>
						</p>
						<div class="listbox">
							<div class="item">
								<div class="check_box">
									<input type="checkbox" id="prd_opt2-1" class="input_check" name="prd_opt2" checked>
									<label for="prd_opt2-1" class="label_check">
										<span class="tit">양파 제외</span>
										<span class="desc">+0원</span>
									</label>
								</div>							
								<div class="controlbox">
									<button type="button" class="control_btn minus_btn">
										<span class="material-symbols-outlined icon">do_not_disturb_on</span>
									</button>
									<input type="number" class="count_input" value="99" min="1" max="99">
									<button type="button" class="control_btn plus_btn">
										<span class="material-symbols-outlined icon">add_circle</span>
									</button>
								</div>	
							</div>
							<div class="item">
								<div class="check_box">
									<input type="checkbox" id="prd_opt2-2" class="input_check" name="prd_opt2" disabled>
									<label for="prd_opt2-2" class="label_check">
										<span class="tit">피클 제외</span>
										<span class="desc">품절</span>
									</label>
								</div>		
							</div>
							<div class="item">
								<div class="check_box">
									<input type="checkbox" id="prd_opt2-3" class="input_check" name="prd_opt2" disabled>
									<label for="prd_opt2-3" class="label_check">
										<span class="tit">
											피망 제외 <br>
											<span class="small">16:00 부터 주문 가능</span>
										</span>
										<span class="desc">+0원</span>
									</label>
								</div>		
							</div>
						</div>
					</div>
					<div class="opt_box">
						<p class="title">
							<span class="txt">제외 야채</span>
							<span class="prd_tag type_optional">선택</span>
						</p>
						<div class="listbox">
							<div class="item">
								<div class="check_box">
									<input type="checkbox" id="prd_opt3-1" class="input_check" name="prd_opt3" checked>
									<label for="prd_opt3-1" class="label_check">
										<span class="tit">양파 제외</span>
										<span class="desc">+0원</span>
									</label>
								</div>			
							</div>
							<div class="item">
								<div class="check_box">
									<input type="checkbox" id="prd_opt3-2" class="input_check" name="prd_opt3" disabled>
									<label for="prd_opt3-2" class="label_check">
										<span class="tit">피클 제외</span>
										<span class="desc">품절</span>
									</label>
								</div>		
							</div>
							<div class="item">
								<div class="check_box">
									<input type="checkbox" id="prd_opt3-3" class="input_check" name="prd_opt3" disabled>
									<label for="prd_opt3-3" class="label_check">
										<span class="tit">
											피망 제외 <br>
											<span class="small">16:00 부터 주문 가능</span>
										</span>
										<span class="desc">+0원</span>
									</label>
								</div>		
							</div>
						</div>
					</div>
					<div class="count_box">
						<p class="tit">수량</p>						
						<div class="controlbox">
							<button type="button" class="control_btn minus_btn">
								<span class="material-symbols-outlined icon">remove</span>
							</button>
							<input type="number" class="count_input" value="99" min="1" max="99">
							<button type="button" class="control_btn plus_btn disabled">
								<span class="material-symbols-outlined icon">add</span>
							</button>
						</div>	
					</div>
				</div>
			</section>
		</div>

		<!-- fixed bottom -->
		<div class="fixed_bottom show">
			<div class="inner">
				<button type="button" class="order_btn">14,000원 · 1개 담기</button>
			</div>
		</div>

	</div>


    <!-- JS -->
    <script src="js/common.js"></script>


</body>

</html>
