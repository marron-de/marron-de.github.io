<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유니온소프트</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- Google Icon -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />


    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="page_wrap">		

		<!-- contents -->
		<div class="contents main_wrap">
			<div class="main_topimg">
				<img src="img/intro_img.jpg">
			</div>
			<section class="section main_sec1">
				<div class="inner">
					<div class="titbox">
						<p class="title">유니온소프트</p>
					</div>
					<div class="top_box">
						<p class="tbl_no">
							Table No.<span class="num">10</span>
						</p>
						<button type="button" class="lang_btn" onclick="lang_popup()">
							<span class="material-symbols-outlined icon" >language</span>
							<span class="txt">LANGUAGE</span>
						</button>
					</div>
					<div class="menu_box">
						<div class="item item1">
							<a href="order.html" class="link">
								<span class="material-symbols-outlined filled icon">table_restaurant</span>
								<span class="tit">주문하기</span>
								<span class="en_tit">Order</span>
							</a>
						</div>
						<div class="item item2">
							<a href="call_staff.html" class="link">
								<span class="material-symbols-outlined filled icon">notifications_active</span>
								<span class="tit">직원호출</span>
								<span class="en_tit">Call out Staff</span>
							</a>
						</div>
					</div>
					<p class="order_desc">주문하신 상품변경/취소는 직원요청을 선택해주세요.</p>
					<div class="bottom_box">
						<a href="order_list_active.html" class="orderList_btn">
							<span class="material-symbols-outlined icon">receipt_long</span>
							<span class="txt">주문내역</span>
						</a>
					</div>
				</div>
			</section>
			<section class="section main_sec2">
				<div class="inner">
					<div class="titbox">
						<span class="material-symbols-outlined icon">campaign</span>
						<span class="tit">이용안내</span>
					</div>
					<div class="contbox">
						<p class="txt">
							반갑습니다 고객님 <br>
							스마트오더로 주문 및 호출을 편리하게 할 수 있습니다. <br>
							즐거운 시간 되세요
						</p>
						<p class="txt">WIFI 안내</p>
					</div>
				</div>
			</section>
		</div>

	</div>

	<!-- 언어선택 -->
	<div id="lang_popup" class="popup lang_popup">
		<div class="popup_box">
			<ul class="lang_list">
				<li class="lang_item on">한국어</li>
				<li class="lang_item">English</li>
				<li class="lang_item">中國語</li>
				<li class="lang_item">日本語</li>
				<li class="lang_item lang_cancel">취소</li>
			</ul>
		</div>
	</div>


    <!-- JS -->
    <script src="js/common.js"></script>


</body>

</html>
