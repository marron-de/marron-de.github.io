<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유니온소프트</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- Google Icon -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />


    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">

</head>

<body>


	<div class="page_wrap h100">		

		<!-- header -->
		<header class="header">
			<div class="leftbox">
				<button type="button" class="back_btn">
					<span class="material-symbols-outlined icon">arrow_back</span>
				</button>
			</div>
			<div class="h_title">유니온소프트 • 주문내역</div>
			<div class="rightbox"></div>
		</header>

		<!-- top area -->
		<div class="top_area">
			<div class="leftbox">
				<div class="tblnum">
					<p class="tit">테이블 번호</p>
					<p class="num">010</p>
				</div>
			</div>
			<div class="rightbox">
				<div class="character">
					<img src="img/character.png" alt="" class="img">
				</div>
			</div>
		</div>

		<!-- contents -->
		<div class="contents orderList_wrap">
			<section class="section orderList_sec1 inner">
				<div class="order_box">
					<div class="item">
						<div class="imgbox">
							<img src="img/prd_thum1.png" alt="" class="thum">
						</div>
						<div class="txtbox">
							<div class="infobox">
								<p class="name">햄치즈 샌드위치</p>
								<p class="opt">아메리카노 추가(HOT)</p>
								<p class="price">7,000원</p>
							</div>
							<p class="count">1개</p>
						</div>
					</div>
					<div class="item">
						<div class="imgbox">
							<img src="img/prd_thum1.png" alt="" class="thum">
						</div>
						<div class="txtbox">
							<div class="infobox">
								<p class="name">햄치즈 샌드위치</p>
								<p class="opt">아메리카노 추가(HOT)</p>
								<p class="price">7,000원</p>
							</div>
							<p class="count">1개</p>
						</div>
					</div>
					<div class="item">
						<div class="imgbox">
							<img src="img/prd_thum1.png" alt="" class="thum">
						</div>
						<div class="txtbox">
							<div class="infobox">
								<p class="name">햄치즈 샌드위치</p>
								<p class="opt">아메리카노 추가(HOT)</p>
								<p class="price">7,000원</p>
							</div>
							<p class="count">1개</p>
						</div>
					</div>
				</div>
			</section>
		</div>

		<!-- fixed bottom -->
		<div class="fixed_bottom ver2">
			<div class="inner ver3">
				<div class="total_box">
					<div class="leftbox">
						<p class="tit">총 주문금액</p>
						<p class="count">총 3건</p>
					</div>
					<div class="rightbox">
						<p class="price">36,500원</p>
					</div>
				</div>
				<button type="button" class="order_btn">확인</button>
			</div>
		</div>

	</div>


    <!-- JS -->
    <script src="js/common.js"></script>


</body>

</html>
