<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에듀스</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

    <!-- Swiper -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/Pretendard.css">

	<!-- 추가 CSS-->
    <link rel="stylesheet" href="css/add_style.css">

</head>

<body>


    <div class="wrap main_wrap" data-login="login">
		
        <!-- header -->
        <header class="header">
            <div class="h_inner inner">
                <div class="h_left">
                    <div class="h_logo"><img src="img/logo.png" alt=""></div>
                </div>
                <div class="h_title"></div>
                <div class="h_right">
                    <button type="button" class="btn clear_btn mypage_btn"></button>
                    <button type="button" class="btn clear_btn menu_btn"></button>
                </div>
            </div>
        </header>
		<!-- //header -->


		<!-- main -->
        <div class="container">
            <section class="section sec1">
                <div class="swiper ms1_swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide row">
                            <div class="bar left"></div>
                            <div class="txtbox">
                                <p class="tit">EDUCE</p>
                                <p class="tit2">취업성공전략</p>
                                <button type="button" class="btn">자세히 보기</button>
                            </div>
                            <div class="bar right"></div>
                        </div>
                        <div class="swiper-slide column">
                            <div class="bar up"></div>
                            <div class="txtbox">
                                <p class="tit">EDUCE</p>
                                <p class="tit2">자기소개서 면접</p>
                                <button type="button" class="btn">자세히 보기</button>
                            </div>
                            <div class="bar down"></div>
                        </div>
                        <div class="swiper-slide row">
                            <div class="bar left"></div>
                            <div class="txtbox">
                                <p class="tit">EDUCE</p>
                                <p class="tit2">직무적성검사</p>
                                <button type="button" class="btn">자세히 보기</button>
                            </div>
                            <div class="bar right"></div>
                        </div>
                        <div class="swiper-slide column">
                            <div class="bar up"></div>
                            <div class="txtbox">
                                <p class="tit">EDUCE</p>
                                <p class="tit2">AI · 비대면 플랫폼</p>
                                <button type="button" class="btn">자세히 보기</button>
                            </div>
                            <div class="bar down"></div>
                        </div>
                    </div>
                    <div class="swiper-pagination pagination"></div>
                </div>
            </section>
        </div>
		<!-- //main -->
	

		<!-- AI 버튼 -->
		<button type="button" id="aiBtn" class="aiBtn">
			<span class="icon"></span>
			<div class="msgbox">
				<div class="msg"><p>취업 궁금증, 이제 AI와 나누세요!</p></div>
			</div>
		</button>
		<!-- // AI 버튼 -->

    </div>


    <!-- JS -->
    <script src="js/common.js"></script>
    <script src="js/main.js"></script>

	<!-- 추가 JS-->
    <script src="js/add_common.js"></script>


</body>

</html>
