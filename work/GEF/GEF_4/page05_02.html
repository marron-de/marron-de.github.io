<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모두의 기빙라이프</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- datepicker -->
    <link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

    <!-- nouislider -->
    <link rel="stylesheet" href="css/nouislider.css">
    <script src="js/nouislider.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"  rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

</head>

<body>


    <div class="wrap login_wrap">

        <!-- container -->
        <div class="container">

            <section class="section join_sec2">		
				<div class="inner">					
					<div class="login_header">
						<div class="logo">
							<img src="img/login_logo.png" alt="" class="img">
						</div>
						<button type="button" class="back_btn"></button>
					</div>
					<div class="login_cont">
						<div class="form_box">
							<div class="form_item">
								<div class="input_box">
									<input type="text" class="input_text" placeholder="E-mail (아이디)">
									<img src="img/login_mail.png" alt="" class="input_icon">
								</div>
							</div>
							<div class="form_item">
								<div class="input_box">
									<input type="password" class="input_text" placeholder="비밀번호">
									<img src="img/login_lock1.png" alt="" class="input_icon">
								</div>
							</div>
							<div class="form_item">
								<div class="input_box">
									<input type="password" class="input_text" placeholder="비밀번호 확인">
									<img src="img/login_lock2.png" alt="" class="input_icon">
								</div>
							</div>
							<div class="form_item">
								<div class="input_box">
									<input type="text" class="input_text" placeholder="이름">
									<img src="img/login_name.png" alt="" class="input_icon">
								</div>
							</div>
							<div class="form_item">
								<div class="input_box">
									<input type="text" class="input_text" placeholder="닉네임">
									<img src="img/login_nick.png" alt="" class="input_icon">
								</div>
							</div>
							<div class="form_item input_flex">
								<div class="input_box">
									<input type="text" class="input_text" placeholder="휴대전화번호">
									<img src="img/login_mail.png" alt="" class="input_icon">
								</div>
								<button type="button" class="input_btn">인증번호</button>
							</div>
							<div class="form_item input_flex">
								<div class="input_box">
									<input type="text" class="input_text" placeholder="인증번호입력">
									<img src="img/login_check.png" alt="" class="input_icon">
								</div>
								<button type="button" class="input_btn">확인</button>
							</div>
							<div class="form_item">
								<div class="input_box select_box">
									<select class="select">
										<option value="">시</option>
										<option value="서울">서울</option>
										<option value="경기도">경기도</option>
										<option value="인천">인천</option>
										<option value="부산">부산</option>
										<option value="대구">대구</option>
									</select>
									<img src="img/login_map1.png" alt="" class="input_icon">
								</div>
							</div>
							<div class="form_item">
								<div class="input_box select_box">
									<select class="select">
										<option value="">군/구</option>	
										<option value="강남구">강남구</option>
										<option value="수원시">수원시</option>
										<option value="남동구">남동구</option>
										<option value="해운대구">해운대구</option>
										<option value="수성구">수성구</option>
									</select>
									<img src="img/login_map2.png" alt="" class="input_icon">
								</div>
							</div>
							<div class="form_item">
								<div class="input_box file_box">
									<input type="file" name="myprofile" id="myprofile" class="input_file">
									<label for="myprofile" class="label_file">프로필사진 (정사각형)</label>
									<img src="img/login_pic.png" alt="" class="input_icon">
								</div>
								<div class="file_preview">
									<div class="imgbox">
										<img src="img/jogin_profile.jpg" alt="" class="img">
									</div>
									<div class="txtbox">
										<p class="tit">myprofile.jpg | 125kb</p>
										<button type="button" class="del_btn">삭제</button>
									</div>
								</div>
							</div>
							<button type="button" class="login_btn button">회원가입</button>
						</div>
					</div>
					<p class="login_copy">Copyright Ⓒ 2026 GEF. all rights reserved.</p>
				</div>
            </section>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
