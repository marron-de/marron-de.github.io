<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모두의 기빙라이프</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- datepicker -->
    <link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

    <!-- nouislider -->
    <link rel="stylesheet" href="css/nouislider.css">
    <script src="js/nouislider.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"  rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

</head>

<body>


    <div class="wrap login_wrap">

        <!-- container -->
        <div class="container">

            <section class="section login_sec">		
				<div class="inner">					
					<div class="login_header">
						<div class="logo">
							<img src="img/login_logo.png" alt="" class="img">
						</div>
						<button type="button" class="back_btn"></button>
					</div>
					<div class="login_cont">
						<div class="login_topbox">
							<div class="txtbox">
								<p class="tit">Login</p>
								<p class="desc">
									천원으로 시작하는 <br>
									모두의 기부생활
								</p>
								<p class="eng">Giving Made Simple for Everyone</p>
							</div>
							<div class="imgbox">
								<img src="img/login_img.png" alt="" class="img">
							</div>
						</div>
						<div class="form_box">
							<div class="form_item">
								<div class="input_box">
									<input type="text" class="input_text" placeholder="E-mail">
									<img src="img/login_mail.png" alt="" class="input_icon">
								</div>
							</div>
							<div class="form_item">
								<div class="input_box">
									<input type="password" class="input_text" placeholder="Password">
									<img src="img/login_lock1.png" alt="" class="input_icon">
								</div>
							</div>
							<div class="form_item">
								<div class="check_box">
									<input type="checkbox" name="autoLogin" id="autoLogin" class="input_check">
									<label for="autoLogin" class="label_check">계정정보 기억하기</label>
								</div>
							</div>
							<button type="button" class="login_btn button">로그인</button>
						</div>
						<div class="sch_box">
							<div class="item">
								<p class="tit">계정 정보를 잊으셨나요?</p>
								<a href="" class="link">아이디/비번 찾기</a>
							</div>
							<div class="item">
								<p class="tit">아직 회원이 아니신가요?</p>
								<a href="" class="link">회원가입</a>
							</div>
						</div>
						<div class="or">
							<span class="bar"></span>
							<span class="txt">or</span>
							<span class="bar"></span>
						</div>
						<div class="snsbox">
							<a href="" class="link google_link" target="_blank">
								<img src="img/sns_google.png" alt="" class="img">
							</a>
							<a href="" class="link apple_link" target="_blank">
								<img src="img/sns_apple.png" alt="" class="img">
							</a>
							<a href="" class="link naver_link" target="_blank">
								<img src="img/sns_naver.png" alt="" class="img">
							</a>
						</div>
					</div>
					<p class="login_copy">Copyright Ⓒ 2026 GEF. all rights reserved.</p>
				</div>
            </section>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
