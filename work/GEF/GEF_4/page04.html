<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모두의 기빙라이프</title>

    <!-- jquery -->
    <script src="js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- datepicker -->
    <link type="text/css" href="css/jquery-ui.css" rel="stylesheet" />
    <script type="text/javascript" src="js/jquery-ui.min.js">
    </script>

    <!-- nouislider -->
    <link rel="stylesheet" href="css/nouislider.css">
    <script src="js/nouislider.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100;300;400;500;700;900&display=swap"  rel="stylesheet">
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

</head>

<body>


    <div class="wrap login_wrap">

        <!-- container -->
        <div class="container">

            <section class="section login_sec">		
				<div class="inner">					
					<div class="login_header">
						<div class="logo">
							<img src="img/login_logo.png" alt="" class="img">
						</div>
						<button type="button" class="back_btn"></button>
					</div>
					<div class="login_cont">
						<div class="login_topbox">
							<div class="txtbox">
								<p class="tit">Login</p>
								<p class="desc">
									천원으로 시작하는 <br>
									모두의 기부생활
								</p>
								<p class="eng">Giving Made Simple for Everyone</p>
							</div>
							<div class="imgbox">
								<img src="img/login_img.png" alt="" class="img">
							</div>
						</div>
						<!-- 260604 추가작업 -->
						<div class="sns_login">
							<div class="bar_tit">
								<sapn class="bar"></sapn>
								<sapn class="tit">1초 간편 로그인/가입</sapn>
								<sapn class="bar"></sapn>
							</div>
							<div class="list_box">
								<button type="button" class="btn">
									<img src="img/ico_kakao.png" alt="" class="icon">
									<span class="txt">카카오로 시작하기</span>
								</button>
								<button type="button" class="btn">
									<img src="img/ico_naver.png" alt="" class="icon">
									<span class="txt">네이버로 시작하기</span>
								</button>
								<button type="button" class="btn">
									<img src="img/ico_google.png" alt="" class="icon">
									<span class="txt">Google로 시작하기</span>
								</button>
							</div>
						</div>
					</div>
					<p class="login_copy">Copyright Ⓒ 2026 GEF. all rights reserved.</p>
				</div>
            </section>

        </div>

    </div>



    <!-- JS -->
    <script src="js/common.js"></script>



</body>

</html>
