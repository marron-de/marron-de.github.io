<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 휴가월차 수정 모달 -->
		<div id="vacationEdit_modal" class="modal mobtbl3 only show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">휴가월차 수정</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="memberManager_fm" id="memberManager_fm" autocomplete="off" method="post" enctype="multipart/form-data" class="form form_box">
						<div class="tbl_box">
							<table class="tbl space_auto">
								<colgroup>
									<col style="width: 150px">
									<col>
								</colgroup>
								<tbody>
									<tr>
										<th data-th="일자">일자</th>
										<td data-th="일자">
											<div class="input_box">
												<input type="text" name="mb_date" value="2025-08-07" class="input_text icon_ver icon_date size_md calender_btn" />
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="구분">구분</th>
										<td data-th="구분">
											<div class="select_box">
												<select name="gubun" class="select size_md" hname="구분" required="">
													<option value="A">연차</option>
													<option value="B" selected="">반차</option>
												</select>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="시작일">시작일</th>
										<td data-th="시작일">
											<div class="input_box">
												<input type="text" name="start_dt" value="2025-08-07" class="input_text icon_ver icon_date size_md calender_btn" />
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="종료일">종료일</th>
										<td data-th="종료일">
											<div class="input_box">
												<input type="text" name="end_dt" value="2025-08-07" class="input_text icon_ver icon_date size_md calender_btn" />
											</div>
										</td>
									</tr>
										<tr>
											<th data-th="일수">일수</th>
											<td data-th="일수">
												<div class="input_box">
													<input type="text" name="voca_cnt" value="1" class="input_text size_md" hname="일수" required />
												</div>
											</td>
										</tr>
										<tr>
											<th data-th="사유">사유</th>
											<td data-th="사유">
												<div class="input_box">
													<input type="text" name="reason" value="오후반차" class="input_text size_md" hname="사유" required />
												</div>
											</td>
										</tr>
								</tbody>
							</table>
						</div>
					</form>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeE">수정</button>
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>

		<!-- 캘린더 팝업 -->
		<div id="calender_popup"></div>
		
    </div>


    <!-- JS -->
	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}
		replaceModule('../common/calender_popup.html', '#calender_popup');
	</script>
    <script src="../js/common.js"></script>

</body>

</html>
