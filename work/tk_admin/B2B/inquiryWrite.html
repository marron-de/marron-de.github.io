	<!-- JS -->
	<!-- 공통요소 추가 -->
	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}

		replaceModule('../common/b2b_header.html', '#b2b_header');
		replaceModule('../common/footer.html', '#footer');
		replaceModule('../common/sidenav_B2B.html', '#sidenav');

		$(window).on("load", function () {
			setTimeout(() => {
				$(".sidenav .side_cont .menu_list_acco > .side_item").eq(1).addClass("show");
				$(".sidenav .side_cont .menu_list_acco > .side_item").eq(1).find(".acc_cont").show();
				$(".sidenav .side_cont .menu_list_acco > .side_item").eq(1).find(".acc_cont .side_item").eq(0).addClass("active");
			}, 100);
		});
	</script>

	<!-- Summernote Lite CSS/JS (부트스트랩 불필요) -->

                    ['para', ['ul', 'ol', 'paragraph']],

                ],
