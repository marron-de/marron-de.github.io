	<!-- JS -->
	<!-- 공통요소 추가 -->
	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}

		replaceModule('../common/pms_header.html', '#pms_header');
		replaceModule('../common/footer.html', '#footer');
		replaceModule('../common/sidenav_PMS.html', '#sidenav');

		$(window).on("load", function () {
			setTimeout(() => {
				$(".sidenav .side_cont .menu_list_acco > .side_item").eq(1).addClass("show");
				$(".sidenav .side_cont .menu_list_acco > .side_item").eq(1).find(".acc_cont").show();
				$(".sidenav .side_cont .menu_list_acco > .side_item").eq(1).find(".acc_cont .side_item").eq(0).addClass("active");
			}, 100);
		});
	</script>
	<script src="../js/common.js"></script>


	<!-- echarts -->
	<script src="https://cdn.jsdelivr.net/npm/echarts@6.0.0/dist/echarts.min.js"></script>
	<script>
		const tooltipFormatter = function(params) {
			let tooltipItem = '';
			params.forEach(function(el) {
				const color = el.data.tooltipColor || '#000';
				tooltipItem += `
					<div class="descbox">
						<p class="desc">
							<span class="ph-fill ph-circle" style="color:${color}"></span>
							<span class="txt">${el.value.toLocaleString()}</span>
						</p>
					</div>`;
			});
			return `
				<div class="chart_tooltip">
					<p class='title'>${params[0].axisValue}</p>
					${tooltipItem}
				</div>`;
		};
		const createOption = (data, categories) => ({
			xAxis: {
				type: 'value',
				position: 'top',
				axisLine: { show: false },
				axisTick: { show: false },
				splitLine: { show: true, lineStyle: { color: 'rgba(0,0,0,0.08)' } },
				splitNumber: window.innerWidth <= 1080 ? 1 : 10,
				axisLabel: { show: true, color: '#6C757D', margin: window.innerWidth <= 1080 ? 10 : 20 },
			},
			yAxis: {
				type: 'category',
				inverse: true, 
				data: categories,
				axisLine: { show: false },
				axisTick: { show: false },
				splitLine: { show: false },
				axisLabel: { show: true, color: '#6C757D', margin: window.innerWidth <= 1080 ? 10 : 20, fontSize: window.innerWidth <= 1080 ? 10 : 14 },
			},
			tooltip: {
				trigger: 'axis',
				padding: [10, 10],
				axisPointer: { type: 'none' },
				backgroundColor: '#ffffff',
				borderColor: '#DEE2E6',
				textStyle: { color: '#000000' },
				borderWidth: 1,
				transitionDuration: 0,
				position: function(pos, params, dom) {
					return [pos[0] - dom.clientWidth / 2, pos[1] - dom.clientHeight - 10];
				},
				formatter: tooltipFormatter
			},
			series: [{
				type: 'bar',
				data: data,
				barWidth: window.innerWidth <= 1080 ? 20 : 40,
				itemStyle: {
					borderRadius: [0, 6, 6, 0]
				},
				label: {
					show: true,
					position: 'right',
					color: '#00306b',
					fontSize: window.innerWidth <= 1080 ? 10 : 12,
					formatter: (params) => params.value.toLocaleString()
				}
			}],
			grid: {
				right: '8%',
				left: '5%',
				bottom: '0%',
				top: '10%',
				containLabel: true
			}
		});
		const initChart = (elId, data, categories) => {
			const el = document.getElementById(elId);
			if (!el) return;
			const myChart = echarts.init(el);
			myChart.setOption(createOption(data, categories));
			
			window.addEventListener('resize', () => myChart.resize());
			new ResizeObserver(() => myChart.resize()).observe(el.parentElement);
			return myChart;
		};

		const data1 = [
			{ value: 10, tooltipColor: '#92c5fd', itemStyle: { color: new echarts.graphic.LinearGradient(1,0,0,0,[{offset:0,color:'#d3e8ff'},{offset:1,color:'#92c5fd'}]) } },
			{ value: 5, tooltipColor: '#60abfc', itemStyle: { color: new echarts.graphic.LinearGradient(1,0,0,0,[{offset:0,color:'#92c5fd'},{offset:1,color:'#60abfc'}]) } },
			{ value: 2, tooltipColor: '#479efb', itemStyle: { color: new echarts.graphic.LinearGradient(1,0,0,0,[{offset:0,color:'#60abfc'},{offset:1,color:'#479efb'}]) } },
			{ value: 0, tooltipColor: '#126dd9', itemStyle: { color: new echarts.graphic.LinearGradient(1,0,0,0,[{offset:0,color:'#479efb'},{offset:1,color:'#126dd9'}]) } }
		];
		const cat1 = ['한국인','홍콩/대만', '중국인', '미주/유럽'];

		initChart('b2b_chart', data1, cat1);
	</script>
	<script>
		const echartsInstances = [];
		const chartElements = document.querySelectorAll('.echart_custom');

		chartElements.forEach((el) => {
			const myChart = echarts.init(el, null, {
				renderer: 'canvas',
				useDirtyRect: false
			});

			let option = {};
			if (el.classList.contains('echart_typeC')) {
				// typeC
				const getLast12Months = () => {
					const months = [];
					const now = new Date();
					for (let i = 12; i >= 0; i--) {
						const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
						const yy = String(d.getFullYear()).slice(2);
						const mm = String(d.getMonth() + 1).padStart(2, '0');
						months.push(`${yy}.${mm}`);
					}
					return months;
				};

				let tooltipFormatter = function tooltipFormatter(params) {
					let tooltipItem = '';
					params.forEach(function (el) {
						tooltipItem += `
							<div class="descbox">
								<p class="desc">
									<span class="ph-fill ph-circle" style="color:${el.borderColor ? el.borderColor : el.color}"></span>
									<span class="txt">
									${el.seriesName} : ${typeof el.value === 'object' ? el.value[1].toLocaleString() : el.value.toLocaleString()}
									</span>
								</p>
							</div>
						`;
					});
					return `
						<div class="chart_tooltip">
							<p class='title'>
								${params[0].axisValue}
							</p>
							${tooltipItem}
						</div>
					`;
				};

				const isMobile = window.innerWidth <= 1080;

				option = {
					legend: {
						data: ['월별 예약 현황(명)'],
						top: 0,
						left: 0,
						itemWidth: isMobile ? 10 : 12,
						itemHeight: isMobile ? 10 : 12,
						icon: 'circle',
						textStyle: {
							color: '#434343',
							fontSize: isMobile ? 10 : 14
						},
						itemGap: isMobile ? 14 : 20,
					},
					xAxis: {
						type: 'category',
						data: getLast12Months(),
						axisLine: {
							show: false
						},
						axisTick: {
							show: false
						},
						axisLabel: {
							fontSize: isMobile ? 10 : 13,
							color: '#6C757D'
						}
					},
					yAxis: {
						type: 'value',
						position: 'right',
						axisLine: {
							show: false
						},
						axisTick: {
							show: false
						},
						splitLine: {
							lineStyle: {
								color: 'rgba(0,0,0,0.08)'
							}
						},
						axisLabel: {
							fontSize: isMobile ? 10 : 13,
							color: '#6C757D',
							// formatter: '{value} 명'
							formatter: '{value} '
						}
					},
					tooltip: {
						trigger: 'axis',
						padding: [10, 10],
						backgroundColor: '#ffffff',
						borderColor: '#DEE2E6',
						borderWidth: 1,
						formatter: tooltipFormatter
					},
					series: [{
							name: '직월별 예약 현황(명)약',
							type: 'bar',
							stack: 'total',
							barWidth: isMobile ? '70%' : '60%',
							itemStyle: {
								borderRadius: isMobile ? [4, 4, 0, 0] : [6, 6, 0, 0],
								color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
									{ offset: 0, color: '#82b1ff' },
									{ offset: 0.5, color: '#2c7be5' },
									{ offset: 1, color: '#155bb5' }
								])
							},
							data: [5, 17, 13, 8, 8, 22, 9, 3, 14, 12, 2, 22, 10]
						},
					],
					grid: {
						right: '0%',
						left: '0%',
						bottom: '5%',
						top: '10%',
						containLabel: true
					}
				};

			} else if (el.classList.contains('echart_typeD')) {
				// typeC
				const getLast12Months = () => {
					const years = [];
					const currentYear = new Date().getFullYear();

					for (let i = 0; i <= 3; i++) {
						const fullYear = currentYear + i; 
						const yy = String(fullYear).slice(2);
						years.push(`${yy}년`); 
					}
					return years;
				};

				let tooltipFormatter = function tooltipFormatter(params) {
					let tooltipItem = '';
					params.forEach(function (el) {
						tooltipItem += `
							<div class="descbox">
								<p class="desc">
									<span class="ph-fill ph-circle" style="color:${el.borderColor ? el.borderColor : el.color}"></span>
									<span class="txt">
									${el.seriesName} : ${typeof el.value === 'object' ? el.value[1].toLocaleString() : el.value.toLocaleString()}
									</span>
								</p>
							</div>
						`;
					});
					return `
						<div class="chart_tooltip">
							<p class='title'>
								${params[0].axisValue}
							</p>
							${tooltipItem}
						</div>
					`;
				};

				const isMobile = window.innerWidth <= 1080;

				option = {
					legend: {
						data: ['월별 예약 현황(명)'],
						top: 0,
						left: 0,
						itemWidth: isMobile ? 10 : 12,
						itemHeight: isMobile ? 10 : 12,
						icon: 'circle',
						textStyle: {
							color: '#434343',
							fontSize: isMobile ? 10 : 14
						},
						itemGap: isMobile ? 14 : 20,
					},
					xAxis: {
						type: 'category',
						data: getLast12Months(),
						axisLine: {
							show: false
						},
						axisTick: {
							show: false
						},
						axisLabel: {
							fontSize: isMobile ? 10 : 13,
							color: '#6C757D'
						}
					},
					yAxis: {
						type: 'value',
						position: 'right',
						axisLine: {
							show: false
						},
						axisTick: {
							show: false
						},
						splitLine: {
							lineStyle: {
								color: 'rgba(0,0,0,0.08)'
							}
						},
						axisLabel: {
							fontSize: isMobile ? 10 : 13,
							color: '#6C757D',
							// formatter: '{value} 명'
							formatter: '{value} '
						}
					},
					tooltip: {
						trigger: 'axis',
						padding: [10, 10],
						backgroundColor: '#ffffff',
						borderColor: '#DEE2E6',
						borderWidth: 1,
						formatter: tooltipFormatter
					},
					series: [{
							name: '매출성장가능성 (결제금액 기준)',
							type: 'bar',
							stack: 'total',
							barWidth: isMobile ? '70%' : '40%',
							itemStyle: {
								borderRadius: isMobile ? [4, 4, 0, 0] : [6, 6, 0, 0],
								color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
									{ offset: 0, color: '#82b1ff' },
									{ offset: 0.5, color: '#2c7be5' },
									{ offset: 1, color: '#155bb5' }
								])
							},
							data: [612000, 1224000, 2448000, 4896000]
						},
					],
					grid: {
						right: '0%',
						left: '0%',
						bottom: '5%',
						top: '10%',
						containLabel: true
					}
				};

			}

			myChart.setOption(option);

			echartsInstances.push(myChart);

			const parent = el.parentElement;
			if (parent) {
				const ro = new ResizeObserver(() => {
					myChart.resize();
				});
				ro.observe(parent);
			}

			window.addEventListener('resize', () => {
				myChart.resize();
			});
		});
	</script>
