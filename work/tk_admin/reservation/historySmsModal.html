<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 여행상품예약 수정 > SMS발송내역 모달 -->
		<div id="historySms_modal" class="modal only mobtbl2 show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">SMS발송내역</p>
					<button class="modal_close"></button>
				</div>
				<div class="modal_body">
					<div class="tbl_box ">
						<table class="tbl space_auto">
							<colgroup>
								<col style="width:50px">
								<col style="width:150px">
								<col style="width:150px">
								<col style="width:420px">
								<col style="width:160px">
							</colgroup>
							<thead>
								<tr>
									<th data-th="No.">No.</th>
									<th data-th="발송(회사)">발송(회사)</th>
									<th data-th="수신(고객)">수신(고객)</th>
									<th data-th="내용">내용</th>
									<th data-th="전송일시 / 전송결과">전송일시 / 전송결과</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<td data-th="No.">3</td>
									<td data-th="발송(회사)">07012345678 <br>(홍길동 매니저)</td>
									<td data-th="수신(고객)">01012345678</td>
									<td data-th="내용" class="tbl_content point">
										<div class="tbl_content">
											알림톡 테스트 내용입니다. <br>
											알림톡 테스트 내용입니다. 
										</div>
									</td>
									<td data-th="전송일시 / 전송결과">
										<div class="tbl_inline column_ver">
											<span class="date">2025-08-05 01:40:40</span>
										</div>
									</td>
								</tr>
								<tr>
									<td data-th="No.">2</td>
									<td data-th="발송(회사)">07012345678 <br>(홍길동 매니저)</td>
									<td data-th="수신(고객)">01012345678</td>
									<td data-th="내용" class="tbl_content point">
										<div class="tbl_content">
											알림톡 테스트 내용입니다. <br>
											알림톡 테스트 내용입니다. 
										</div>
									</td>
									<td data-th="전송일시 / 전송결과">
										<div class="tbl_inline column_ver">
											<span class="date">2025-08-05 01:40:40</span>
											<span class="error red">기타 에러 (6610)</span>
										</div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
					<div class="modal_btnbox">
						<button class="modal_btn button auto typeF modal_close">닫기</button>
					</div>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>


</body>

</html>
