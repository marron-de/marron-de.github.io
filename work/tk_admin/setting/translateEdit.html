<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">

</head>

<body data-theme="light">


	<div id="wrap" class="layout setting_wrap" data-title="번역문 수정" data-icon="ph-gear">

		<!-- sidenav -->
		<div id="sidenav"></div>

		<!-- container -->
		<div id="container" class="container">

			<!-- header -->
			<div id="sub_header"></div>

			<!-- contents -->
			<div id="contents" class="contents">				
				<div class="content_title ">
					<p class="page_title">
						<i class="ph-fill ph-gear icon"></i>
						번역문 수정
					</p>
				</div>

				<div class="content_write content_tbl">
					<div class="board bo_write">
						<form name="alrim_talk_frm" id="alrim_talk_frm" method="POST">
							<div class="tbl_box ver3 mobtbl">
								<table class="tbl board_list min_auto">
									<colgroup>
										<col style="width: 150px;">
										<col style="width: 430px;">
										<col style="width: 150px;">
										<col style="width: 430px;">
									</colgroup>
								<tbody>									
									<tr>
										<th data-th="한글">한글</th>
										<td data-th="한글">
											<div class="input_box">
												<textarea class="input_text size_md h_auto" id="ko" name="ko" rows="4" required="">한국 NO.1 자유투어</textarea>
											</div>
										</td>
										<th data-th="영어">영어</th>
										<td data-th="영어">
											<div class="input_box">
												<textarea class="input_text size_md h_auto" id="en" name="en" rows="4" required="">Korea No.1</textarea>
											</div>
										</td>
									</tr>
									<tr>
										<th data-th="간체">간체</th>
										<td data-th="간체">
											<div class="input_box">
												<textarea class="input_text size_md h_auto" id="cn" name="cn" rows="4" required="">韩国No.1</textarea>
											</div>
										</td>
										<th data-th="번체">번체</th>
										<td data-th="번체">
											<div class="input_box">
												<textarea class="input_text size_md h_auto" id="hk" name="hk" rows="4" required="">韓國No.1</textarea>
											</div>
										</td>
									</tr>
								</tbody>

								</table>
							</div>
							<div class="bo_btnbox">
								<div class="leftbox">
									<button type="button" class="button typeE auto size_md">목록</button>
								</div>
								<div class="rightbox">
									<button class="button typeE auto size_md">수정</button>
									<button class="button typeF auto size_md">다시작성</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>

			<!-- footer -->
			<div id="footer"></div>

		</div>

	</div>


	<!-- JS -->
	<!-- 공통요소 추가 -->
	<script>
		function replaceModule(url, selector) {
			fetch(url)
				.then(res => res.text())
				.then(html => {
					const container = document.querySelector(selector);
					const tempDiv = document.createElement('div');
					tempDiv.innerHTML = html.trim();
					const newElement = tempDiv.firstElementChild;

					if (container && newElement) {
						container.replaceWith(newElement);
					}
				});
		}

		replaceModule('../common/sub_header.html', '#sub_header');
		replaceModule('../common/footer.html', '#footer');
		replaceModule('../common/sidenav_setting.html', '#sidenav');

		$(window).on("load", function () {
			setTimeout(() => {
				$(".header .h_bottom .gnb .gnb_item").eq(10).addClass("active");
			}, 100);
		});
	</script>	
	<script src="../js/common.js"></script>



</body>

</html>
