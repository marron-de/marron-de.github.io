<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 알림톡 수정 모달 -->
		<div id="talkEdit_modal" class="modal talk_modal mobtbl show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">알림톡 수정</p>
					<button type="button" class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="rule_frm" id="rule_frm" method="POST" class="form">
						<div class="tbl_box mobtbl">
							<table class="tbl board_list min_auto">
								<colgroup>
									<col style="width: 140px;">
									<col style="width: 500px;">
									<col style="width: 300px;">
								</colgroup>
								<tbody>
									<tr>
										<th>강조유형</th>

											<div class="radio_wrap">
												<div class="radio_box size_md">
													<input class="input_radio" id="templateEmphasizeTypeNone2" type="radio" name="templateEmphasizeType" value="NONE" checked onclick="onClickEmphasizeType(&quot;NONE&quot;);">
													<label class="label_radio" for="templateEmphasizeTypeNone2">기본형</label>
												</div>
												<div class="radio_box size_md">

													<label class="label_radio" for="templateEmphasizeTypeText2">강조표기형</label>
												</div>
											</div>
										</td>
									</tr>
									<tr>
										<th>템플릿명</th>
										<td colspan="2">
											<div class="input_box">
												<input class="input_text size_md" id="templateName" name="templateName' type=" text"="" value="무통장입금" placeholder="템플릿 관리 시 사용할 이름 입력 (예)회원가입, 주문접수">
											</div>
										</td>
									</tr>
									<tr class="reverse">

										<td>

											</div>
										</td>
										<td rowspan="5" class="preview_td">
											<div class="kakaotalk_preview">
												<div class="frame">
													<div class="talk">
														<div class="user_cont">
															<div class="msg">
																<div class="msg_head">알림톡 도착</div>
																<div class="msg_cont">
																	<div class="msg_title" style="display: none;">
																		<p class="tit">타이틀</p>
																		<p class="desc">서브타이틀</p>
																	</div>
																	<div class="msg_contents">
																		홍길동고객님 안녕하세요. <br>
																		여행대장입니다. <br>
																		롯데월드 샤론캣 드레스 체험권 <br>
																		예약이 접수되었습니다.
																		<br><br>
																		▶티켓명: 행사명<br>
																		▶사용일: 0000-00-00 <br>
																		▶예약번호: P1754981801ED320FA <br>
																		▶예약자명: 홍길동 <br>
																		▶성인: 00 명 <br>
																		▶아동: 00 명 <br>
																		▶연락처: 010-1234-5678 <br>
																		▶결제요청: 58,800원 <br>
																		▶결제수단 : 무통장 입금
																	</div>
																	<div class="msg_description">
																		부가정보 내용입니다.
																	</div>
																	<div class="msg_btnbox">
																		<div class="btn">버튼</div>
																	</div>
																</div>
															</div>
														</div>
													</div>
													<div class="uibar"></div>
													<div class="sidebtn"></div>
												</div>
												<p class="preview_wordnum">
													<span class="num">0</span>/1,000자
												</p>
											</div>
										</td>
									</tr>
									<tr class="trTemplateSubtitle" style="display:none;">
										<th>서브타이틀</th>
										<td>
											<div class="input_box">
												<input id="templateSubtitle" class="input_text size_md" type="text" value="서브타이틀" placeholder="타이틀에 해당하는 부연 설명을 입력해 주세요. (변수불가)">
											</div>
										</td>
									</tr>
									<tr class="trTemplateTitle" style="display:none;">
										<th>타이틀</th>
										<td>
											<div class="input_box">
												<textarea id="templateTitle" class="input_text size_md h_auto" rows="3" placeholder="본문에서 강조하여 표현할 내용을 입력해 주세요.">타이틀</textarea>
											</div>
										</td>
									</tr>
									<tr>
										<th>부가정보</th>
										<td>
											<div class="align_right column_ver tbl_inline gap2">
												<div class="input_box">
													<textarea id="templateExtra" class="input_text size_md h_auto" rows="4" placeholder="이용안내 등 보조적인 정보메시지를 입력해 주세요.(변수불가)">부가정보</textarea>
												</div>
												<p class="txt">
													<span id="extra_total_cnt">0</span>/500자
												</p>	
											</div>
										</td>
									</tr>
									<tr>
										<th>버튼</th>
										<td id="td_buttons">
											<div class="input_box input_flex">
												<div class="select_box full">
													<select id="buttonType" name="buttonType" class="select size_md">
														<option value="">버튼타입선택</option>
														<option value="WL" selected>웹링크</option>
														<option value="AL">앱링크</option>
													</select>
												</div>
												<div class="select_box">
													<button type="button" class="button size_sm auto typeF" onclick="onClickAddButton();">+</button>
												</div>
											</div>
										</td>
									</tr>						
								</tbody>
							</table>
						</div>
						<div class="modal_btnbox">
							<button class="modal_btn button auto typeE" onclick="onClickSave();">등록</button>
							<button class="modal_btn button auto typeF modal_close" onclick="onClickReset();">다시작성</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>


	<!-- 실서버 스크립트 코드  -->
	<script>
		//  260313 추가작업
		function onClickEmphasizeType(val) {
			if(val == 'NONE') {
				$('.talk_modal .trTemplateSubtitle').hide();
				$('.talk_modal .trTemplateTitle').hide();
				$('.talk_modal .kakaotalk_preview .msg_title').hide();
			} else if(val == 'TEXT') {
				$('.talk_modal .trTemplateSubtitle').show();
				$('.talk_modal .trTemplateTitle').hide();
				$('.talk_modal .kakaotalk_preview .msg_title').show();
			}
		}
	</script>

</body>

</html>
