<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK TRAVEL | ADMIN</title>

	<!-- jquery -->
	<script src="../js/jquery-3.6.0.min.js"></script>

	<!-- Swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

	<!-- datepicker -->
	<link type="text/css" href="../css/jquery-ui.css" rel="stylesheet" />
	<script type="text/javascript" src="../js/jquery-ui.min.js">
	</script>
	
	<!-- Phosphor Icons -->
	<script src="https://unpkg.com/@phosphor-icons/web"></script>

	<!-- CSS -->
	<link rel="stylesheet" href="../css/common.css">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/responsive.css">

	<!-- Font -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&family=Noto+Sans+SC:wght@100..900&family=Noto+Sans+TC:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body data-theme="light">


    <div id="wrap"> 
		
		<!-- 앱푸시 수정 모달 -->
		<div id="appEdit_modal" class="modal apppush_modal mobtbl show">
			<div class="modal_box ver2">
				<div class="modal_head">
					<p class="tit">앱푸시 수정</p>
					<button type="button" class="modal_close"></button>
				</div>
				<div class="modal_body">
					<form name="rule_frm" id="rule_frm" method="POST" class="form">
						<div class="tbl_box mobtbl">
							<table class="tbl board_list min_auto">
								<colgroup>
									<col style="width: 140px;">
									<col style="width: 500px;">
									<col style="width: 300px;">
								</colgroup>
								<tbody>
									<tr>
										<th>구분</th>
										<td colspan="2">
											<div class="radio_wrap">
												<div class="radio_box size_md">
													<input class="input_radio" id="templateType2_1" type="radio" name="templateType2" checked>
													<label class="label_radio" for="templateType2_1">결제</label>
												</div>
												<div class="radio_box size_md">
													<input class="input_radio" id="templateType2_2" type="radio" name="templateType2">
													<label class="label_radio" for="templateType2_2">취소</label>
												</div>
												<div class="radio_box size_md">
													<input class="input_radio" id="templateType2_3" type="radio" name="templateType2">
													<label class="label_radio" for="templateType2_3">광고</label>
												</div>
												<div class="radio_box size_md">
													<input class="input_radio" id="templateType2_4" type="radio" name="templateType2">
													<label class="label_radio" for="templateType2_4">이벤트</label>
												</div>
											</div>
										</td>
									</tr>
									<tr>
										<th>앱푸시명</th>
										<td colspan="2">
											<div class="input_box">
												<input class="input_text size_md" placeholder="앱푸시명을 입력해주세요." value="앱푸시명">
											</div>
										</td>
									</tr>
									<tr class="reverse">
										<th>제목</th>
										<td>
											<div class="input_box">
												<input class="input_text size_md" placeholder="제목을 입력해주세요." value="앱푸시 제목">
											</div>
										</td>
										<!-- 미리보기-->
										<td rowspan="999" class="preview_td">
											<div class="apppush_preview">
												<div class="frame">
													<div class="apppush">
														<div class="pushitem">
															<div class="itemtop">
																<div class="imgbox">
																	<img src="../img/logo_funkr.png" alt="" class="img">
																</div>
																<div class="txtbox">
																	<div class="top">
																		<span class="txt">펀코리아</span>
																		<span class="txt">오전 9:00</span>
																	</div>
																	<p class="tit">앱푸시 제목</p>
																	<p class="desc">
																		앱푸시 내용입니다. <br>
																		앱푸시 내용입니다. 앱푸시 내용입니다.
																	</p>
																</div>
																<div class="thumbox">
																	<img src="../img/app_img1.png" alt="" class="img">
																</div>
																<button type="button" class="arrow">
																	<i class="ph-bold ph-caret-up"></i>
																</button>
															</div>
															<div class="itembottom">
																<div class="imgbox">
																	<img src="../img/app_img2.png" alt="" class="img">
																</div>
															</div>
														</div>
														<div class="pushitem open">
															<div class="itemtop">
																<div class="imgbox">
																	<img src="../img/logo_funkr.png" alt="" class="img">
																</div>
																<div class="txtbox">
																	<div class="top">
																		<span class="txt">펀코리아</span>
																		<span class="txt">오전 9:00</span>
																	</div>
																	<p class="tit">앱푸시 제목</p>
																	<p class="desc">
																		앱푸시 내용입니다. <br>
																		앱푸시 내용입니다.  
																	</p>
																</div>
																<div class="thumbox">
																	<img src="../img/app_img1.png" alt="" class="img">
																</div>
																<button type="button" class="arrow">
																	<i class="ph-bold ph-caret-up"></i>
																</button>
															</div>
															<div class="itembottom">
																<div class="imgbox">
																	<img src="../img/app_img2.png" alt="" class="img">
																</div>
															</div>
														</div>
													</div>
													<div class="uibar"></div>
													<div class="sidebtn"></div>
												</div>
											</div>
										</td>
										<!-- 미리보기-->
									</tr>
									<tr>
										<th>내용</th>
										<td>
											<div class="input_box h100">
												<textarea class="input_text size_md h_auto" rows="16" placeholder="내용을 입력해주세요.">앱푸시 내용입니다.&#13;&#10;앱푸시 내용입니다. 앱푸시 내용입니다.</textarea>
											</div>
										</td>
									</tr>
									<tr>
										<th>연결 URL</th>
										<td>
											<div class="input_box">
												<input class="input_text size_md" type="text" placeholder="연결 URL을 입력해주세요." value="https://www.tktravelkorea.com/">
											</div>
										</td>
									</tr>
									<tr>
										<th>이미지 (기본화면)</th>
										<td>
											<div class="input_box input_file_box">
												<div class="input_flex">
													<input type="file" class="input_file" id="UserFile1" name="UserFile1">
													<label for="UserFile1" class="label_file size_md">선택된 파일 없음</label>
													<button type="button" class="input_btn fileSelect_btn size_md">파일 선택</button>
												</div>
												<div class="file_data">
													<img src="../img/ic_filedown.png" alt="" class="icon">
													<a href="" class="txt">테스트 파일.jpg</a>
													<button type="button" class="delete_btn">
														<i class="ph-fill ph-x-circle"></i>
													</button>
												</div>
											</div>
										</td>
									</tr>	
									<tr>
										<th>이미지 (펼친화면)</th>
										<td>
											<div class="input_box input_file_box">
												<div class="input_flex">
													<input type="file" class="input_file" id="UserFile1" name="UserFile1">
													<label for="UserFile1" class="label_file size_md">선택된 파일 없음</label>
													<button type="button" class="input_btn fileSelect_btn size_md">파일 선택</button>
												</div>
												<div class="file_data">
													<img src="../img/ic_filedown.png" alt="" class="icon">
													<a href="" class="txt">테스트 파일.jpg</a>
													<button type="button" class="delete_btn">
														<i class="ph-fill ph-x-circle"></i>
													</button>
												</div>
											</div>
										</td>
									</tr>						
								</tbody>
							</table>
						</div>
						<div class="modal_btnbox">
							<button class="modal_btn button auto typeE">등록</button>
							<button class="modal_btn button auto typeF modal_close">다시작성</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		
    </div>


    <!-- JS -->
    <script src="../js/common.js"></script>

</body>

</html>
