<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVA</title>
	
    <!-- Font -->
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

	<!-- swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

	<!-- Tailwind -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	
	<!-- Tailwind v4 자동완성용 / 임시추가 -->
	<link rel="stylesheet" href="css/temp.css">

</head>


<body class="bg-[#2d2d47] text-white min-h-svh font-[Pretendard,sans-serif]">
	
    <div class="flex flex-col min-h-screen ">

        <!-- header -->
        <header class="relative my-[22px]">
            <div class="h-[40px] px-[20px] py-0 flex items-center justify-between gap-[16px]">
               	<div class="flex items-center justify-center w-[40px]">
					<img src="img/header_back.svg" alt="뒤로가기">
                </div>
                <p class="flex-1 font-semibold text-[18px] leading-none text-[#ffffff] text-center">회원가입</p>
               	<div class="flex items-center justify-center w-[40px]">
				</div>
            </div>
        </header>

        <!-- container -->
        <div class="flex flex-col flex-1">

            <section class="relative mb-[20px]">
                <div class="relative px-[20px]">
					<div class="flex items-start gap-[15px] mb-[40px]">
						<p class="w-[190px] font-medium text-[22px] leading-[1.14] text-[#ffffff] break-keep">
							<span class="font-extrabold">이메일(아이디)</span>를 설정해주세요
						</p>
						<p class="text-[14px] leading-none text-[#ffffff] mt-[4px]"><span class="font-bold">2</span> / 3</p>
					</div>
					<div class="flex flex-col gap-[40px]">
						<div class="flex flex-col gap-[8px]">
							<div class="flex items-center justify-between">
								<p class="font-semibold text-[16px] leading-none text-[#fff]">이메일</p>
								<p class="font-semibold text-[12px] leading-[1.17] text-[rgba(255,255,255,0.7)]">aiva는 이메일을 아이디로 사용합니다</p>
							</div>
							<input type="text" placeholder="aiva@aiva.co.kr" class="border border-[#4f4d76] rounded-[10px] bg-[#403f5e] w-full h-[45px] px-[10px] font-semibold text-[16px] text-[#ffffff] placeholder:text-[rgba(255,255,255,0.7)]">
						</div>
						<div class="flex flex-col gap-[8px]">
							<div class="flex items-center justify-between">
							<p class="font-semibold text-[16px] leading-none text-[#fff]">비밀번호</p>
							</div>
							<input type="text" placeholder="8~16자리 / 영문 대소문자, 숫자, 특수문자 조합" class="border border-[#4f4d76] rounded-[10px] bg-[#403f5e] w-full h-[45px] px-[10px]  font-semibold text-[16px] text-[#ffffff] placeholder:text-[rgba(255,255,255,0.7)]">
						</div>
					</div>
				</div>
			</section>		

        </div>

        <!-- button -->
        <div class="sticky bottom-0 z-50 px-[20px] pb-[46px] mt-[46px]">
            <div class="flex flex-col gap-[12px]">
				<button type="button" class="h-[45px] flex items-center justify-center rounded-[10px] border border-[#fb7c3e] bg-[#d45f26]">
					<span class="font-semibold text-[16px] text-[#fff]">입력 완료</span>
				</button>
            </div>
        </div>
    </div>

</body>
 

</html>
