<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVA</title>
	
    <!-- Font -->
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

	<!-- swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

	<!-- Tailwind -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	
	<!-- Tailwind v4 자동완성용 / 임시추가 -->
	<link rel="stylesheet" href="css/temp.css">

</head>


<body class="bg-[#2d2d47] text-white min-h-svh font-[Pretendard,sans-serif]">
	
    <div class="flex flex-col min-h-screen bg-[linear-gradient(180deg,#2d2d47_40.87%,#0d0d15_100%)]">

        <!-- container -->
        <div class="flex flex-col flex-1 items-center justify-center">

            <section class="relative">
                <div class="relative flex flex-col justify-center gap-[10px]">
					<img src="img/ico_aiva.svg" alt="">
					<p class="font-semibold text-[16px] leading-[75%] tracking-[0.04em] text-justify text-[#fff] flex justify-between">
						<span>UPLOAD</span>
						<span>/</span>
						<span>FIT</span>
						<span>/</span>
						<span>READY</span>
					</p>
                </div>
            </section>	

        </div>

        <!-- button -->
        <div class="sticky bottom-0 z-50 px-[20px] pb-[44px]">
            <div class="flex flex-col gap-[12px]">
				<button type="button" class="h-[58px] flex items-center justify-center rounded-[10px] border border-[#fb7c3e]  bg-[#d45f26]">
						<span class="font-semibold text-[18px] leading-none text-[#fff]">인증하기</span>
				</button>
				<button type="button" class="h-[58px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e]">
						<span class="font-semibold text-[18px] leading-none text-[#fff]">로그인</span>
				</button>
            </div>
        </div>

    </div>

</body>

 
</html>
