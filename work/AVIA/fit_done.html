<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVA</title>
	
    <!-- Font -->
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

	<!-- swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

	<!-- Tailwind -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	
	<!-- Tailwind v4 자동완성용 / 임시추가 -->
	<link rel="stylesheet" href="css/temp.css">

</head>


<body class="bg-[#2d2d47] text-white min-h-svh font-[Pretendard,sans-serif]">
	
    <div class="flex flex-col">

        <!-- header -->
        <header class="relative my-[22px]">
            <div class="h-[40px] px-[20px] py-0 flex items-center justify-between gap-[16px]">
               	<div class="flex items-center justify-center w-[40px]">
					<img src="img/header_back.svg" alt="뒤로가기">
                </div>
                <p class="flex-1 font-semibold text-[18px] leading-none text-[#ffffff] text-center">AI 피팅</p>
               	<div class="flex items-center justify-center w-[40px]">
					<img src="img/header_alarm.svg" alt="알림">
				</div>
            </div>
        </header>

        <!-- container -->
        <div class="flex flex-col">

            <section class="relative">
                <div class="relative px-[20px]">
					<div class="flex flex-col gap-[8px] mb-[15px]">
						<div class="flex items-center justify-center">
							<img src="img/done_img.svg" alt="" class="w-[194px]">
						</div>
						<p class="text-[14px] leading-[1.29] text-center text-[#ffffff]">
							피팅이 완료되었습니다! <br>
							결과물은 나의 생성리스트에 자동 저장됩니다.
						</p>
					</div>
					<div class="flex flex-col rounded-[10px_10px_20px_20px] overflow-hidden mb-[20px]">
						<div class="flex">
							<img src="img/done_result.png" alt="" class="object-cover w-full">
						</div>
						<div class="bg-[#212238] pt-[18px] pb-[20px] px-[20px] flex flex-col gap-[26px]">
							<div class="flex flex-col gap-[13px]">
								<div class="flex items-center gap-[9px]">
									<input type="radio" name="list_form" id="list_form1" value="상상 이상으로 나왔어요" checked class="appearance-none w-[30px] h-[30px] rounded-[100px] border-0 cursor-pointer bg-[#4f4d76] bg-center bg-no-repeat checked:bg-[url('img/radio_on.svg')] peer">
									<label for="list_form1" class="flex-1 text-[16px] leading-none text-[#a3a2c3] cursor-pointer peer-checked:text-[#fff]"><p>상상 이상으로 나왔어요</p></label>
								</div>
								<div class="flex items-center gap-[9px]">
									<input type="radio" name="list_form" id="list_form2" value="원하는대로 나왔어요" class="appearance-none w-[30px] h-[30px] rounded-[100px] border-0 cursor-pointer bg-[#4f4d76] bg-center bg-no-repeat checked:bg-[url('img/radio_on.svg')] peer">
									<label for="list_form2" class="flex-1 text-[16px] leading-none text-[#a3a2c3] cursor-pointer peer-checked:text-[#fff]"><p>원하는대로 나왔어요</p></label>
								</div>
								<div class="flex items-center gap-[9px]">
									<input type="radio" name="list_form" id="list_form3" value="그럭저럭 쓸만하게 나왔어요" class="appearance-none w-[30px] h-[30px] rounded-[100px] border-0 cursor-pointer bg-[#4f4d76] bg-center bg-no-repeat checked:bg-[url('img/radio_on.svg')] peer">
									<label for="list_form3" class="flex-1 text-[16px] leading-none text-[#a3a2c3] cursor-pointer peer-checked:text-[#fff]"><p>그럭저럭 쓸만하게 나왔어요</p></label>
								</div>
								<div class="flex items-center gap-[9px]">
									<input type="radio" name="list_form" id="list_form4" value="뭔가 어색해요" class="appearance-none w-[30px] h-[30px] rounded-[100px] border-0 cursor-pointer bg-[#4f4d76] bg-center bg-no-repeat checked:bg-[url('img/radio_on.svg')] peer">
									<label for="list_form4" class="flex-1 text-[16px] leading-none text-[#a3a2c3] cursor-pointer peer-checked:text-[#fff]"><p>뭔가 어색해요</p></label>
								</div>
								<div class="flex items-center gap-[9px]">
									<input type="radio" name="list_form" id="list_form5" value="AI티 너무나고 못써먹겠어요" class="appearance-none w-[30px] h-[30px] rounded-[100px] border-0 cursor-pointer bg-[#4f4d76] bg-center bg-no-repeat checked:bg-[url('img/radio_on.svg')] peer">
									<label for="list_form5" class="flex-1 text-[16px] leading-none text-[#a3a2c3] cursor-pointer peer-checked:text-[#fff]"><p>AI티 너무나고 못써먹겠어요</p></label>
								</div>
							</div>
							<div class="flex flex-col gap-[12px]">
								<a href="#none" class="border border-[#4f4d76] rounded-[10px] flex items-center justify-between gap-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] pl-[11px] pr-[13px] py-[14px]">
									<p class="flex-1 flex items-center gap-[9px]">
										<img src="img/ic_model_icon1.svg" alt="" class="w-[18px]">
										<span class="flex-1 font-semibold text-[13px] leading-none text-[#a3a2c3]">이미지 다운 후 -생성한 리스트-로</span>
									</p>
									<img src="img/ic_btn_arrow2.svg" alt="버튼 화살표" class="w-[8px]">
								</a>
							</div>
						</div>
					</div>
					<div class="flex gap-[20px] mb-[20px]">
						<button type="button" class="flex-1 border border-[#4f4d76] rounded-[20px] flex flex-col items-center justify-between gap-[11px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] pt-[18px] pb-[12px]">
							<img src="img/ic_reset.svg" alt="" class="w-[24px]">
							<p class="font-semibold text-[13px] leading-[1.23] text-center text-[#a3a2c3]">
								같은 옵션으로 재생성<br>
								<span class="font-normal leading-[1.23] text-[12px]">(생성비 20% 할인)</span>
							</p>
						</button>
						<button type="button" class="flex-1 border border-[#4f4d76] rounded-[20px] flex flex-col items-center justify-between gap-[11px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] pt-[18px] pb-[12px]">
							<img src="img/ic_app.svg" alt="" class="w-[24px]">
							<p class="font-semibold text-[13px] leading-[1.23] text-center text-[#a3a2c3]">
								옵션을 변경하여 <br>생성하기
							</p>
						</button>
					</div>
					<div class="flex flex-col">
						<button type="button" class="flex items-center justify-center gap-[6px] border border-[#fb7c3e] rounded-[20px] py-[13px] px-[15px] bg-[#d45f26] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)]">
							<span class="flex-1 flex items-center justify-center gap-[12px]">
								<img src="img/btn_ai_icon2.svg" alt="" class="w-[40px]">
								<span class="font-semibold text-[14px] leading-none text-[#ffffff]">이미지로 동영상 만들기</span>
							</span>
							<img src="img/ic_btn2_arrow.svg" alt="" class="w-[9px]">
						</button>
					</div>
                </div>
            </section>		

        </div>

        <!-- nav -->
        <nav class="sticky bottom-0 z-50 bg-[#1f2031] rounded-[20px_20px_0_0] mt-[44px]">
            <div class="h-[74px] flex items-end justify-between pt-[14px] pb-[11px] px-[22px]">
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[8px] items-center">
						<img src="img/nav_home.svg" alt="Home" class="w-[30px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">Home</span>
					</a>
				</div>
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[8px] items-center">
						<img src="img/nav_create.svg" alt="생성한 리스트" class="w-[30px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">생성한 리스트</span>
					</a>
				</div>
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[10px] items-center">
						<img src="img/nav_AI.svg" alt="AI 생성" class="w-[50px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">AI 생성</span>
					</a>
				</div>
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[8px] items-center">
						<img src="img/nav_token.svg" alt="토큰지갑" class="w-[30px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">토큰지갑</span>
					</a>
				</div>
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[8px] items-center">
						<img src="img/nav_mypage.svg" alt="마이페이지" class="w-[30px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">마이페이지</span>
					</a>
				</div>
            </div>
        </nav>

    </div>

</body>


</html>
