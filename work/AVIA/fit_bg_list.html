<body class="bg-[#2d2d47] text-white min-h-svh font-[Pretendard,sans-serif]">
	
    <div class="flex flex-col">

            <div class="h-[40px] px-[20px] py-0 flex items-center justify-between gap-[16px]">

            </div>
        </header>

								</div>
								<div class="flex items-center gap-[9px]">
									<input type="radio" name="list_location" id="list_location2" value="실외" class="appearance-none w-[30px] h-[30px] rounded-[100px] border-0 cursor-pointer bg-[#4f4d76] bg-center bg-no-repeat checked:bg-[url('img/radio_on.svg')] peer">

								</div>
							</div>
						</div>
						<div class="flex flex-col gap-[20px]">

									<label for="list_bg1" class="relative cursor-pointer peer-checked:[&>span]:bg-[url(img/ic_heart_on.svg)]">
										<span class="absolute top-[7px] right-[7px] block w-[20px] aspect-[1/1] bg-[url(img/ic_heart_off.svg)] bg-no-repeat bg-center bg-contain"></span>
										<div class="w-[133px] flex items-center justify-center rounded-[10px] overflow-hidden">
											<img src="img/list_bg1.png" alt="">
										</div>
									</label>
								</div>
								<div class="w-[133px]">

									</label>
								</div>								
								<div class="w-[133px]">
									<input type="radio" name="list_bg" id="list_bg7" value="배경7" class="hidden peer">
