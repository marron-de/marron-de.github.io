<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVA</title>
	
    <!-- Font -->
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

	<!-- swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

	<!-- Tailwind -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	
	<!-- Tailwind v4 자동완성용 / 임시추가 -->
	<link rel="stylesheet" href="css/temp.css">

</head>


<body class="bg-[#2d2d47] text-white min-h-svh font-[Pretendard,sans-serif]">
	
    <div class="flex flex-col">

        <!-- header -->
        <header class="relative my-[22px]">
            <div class="h-[40px] px-[20px] py-0 flex items-center justify-between gap-[16px]">
               	<div class="flex items-center justify-center w-[40px]">
					<img src="img/header_back.svg" alt="뒤로가기">
                </div>
                <p class="flex-1 font-semibold text-[18px] leading-none text-[#ffffff] text-center">AI 동영상 만들기</p>
               	<div class="flex items-center justify-center w-[40px]">
					<img src="img/header_alarm.svg" alt="알림">
				</div>
            </div>
        </header>

        <!-- container -->
        <div class="flex flex-col">

            <section class="relative mt-[5px] mb-[20px]">
                <div class="relative px-[20px]">
					<div class="bg-[#212238] py-[16px] px-[20px] rounded-[20px]">
						<p class="font-semibold text-[14px] leading-none text-[#fb7c3e] mb-[16px]">➀ 모델업로드</p>
						<div class="flex gap-[20px] mb-[13px]">
							<button type="button" class="flex-1 flex flex-col items-center justify-center gap-[5px] border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] pt-[7px] pb-[12px]">
								<img src="img/img_camera.svg" alt="" class="w-[58px]">
								<p class="font-semibold text-[14px] leading-none text-center text-[#ffffff]">제품 촬영</p>
							</button>
							<button type="button" class="flex-1 flex flex-col items-center justify-center gap-[5px] border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] pt-[7px] pb-[12px]">
								<img src="img/img_image.svg" alt="" class="w-[58px]">
								<p class="font-semibold text-[14px] leading-none text-center text-[#ffffff]">이미지 업로드</p>
							</button>
						</div>
						<p class="text-[12px] leading-[1.33] text-[#a3a2c3] min-h-[2.66em]">
							제품을 촬영하시거나 이미지를 업로드 하세요.
						</p>	
					</div>	
				</div>	
			</section>

  			<section class="relative mb-[20px]">
                <div class="relative px-[20px]">
					<div class="bg-[#212238] pt-[16px] pb-[20px] px-[20px] rounded-[20px]">
						<p class="font-semibold text-[14px] leading-none text-[#fb7c3e] mb-[22px]">➁ 영상 상황설정</p>
						<div class="flex flex-col gap-[17px]">
							<div class="flex items-center gap-[9px]">
								<input type="radio" name="vid_setting" id="vid_setting1" value="이미지에 맞춰 AI가 자연스럽게 연출" checked class="appearance-none w-[30px] h-[30px] rounded-[100px] border-0 cursor-pointer bg-[#4f4d76] bg-center bg-no-repeat checked:bg-[url('img/radio_on.svg')] peer">
								<label for="vid_setting1" class="flex-1 text-[14px] leading-none text-[#a3a2c3] cursor-pointer peer-checked:text-[#fff]"><p>이미지에 맞춰 AI가 자연스럽게 연출</p></label>
							</div>
							<div class="flex items-center gap-[9px]">
								<input type="radio" name="vid_setting" id="vid_setting2" value="영상 상황을 직접 설정" class="appearance-none w-[30px] h-[30px] rounded-[100px] border-0 cursor-pointer bg-[#4f4d76] bg-center bg-no-repeat checked:bg-[url('img/radio_on.svg')] peer">
								<label for="vid_setting2" class="flex-1 text-[14px] leading-none text-[#a3a2c3] cursor-pointer peer-checked:text-[#fff]"><p>영상 상황을 직접 설정</p></label>
							</div>
						</div>
					</div>	
				</div>	
			</section>			

			<section class="relative">
				<ul class="relative flex flex-col gap-[20px] px-[20px]">
					<li class="flex flex-col bg-[#212238] py-[22px] px-[20px] rounded-[20px]">
						<p class="flex items-center justify-between gap-[10px]" onclick="toggleAccordion(this)">
							<span class="flex-1 font-semibold text-[14px] leading-none text-[#fb7c3e]">➂ 프롬프트 입력 (선택/500자 미만)</span>
							<img src="img/acc_arrow.svg" alt="" class="w-[14px] transition duration-400 ease-linear">
						</p>
						<ul style="display:none">
							<li class="mt-[27px]">
								<textarea name="prompt" id="prompt" placeholder="더 자세한 표현을 하고싶으시면 프롬프트를 입력해주세요. 모델의 행동, 분위기를 지정하실수도 있고, 미처 올리지 못한 악세서리(모자, 시계, 백, 신발등)을 텍스트로 입력하셔도 됩니다. 당신의 상상력이 바로 실현되는 마법을 확인하세요!&#13;&#10;&#13;&#10;예시.&#13;&#10;모델이 셀카를 찍으며 웃고있어.&#13;&#10;모델이 커피를 마시며 책을 보고있어.&#13;&#10;9등신 / 패션모델 / 시계 / 하이힐 / 검정팬티스타킹" class="w-full h-[234px] bg-none border-none text-[12px] leading-[1.33] text-[#ffffff] placeholder-[#a3a2c3] focus:outline-none resize-none"></textarea>
							</li>
						</ul>
					</li>
				</ul>	
			</section>				

			<section class="relative mt-[30px]">
                <div class="relative px-[20px] flex flex-col">
					<button type="button" class="flex items-center justify-center gap-[6px] border border-[#fb7c3e] rounded-[20px] py-[23px] bg-[#d45f26] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)]">
						<img src="img/ic_shooting.svg" alt="" class="w-[22px]">
						<span class="font-semibold text-[18px] leading-none text-[#ffffff]">AI영상 제작</span>
					</button>
				</div>
			</section>	
			
        </div>

        <!-- nav -->
        <nav class="sticky bottom-0 z-50 bg-[#1f2031] rounded-[20px_20px_0_0] mt-[44px]">
            <div class="h-[74px] flex items-end justify-between pt-[14px] pb-[11px] px-[22px]">
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[8px] items-center">
						<img src="img/nav_home.svg" alt="Home" class="w-[30px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">Home</span>
					</a>
				</div>
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[8px] items-center">
						<img src="img/nav_create.svg" alt="생성한 리스트" class="w-[30px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">생성한 리스트</span>
					</a>
				</div>
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[10px] items-center">
						<img src="img/nav_AI.svg" alt="AI 생성" class="w-[50px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">AI 생성</span>
					</a>
				</div>
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[8px] items-center">
						<img src="img/nav_token.svg" alt="토큰지갑" class="w-[30px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">토큰지갑</span>
					</a>
				</div>
				<div class="relative">
					<a href="#none" class="flex flex-col gap-[8px] items-center">
						<img src="img/nav_mypage.svg" alt="마이페이지" class="w-[30px]">
						<span class="font-semibold text-[11px] leading-none text-center text-[#a3a2c3]">마이페이지</span>
					</a>
				</div>
            </div>
        </nav>

    </div>

</body>


<script>	
	function toggleAccordion(el) {
		const target = el.nextElementSibling;
		const arrow = el.querySelector('img');

		if (!target) return;

		const isVisible = target.style.display === 'block' || getComputedStyle(target).display !== 'none';

		if (isVisible) {
			target.style.display = 'none';
			if (arrow) arrow.style.transform = 'rotate(0deg)';
		} else {
			target.style.display = 'block';
			if (arrow) arrow.style.transform = 'rotate(180deg)';
		}
	}
</script>


</html>
