<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVA</title>
	
    <!-- Font -->
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

	<!-- swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

	<!-- Tailwind -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	
	<!-- Tailwind v4 자동완성용 / 임시추가 -->
	<link rel="stylesheet" href="css/temp.css">

</head>


<body class="bg-[#2d2d47] text-white min-h-svh font-[Pretendard,sans-serif]">
	
    <div class="flex flex-col min-h-screen ">

        <!-- header -->
        <header class="relative my-[22px]">
            <div class="h-[40px] px-[20px] py-0 flex items-center justify-between gap-[16px]">
               	<div class="flex items-center justify-center w-[40px]">
					<img src="img/header_back.svg" alt="뒤로가기">
                </div>
                <p class="flex-1 font-semibold text-[18px] leading-none text-[#ffffff] text-center">회원가입</p>
               	<div class="flex items-center justify-center w-[40px]">
				</div>
            </div>
        </header>

        <!-- container -->
        <div class="flex flex-col flex-1">

            <section class="relative mb-[20px]">
                <div class="relative px-[20px]">
					<div class="flex items-start gap-[0] mb-[54px]">
						<p class="font-medium text-[22px] leading-[1.14] text-[#ffffff] break-keep">
							<span class="font-extrabold">당신</span>의 <span class="font-extrabold">스타일</span>을 알려주세요 <br>
							<span class="font-semibold text-[16px] leading-[1.13]">AIVA는 당신의 스타일을 반영해드립니다</span>
						</p>
						<p class="text-[14px] leading-none text-[#ffffff] mt-[4px]"><span class="font-bold">3</span> / 3</p>
					</div>
					<div class="flex flex-col gap-[54px]">
						<div class="flex flex-col gap-[11px]">
							<p class="font-semibold text-[16px] leading-[1.13] text-[#ffffff]">선호하는 스타일이 무엇인가요?</p>
							<div class="flex flex-wrap gap-[7px]">
								<span class="min-w-[48px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">스트릿</span>
								<span class="min-w-[50px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">미니멀</span>
								<span class="min-w-[50px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">캐주얼</span>
								<span class="min-w-[50px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">페미닌</span>
								<span class="min-w-[50px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">빈티지</span>
								<span class="min-w-[50px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">모던</span>
							</div>
						</div>
						<div class="flex flex-col gap-[11px]">
							<p class="font-semibold text-[16px] leading-[1.13] text-[#ffffff]">당신의 직업은 무엇인가요?</p>
							<div class="flex flex-wrap gap-[7px]">
								<span class="min-w-[102px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">패션 디자이너</span>
								<span class="min-w-[102px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">브랜드 마케터</span>
								<span class="min-w-[102px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">도/소매 셀러</span>
								<span class="min-w-[102px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">스타일리스트</span>
								<span class="min-w-[102px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">온라인 셀러</span>
								<span class="min-w-[85px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">인플루언서</span>
								<span class="min-w-[151px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">유튜버 / 영상 제작자</span>
								<span class="min-w-[88px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">포토그래퍼</span>
								<span class="min-w-[66px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">프리랜서</span>
								<span class="min-w-[235px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">MD / 광고 / 퍼포머니스 마케터</span>
								<span class="min-w-[124px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">그래픽 디자이너</span>
								<span class="min-w-[124px] min-h-[28px] flex items-center justify-center border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)] px-[4px] font-semibold text-[16px] leading-none text-center text-[#ffffff]">
									기타 (<input type="text" placeholder="직접입력" class="w-[60px] font-semibold text-[16px] leading-none text-center text-[#ffffff] placeholder:text-[rgba(255,255,255,0.7)] border-none bg-none">)
								</span>
							</div>
						</div>
					</div>
				</div>
			</section>		

        </div>

        <!-- button -->
        <div class="sticky bottom-0 z-50 px-[20px] pb-[20px] mt-[46px]">
            <div class="flex flex-col gap-[12px]">
				<button type="button" class="h-[45px] flex items-center justify-center rounded-[10px] border border-[#fb7c3e] bg-[#d45f26]">
					<span class="font-semibold text-[16px] text-[#fff]">가입 완료</span>
				</button>
				<button type="button" class="h-[45px] flex items-center justify-center rounded-[10px] border border-[#4f4d76] bg-[#403f5e]">
					<span class="font-semibold text-[16px] text-[#fff]">넘어가기</span>
				</button>
            </div>
        </div>
    </div>

</body>
 

</html>
