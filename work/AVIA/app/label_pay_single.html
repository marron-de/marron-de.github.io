<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVA</title>
	
    <!-- Font -->
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

	<!-- swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

	<!-- Tailwind -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	
	<!-- Tailwind v4 자동완성용 / 임시추가 -->
	<link rel="stylesheet" href="css/temp.css">

</head>


<body class="bg-[#2d2d47] text-white min-h-svh font-[Pretendard,sans-serif]">
	
    <div class="flex flex-col min-h-screen ">

        <!-- header -->
        <header class="relative my-[22px]">
            <div class="h-[40px] px-[20px] py-0 flex items-center justify-between gap-[16px]">
               	<div class="flex items-center justify-center w-[40px]">
					<img src="img/header_back.svg" alt="뒤로가기">
                </div>
                <p class="flex-1 font-semibold text-[18px] leading-none text-[#ffffff] text-center">라벨 충전하기</p>
               	<div class="flex items-center justify-center w-[40px]">
				</div>
            </div>
        </header>

        <!-- container -->
        <div class="flex flex-col flex-1 mt-[5px]">

            <section class="relative mb-[20px]">
                <div class="relative px-[20px]">
					<div class="flex flex-col p-[20px] bg-[#212238] rounded-[20px]">
						<div class="flex items-center justify-between mb-[18px]">
							<p class="flex-1 font-semibold text-[14px] leading-none text-[#a3a2c3]">내가 보유한 라벨 수</p>
							<div class="flex items-center gap-[4px]">
								<p class="font-bold text-[20px] leading-none text-[#fb7c3e]">1,289Ⓛ</p>
								<button type="button" class="flex items-center justify-center w-[11px]">
									<img src="img/ico_alert.svg" alt="">
								</button>
							</div>
						</div>
						<div class="flex items-center justify-between mb-[18px]">
							<p class="flex-1 font-semibold text-[14px] leading-none text-[#a3a2c3]">현재 플랜</p>
							<p class="font-bold text-[20px] leading-none text-[#ffffff]">Premium</p>
						</div>
						<div class="flex gap-[10px] mb-[20px]">
							<button class="flex-1 h-[46px] flex items-center justify-center gap-[5px] bg-[#d45f26] font-semibold text-[13px] leading-none text-[#ffffff] rounded-[10px] border border-[#fb7c3e]">
								<img src="img/ico_cash.svg" alt="단건 구매" class="w-[24px]">
								<span>단건 구매</span>
							</button>
							<button class="flex-1 h-[46px] flex items-center justify-center gap-[5px] bg-[#2d2d47] font-semibold text-[13px] leading-none text-[#ffffff] rounded-[10px]">
								<img src="img/ico_coin.svg" alt="월 구독" class="w-[24px]">
								<span>월 구독</span>
							</button>
						</div>
						<div class="w-full h-px bg-[#403f5e] mb-[25px]"></div>
						<div class="flex flex-wrap justify-between gap-[20px]"> 
							<div class="w-[130px] h-[100px] flex flex-col justify-between rounded-[10px] bg-[#2d2d47] py-[13px] px-[13px] border border-[#d45f26] shadow-[4px_4px_4px_0_rgba(0,0,0,0.25)]">
								<div class="flex flex-col items-center gap-[2px]">
									<p class="font-semibold text-[18px] leading-none text-[#d45f26]">￦6,500</p>
									<p class="font-semibold text-[13px] leading-[1.3] text-[#ffffff]">100 라벨</p>
								</div>
								<button type="button" class="flex items-center justify-center rounded-[5px] py-[5px] bg-[#d45f26] font-semibold text-[13px] leading-none text-[#ffffff]">구매하기</button>
							</div>
							<div class="w-[130px] h-[100px] flex flex-col justify-between rounded-[10px] bg-[#2d2d47] py-[13px] px-[13px]">
								<div class="flex flex-col items-center gap-[2px]">
									<p class="font-semibold text-[18px] leading-none text-[#d45f26]">￦19,500</p>
									<p class="font-semibold text-[13px] leading-[1.3] text-[#ffffff]">300 라벨</p>
								</div>
								<button type="button" class="flex items-center justify-center rounded-[5px] py-[5px] bg-[#d45f26] font-semibold text-[13px] leading-none text-[#ffffff]">구매하기</button>
							</div>
							<div class="w-[130px] h-[100px] flex flex-col justify-between rounded-[10px] bg-[#2d2d47] py-[13px] px-[13px]">
								<div class="flex flex-col items-center gap-[2px]">
									<p class="font-semibold text-[18px] leading-none text-[#d45f26]">￦32,500</p>
									<p class="font-semibold text-[13px] leading-[1.3] text-[#ffffff]">500 라벨</p>
								</div>
								<button type="button" class="flex items-center justify-center rounded-[5px] py-[5px] bg-[#d45f26] font-semibold text-[13px] leading-none text-[#ffffff]">구매하기</button>
							</div>
							<div class="w-[130px] h-[100px] flex flex-col justify-between rounded-[10px] bg-[#2d2d47] py-[13px] px-[13px]">
								<div class="flex flex-col items-center gap-[2px]">
									<p class="font-semibold text-[18px] leading-none text-[#d45f26]">￦52,000</p>
									<p class="font-semibold text-[13px] leading-[1.3] text-[#ffffff]">800 라벨</p>
								</div>
								<button type="button" class="flex items-center justify-center rounded-[5px] py-[5px] bg-[#d45f26] font-semibold text-[13px] leading-none text-[#ffffff]">구매하기</button>
							</div>
							<div class="w-[130px] h-[100px] flex flex-col justify-between rounded-[10px] bg-[#2d2d47] py-[13px] px-[13px]">
								<div class="flex flex-col items-center gap-[2px]">
									<p class="font-semibold text-[18px] leading-none text-[#d45f26]">￦65,000</p>
									<p class="font-semibold text-[13px] leading-[1.3] text-[#ffffff]">1000 라벨</p>
								</div>
								<button type="button" class="flex items-center justify-center rounded-[5px] py-[5px] bg-[#d45f26] font-semibold text-[13px] leading-none text-[#ffffff]">구매하기</button>
							</div>
						</div>
					</div>
				</div>
			</section>	

        </div>
    </div>

</body>


</html>
