<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVA</title>
	
    <!-- Font -->
    <link rel="stylesheet" href="css/Pretendard.css">
    <link rel="stylesheet" href="css/Paperlogy.css">

	<!-- swiper -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
	<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

	<!-- Tailwind -->
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	
	<!-- Tailwind v4 자동완성용 / 임시추가 -->
	<link rel="stylesheet" href="css/temp.css">

</head>


<body class="bg-[#2d2d47] text-white min-h-svh font-[Pretendard,sans-serif]">
	
    <div class="flex flex-col min-h-screen ">

        <!-- header -->
        <header class="relative my-[22px]">
            <div class="h-[40px] px-[20px] py-0 flex items-center justify-between gap-[16px]">
               	<div class="flex items-center justify-center w-[40px]">
					<img src="img/header_back.svg" alt="뒤로가기">
                </div>
                <p class="flex-1 font-semibold text-[18px] leading-none text-[#ffffff] text-center">로그인</p>
               	<div class="flex items-center justify-center w-[40px]">
				</div>
            </div>
        </header>

        <!-- container -->
        <div class="flex flex-col flex-1">

            <section class="relative mb-[20px]">
                <div class="relative px-[20px]">
					<div class="flex gap-[20px] mb-[24px]">
						<button type="button" class="flex-1 h-[27px] border border-[#1d1e31] rounded-[10px] bg-[#212238] shadow-[inset_4px_4px_4px_0_rgba(0,0,0,0.25)]">
							<span class="font-semibold text-[16px] leading-none text-center color-[#fff]">개인회원</span>
						</button>
						<button type="button" class="flex-1 h-[27px] border border-[#4f4d76] rounded-[10px] bg-[#403f5e] shadow-[0_4px_8px_0_rgba(0,0,0,0.15)]">
							<span class="font-semibold text-[16px] leading-none text-center color-[#fff]">기업회원</span>
						</button>
					</div>
					<div class="flex flex-col gap-[12px] mb-[14px]">
						<div class="flex flex-col gap-[10px]">
							<input type="text" placeholder="아이디" class="border border-[#4f4d76] rounded-[10px] bg-[#403f5e] w-full h-[45px] px-[10px] font-semibold text-[16px] text-[#ffffff] placeholder:text-[rgba(255,255,255,0.7)]">
							<input type="text" placeholder="비밀번호" class="border border-[#4f4d76] rounded-[10px] bg-[#403f5e] w-full h-[45px] px-[10px] font-semibold text-[16px] text-[#ffffff] placeholder:text-[rgba(255,255,255,0.7)]">
						</div>
						<div class="flex items-center gap-[15px]">
							<div class="flex items-center gap-[10px]">
								<input type="checkbox" name="save_id" id="save_id" class="appearance-none w-[30px] h-[30px] rounded-[10px] border-0 cursor-pointer bg-[url('img/checkbox_off.svg')] bg-center bg-no-repeat bg-contain checked:bg-[url('img/checkbox_on.svg')] peer">
								<label for="save_id" class="flex-1 text-[16px] leading-none text-[#ffffff] cursor-pointer peer-checked:text-[#ffffff]">아이디 저장</label>
							</div>
							<div class="flex items-center gap-[10px]">
								<input type="checkbox" name="auto_login" id="auto_login" class="appearance-none w-[30px] h-[30px] rounded-[10px] border-0 cursor-pointer bg-[url('img/checkbox_off.svg')] bg-center bg-no-repeat bg-contain checked:bg-[url('img/checkbox_on.svg')] peer">
								<label for="save_id" class="flex-1 text-[16px] leading-none text-[#ffffff] cursor-pointer peer-checked:text-[#ffffff]">자동 로그인</label>
							</div>
						</div>
					</div>
					<div class="flex mb-[26px]">
						<button type="button" class="flex-1 h-[45px] border border-[#fb7c3e] rounded-[10px] bg-[#d45f26]">
							<span class="font-semibold text-[16px] leading-none text-center color-[#fff]">로그인</span>
						</button>
					</div>
					<div class="flex items-center justify-center gap-[24px] mb-[33px]">
						<button type="button" class="flex items-center justify-center">
							<span class="font-semibold text-[14px] leading-none text-center text-[#ffffff]">아이디 찾기</span>
						</button>
						<span class="font-semibold text-[14px] leading-none text-center text-[#ffffff]">/</span>
						<button type="button" class="flex items-center justify-center">
							<span class="font-semibold text-[14px] leading-none text-center text-[#ffffff]">비밀번호 찾기</span>
						</button>
						<span class="font-semibold text-[14px] leading-none text-center text-[#ffffff]">/</span>
						<button type="button" class="flex items-center justify-center">
							<span class="font-semibold text-[14px] leading-none text-center text-[#ffffff]">회원가입</span>
						</button>
					</div>
					<div class="flex flex-col gap-[26px]">
						<p class="flex items-center gap-[8px]">
							<span class="flex-1 h-px bg-[#403f5e]"></span>
							<span class="font-semibold text-[14px] leading-none text-center color-[#fff]">소셜 계정으로 간편 가입하기</span>
							<span class="flex-1 h-px bg-[#403f5e]"></span>
						</p>
						<div class="flex items-center justify-between">
							<button type="button" class="flex items-center justify-center w-[40px]">
								<img src="img/ico_kakao.svg" alt="">
							</button>
							<button type="button" class="flex items-center justify-center w-[40px]">
								<img src="img/ico_facebook.svg" alt="">
							</button>
							<button type="button" class="flex items-center justify-center w-[40px]">
								<img src="img/ico_naver.svg" alt="">
							</button>
							<button type="button" class="flex items-center justify-center w-[40px]">
								<img src="img/ico_google.svg" alt="">
							</button>
							<button type="button" class="flex items-center justify-center w-[40px]">
								<img src="img/ico_apple.svg" alt="">
							</button>
						</div>
					</div>
				</div>
			</section>	

        </div>
    </div>

</body>
 

</html>
